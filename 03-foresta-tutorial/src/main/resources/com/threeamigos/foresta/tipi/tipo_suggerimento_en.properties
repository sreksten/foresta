# The tutorial hints: one page for each thing you can do (three at most). COSTANTE.PAGINA_n; the touch variant is COSTANTE.PAGINA_n.TOCCO
SCELTA_DELLA_CLASSE.PAGINA_1=This is the most important choice: the class decides how you will play. The icons below are the classes: hover over an icon to read that class's sheet, with its abilities, strengths and weaknesses, and press it to choose it. Or browse the list on the left.
SCELTA_DELLA_CLASSE.PAGINA_1.TOCCO=This is the most important choice: the class decides how you will play. The icons below are the classes. Tap a name in the list on the left to read that class's sheet, with its abilities, strengths and weaknesses, then press its icon to choose it.
SCELTA_DELLA_CLASSE.PAGINA_2=If this is your first time, we suggest the Warrior, the Cleric or the Thief: they are the easiest to use and hold up well in the first fights (the Cleric also heals the party). The Mage, the Druid and the Elf have spells and magic powers but are more fragile; the Bard and the Priest help the party more than they fight.
PRIMI_PASSI.PAGINA_1=Welcome! The screen is split in panels: the party, quests, the map and, once you have some, spells and potions. Click on a panel to bring it to the front and read it better.
PRIMI_PASSI.PAGINA_1.TOCCO=Welcome! The screen is split in panels: the party, quests, the map and, once you have some, spells and potions. Tap a panel to bring it to the front and read it better.
PRIMI_PASSI.PAGINA_2=These hints appear only once, when they are needed. If you don't want them, press the cancel icon below: the tutorial is switched off for good, and you can switch it on again when you start a game.
BARRA_DELLE_ICONE.PAGINA_1=This is the icon bar: it shows only the commands you can give right now, so it changes in every situation. If a command is missing, it can't be used at the moment.
BARRA_DELLE_ICONE.PAGINA_2=Can't remember what an icon does? Turn the help on with the question mark, then move the mouse over the icon without clicking: you'll read its description.
BARRA_DELLE_ICONE.PAGINA_2.TOCCO=Can't remember what an icon does? Turn the help on with the question mark, then slide your finger over the icon: you'll read its description without running the command.
MOVIMENTO_E_MAPPA.PAGINA_1=The arrows let you choose where to go: north, east, south, west. Then choose how many steps to take: each step costs an hour. The journey stops anyway at the first location that is not a wood or a clearing (a town, an inn, a temple, ruins, a cave, a marsh...) and at the edge of the map: there you stop and see what is there.
MOVIMENTO_E_MAPPA.PAGINA_2=This panel is the map: it shows the area you know and where the party is. It fills in as you explore.
MOVIMENTO_E_MAPPA.PAGINA_3=The map icon opens it full screen: you see everything you know, what you have already visited and the latest news from the inns.
JOYSTICK_DELLA_MAPPA.PAGINA_1=This disc is a virtual joystick: hold it down and a hand moves over the map. Where it points, you read the name of the place.
TRASCINARE_LA_MAPPA.PAGINA_1=The map is bigger than the screen: click and drag to see the other areas.
TRASCINARE_LA_MAPPA.PAGINA_1.TOCCO=The map is bigger than the screen: drag your finger to see the other areas.
INVENTARIO.PAGINA_1=This is the inventory: two lists side by side, the party's and the selected character's. Double-click an object to equip it, or to put it back in the party's inventory.
INVENTARIO.PAGINA_1.TOCCO=This is the inventory: two lists side by side, the party's and the selected character's. Double-tap an object to equip it, or to put it back in the party's inventory.
LIVELLO_SALITO.PAGINA_1=A character has gone up a level! You can see it in the party panel: they now have a skill point to spend to become stronger.
LIVELLO_SALITO.PAGINA_2=To spend it, open the inventory with this icon and choose the character: there you can raise their attributes.
ATTRIBUTI.PAGINA_1=Every character has attributes. The primary ones, like strength or intelligence, are raised by spending skill points; the secondary ones, like accuracy or parry, can't be touched: they grow by themselves when the primary ones they depend on go up.
ATTRIBUTI.PAGINA_2=Attributes can also be raised with artifacts: a weapon, armor or jewel you equip can give a bonus to the attributes of whoever wears it, for as long as they wear it.
PUNTI_ABILITA.PAGINA_1=Someone has skill points to spend! You can tell by the primary attributes shown in orange on the character sheet. Double-click a primary attribute to raise it by one, and the secondary attributes that depend on it grow with it.
PUNTI_ABILITA.PAGINA_1.TOCCO=Someone has skill points to spend! You can tell by the primary attributes shown in orange on the character sheet. Double-tap a primary attribute to raise it by one, and the secondary attributes that depend on it grow with it.
INVENTARIO.PAGINA_2=The icons at the bottom open other pages: the trophies, the bestiary, the grimoire with the spells and, after the first fights, the combat tactics.
COMBATTIMENTO.PAGINA_1=A monster! In this panel you see who is acting and who is the target, and everyone's health bars. Your characters follow a tactic: they choose by themselves who to hit and how. For now you attack, one blow at a time, with the attack icon.
RECUPERO_FRA_LOCAZIONI.PAGINA_1=When you move to a new place your characters recover some health and magic: look at the bars. There is no need to drink a potion after every fight, save them for when you are really hurt.
COMBATTIMENTO_AUTOMATICO.PAGINA_1=Now you can let your characters get on with it: with this icon the fight goes on by itself, turn after turn, following their tactics, until the battle is over. If you want to take control again, the interrupt icon stops it.
OGGETTO_TROVATO.PAGINA_1=You found an object! If it can be equipped and only one member of the party can use it right away, they take it and equip it by themselves; if more than one can use it, you choose who takes it.
POZIONI.PAGINA_1=Someone is wounded. Health potions heal right away; the large ones heal more and also raise the maximum health. Drink the potions only when needed: you don't have many.
SCELTE_IN_COMBATTIMENTO.PAGINA_1=Now you have more choices. Besides attacking yourself or letting the tactics do the work, you can also flee, but it costs wounds and part of your supplies, or try to sneak past.
MISSIONI.PAGINA_1=This panel lists your current quests. Bring it to the front to read it, scroll the list with the mouse wheel and click a quest to close or reopen it.
MISSIONI.PAGINA_1.TOCCO=This panel lists your current quests. Bring it to the front to read it, scroll the list by dragging and tap a quest to close or reopen it.
MISSIONI.PAGINA_2=When you see these four blue arrows, the list can be scrolled: drag it with the mouse or use the wheel.
MISSIONI.PAGINA_2.TOCCO=When you see these four blue arrows, the list can be scrolled: drag it with your finger.
MISSIONI.PAGINA_2.ICONA=FRECCIA_SINISTRA,FRECCIA_DESTRA,FRECCIA_SU,FRECCIA_GIU
TATTICHE.PAGINA_1=You have seen how your characters choose what to do by themselves: that's their tactic. Open the inventory (the icon below) and you will find the tactics: from there you can change it for each of them, for example to heal whoever is hurt or to hit the weakest first. It's worth a look!
CORRUZIONE.PAGINA_1=You can bribe this enemy: pay a few coins and it goes away without a fight. It doesn't always work, but if it does you lose no health.
AMICIZIA.PAGINA_1=You can also try to befriend this enemy: a character gives it a go, and the more charismatic they are the better the chances. A friend may give you help, information or an object.
INCANTESIMI.PAGINA_1=This icon opens the list of what you can cast: spells and, for some classes, innate abilities. You choose who casts or uses it; the tactic picks the target.
INCANTESIMI.PAGINA_2=The panel shows how many spells you have for each element. Each spell uses up a scroll and a little magic; innate abilities use no scrolls, but then need a few turns to recharge.
BOTTEGHE.PAGINA_1=Welcome to town. Here you find the innkeeper, the armourer, the scroll seller, the alchemist and the enchanter: buy and sell, and have an artefact enchanted. Haggle: the price depends on who does the talking.
BOTTEGHE.PAGINA_2=Sells weapons and armour.
BOTTEGHE.PAGINA_2.TITOLO=Armourer
BOTTEGHE.PAGINA_2.ICONA=ARMAIOLO
BOTTEGHE.PAGINA_3=Sells spells.
BOTTEGHE.PAGINA_3.TITOLO=Scroll seller
BOTTEGHE.PAGINA_3.ICONA=VENDITORE_DI_PERGAMENE
BOTTEGHE.PAGINA_4=Sells potions.
BOTTEGHE.PAGINA_4.TITOLO=Alchemist
BOTTEGHE.PAGINA_4.ICONA=ALCHIMISTA
BOTTEGHE.PAGINA_5=Improves artefacts.
BOTTEGHE.PAGINA_5.TITOLO=Enchanter
BOTTEGHE.PAGINA_5.ICONA=INCANTATORE
ACCAMPAMENTO.PAGINA_1=It's night. You can make camp to rest and recover health and magic, but someone must keep watch: a party sleeping without a guard risks nasty surprises.
GESTI_SUL_TOCCO.PAGINA_1=Gestures: a tap selects, a double tap opens, a long press explains and dragging moves or scrolls.
OGGETTO_TROVATO.PAGINA_2=If nobody can use it, the object goes into the party's inventory. From the inventory icon you can always change who carries what or hand an object to a companion. A new weapon can change a lot in the next fight.
LUOGHI.PAGINA_1=The wood is the way through: you walk among the trees and may meet monsters or find objects.
LUOGHI.PAGINA_1.TITOLO=Wood
LUOGHI.PAGINA_1.ICONA=BOSCO
LUOGHI.PAGINA_2=Like the wood, but here ingredients for the alchemist also grow.
LUOGHI.PAGINA_2.TITOLO=Clearing
LUOGHI.PAGINA_2.ICONA=RADURA
LUOGHI.PAGINA_3=The place to catch your breath: you pay to eat and stay the night, and the party recovers its health. The innkeeper tells news and rumours, and now and then someone asks to join your adventure: this is how you find companions. If you are in trouble, look for an inn.
LUOGHI.PAGINA_3.TITOLO=Inn
LUOGHI.PAGINA_3.ICONA=LOCANDA
LUOGHI.PAGINA_4=Nyena, Malgaard, Ruuna and Fleena: each has an inn and shops.
LUOGHI.PAGINA_4.TITOLO=Town
LUOGHI.PAGINA_4.ICONA=CITTA_NYENA
LUOGHI.PAGINA_5=Temples are guarded by wyverns, but they keep a chest or an artefact.
LUOGHI.PAGINA_5.TITOLO=Temple
LUOGHI.PAGINA_5.ICONA=TEMPIO
LUOGHI.PAGINA_6=Hides a chest the first time you visit, but sometimes a wyvern or a hermit lives there.
LUOGHI.PAGINA_6.TITOLO=Cave
LUOGHI.PAGINA_6.ICONA=GROTTA
LUOGHI.PAGINA_7=What is left of ancient places: unwelcoming creatures live there.
LUOGHI.PAGINA_7.TITOLO=Ruins
LUOGHI.PAGINA_7.ICONA=ROVINE
LUOGHI.PAGINA_8=It is the lair of one of the five strongest enemies, the Dragon included: the Dragon's is hidden by a spell until you have defeated the others. They are the most dangerous places: go there prepared.
LUOGHI.PAGINA_8.TITOLO=Castle
LUOGHI.PAGINA_8.ICONA=CASTELLO_DRAGO
SCHERMATA_DELLE_TATTICHE.PAGINA_1=This is the character's tactic: a list of entries, read from top to bottom. The character looks at the first entry: if they can do it, they do it and their turn ends; otherwise they move on to the second, and so on. If no entry can be done, they attack.
SCHERMATA_DELLE_TATTICHE.PAGINA_2=Order matters: what you want to do first goes at the top. The number of each entry switches it on (green) or off (red: it is skipped); click the name to fold the entry and make it shorter; double-click to rename it.
SCHERMATA_DELLE_TATTICHE.PAGINA_2.TOCCO=Order matters: what you want to do first goes at the top. The number of each entry switches it on (green) or off (red: it is skipped); tap the name to fold the entry and make it shorter; double-tap to rename it.
SCHERMATA_DELLE_TATTICHE.PAGINA_3=To the right of each entry there are three icons: one moves it up, one moves it down and one removes it. At the end of the list "New entry" adds one; the gray line below, the backup attack, is always there and cannot be removed.
SCHERMATA_DELLE_TATTICHE.PAGINA_4=Colors: the number of an entry is green if the entry applies and red if it is switched off (and then the whole entry turns dark gray and is skipped). Yellow numbers are values you change with the - and + buttons. The backup attack is dark gray too.
SCHERMATA_DELLE_TATTICHE.PAGINA_5=You don't have to learn anything by heart: move the mouse over a line and here on the right you read what it means, and how the whole entry reads.
SCHERMATA_DELLE_TATTICHE.PAGINA_5.TOCCO=You don't have to learn anything by heart: tap a line and here on the right you read what it means, and how the whole entry reads.
SCHERMATA_DELLE_TATTICHE.PAGINA_6=Every entry answers a few questions. The first: on whom? An enemy, an ally or the character themselves: it is the word after "on".
SCHERMATA_DELLE_TATTICHE.PAGINA_7=The second: which of them? These are the filters, after the word "with": for example "with health percentage less than 40". Each filter removes some candidates: "(add a filter)" adds another, the icon next to it removes it.
SCHERMATA_DELLE_TATTICHE.PAGINA_8=The third: which one of these? If several candidates are left, one is picked by the ordering: the first, the one with the least health, a random one... If none is left, the entry is skipped and the next one is tried.
SCHERMATA_DELLE_TATTICHE.PAGINA_9=An entry can have conditions, after the word "if": for example "if round greater than 2" or "in 30% of cases". They are for things that don't concern a target. An entry without conditions always applies; add them with "(add a condition)" and remove them with the icon next to it.
SCHERMATA_DELLE_TATTICHE.PAGINA_10=After "do" come the actions, in order: the first one that can be done is done. Potions, scrolls and magic are checked by the game itself: if they run out, the next action is tried, then the next entry. With "(add an action)" you add more, with the icon next to one you remove it; where "only if stronger" shows in yellow, the action is done only if it does more than the weapon attack (a click turns it into "always").
SCHERMATA_DELLE_TATTICHE.PAGINA_11=When you are done, press Yes to confirm or No to cancel. Default puts back the recommended tactic for this class. Changes apply to one character at a time: if you switch to another one without confirming, you lose them.
SCHERMATA_DELLE_TATTICHE.PAGINA_12=A tip: put the special entries at the top (for example healing whoever is hurt) and the general ones at the bottom (for example attacking the first enemy). Tactics can't be changed during a fight.
NON_ANCORA_IL_MOMENTO.PAGINA_1=It is not yet time to visit {0}: choose another direction.
RESURREZIONE.PAGINA_1=A companion has fallen! They can't fight while down, but it's not over: they can be brought back to life.
RESURREZIONE.PAGINA_2=You need a Resurrection spell: you can find some out there, or buy them from the alchemist in town.
RESURREZIONE.PAGINA_3=When you have one, cast it from the spells icon and choose who to bring back to life.
EFFETTI_DI_STATO.PAGINA_1=A status effect! Attacks, spells and potions can leave an effect on whoever is hit: a message appears on the character.
EFFETTI_DI_STATO.PAGINA_2=Status effects can improve a character's abilities (like the Bard's inspiration) or give maluses (like poison or being wet). Both last a few turns.
REAZIONI_ELEMENTALI.PAGINA_1=An elemental reaction! A status effect plus a certain type of attack can set off a reaction that increases the damage: for example, someone who is wet and gets hit by lightning takes much more.
REAZIONI_ELEMENTALI.PAGINA_2=In the grimoire, which opens from the inventory, you can find which types of spell react with which statuses.
AVANZA_VERSO_I_BOSCHI.PAGINA_1=Now try heading for a wooded area or a clearing: on the map they are the tiles with trees or grass. Temples, caves, inns and towns can wait: for now you would stop there without being ready.
AVANZA_VERSO_I_BOSCHI.PAGINA_1.ICONA=BOSCO,RADURA
SCELTA_DEL_PERSONAGGIO.PAGINA_1=When more than one character can perform the action, you must decide who does it: the bar shows the icons of those who can, click the one of the character you choose.
SCELTA_DEL_PERSONAGGIO.PAGINA_1.TOCCO=When more than one character can perform the action, you must decide who does it: the bar shows the icons of those who can, tap the one of the character you choose.
COMPAGNO_IN_LOCANDA.PAGINA_1=Someone wants to join your party! If you accept, they become a permanent member of the party: one more character fighting at your side.
COMPAGNO_IN_LOCANDA.PAGINA_2=Inns, however, cost more as the number of characters grows: each one pays for their own meal and bed. Still, it is better to have one more companion.
