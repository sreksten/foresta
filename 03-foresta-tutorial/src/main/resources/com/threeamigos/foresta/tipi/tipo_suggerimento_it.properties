# I suggerimenti del tutorial: una pagina per ogni cosa che si può fare (al massimo tre). COSTANTE.PAGINA_n; la variante per il dito è COSTANTE.PAGINA_n.TOCCO
PRIMI_PASSI.PAGINA_1=Benvenuto! Lo schermo è diviso in riquadri: il gruppo, gli incantesimi e le pozioni, le missioni, la mappa. Clicca su uno per portarlo in primo piano e leggerlo meglio; cliccaci ancora per rimetterlo a posto.
PRIMI_PASSI.PAGINA_1.TOCCO=Benvenuto! Lo schermo è diviso in riquadri: il gruppo, gli incantesimi e le pozioni, le missioni, la mappa. Tocca un riquadro per portarlo in primo piano e leggerlo meglio; toccalo ancora per rimetterlo a posto.
PRIMI_PASSI.PAGINA_2=Questi suggerimenti compaiono una volta sola, quando servono. Se non li vuoi, premi l'icona di annullamento qui sotto: il tutorial si spegne per sempre, e a inizio partita puoi riaccenderlo.
BARRA_DELLE_ICONE.PAGINA_1=Questa è la barra delle icone: mostra solo i comandi che puoi dare adesso, quindi cambia a ogni situazione. Se un comando non c'è, in questo momento non si può usare.
BARRA_DELLE_ICONE.PAGINA_2=Non ricordi cosa fa un'icona? Premi il punto interrogativo e poi l'icona: ne leggi la descrizione.
BARRA_DELLE_ICONE.PAGINA_2.TOCCO=Non ricordi cosa fa un'icona? Tienila premuta: ne leggi la descrizione.
MOVIMENTO_E_MAPPA.PAGINA_1=Con le frecce scegli dove andare: nord, est, sud, ovest. Ogni spostamento è un passo e ti porta in una nuova locazione, dove puoi trovare mostri e oggetti.
MOVIMENTO_E_MAPPA.PAGINA_2=L'icona della mappa la apre a tutto schermo: vedi dove sei, cosa hai già visitato e le ultime notizie delle locande. Trascinala per spostarti.
MOVIMENTO_E_MAPPA.PAGINA_2.TOCCO=L'icona della mappa la apre a tutto schermo: vedi dove sei, cosa hai già visitato e le ultime notizie delle locande. Trascina il dito per spostarti, o usa il joystick sullo schermo.
COMBATTIMENTO.PAGINA_1=Un mostro! In questo riquadro vedi chi agisce e chi è il bersaglio, e le barre della salute di ognuno. I tuoi personaggi seguono una tattica: scelgono da soli chi colpire e come, tu decidi solo se attaccare.
OGGETTO_TROVATO.PAGINA_1=Hai trovato un oggetto! Aprendo l'inventario lo puoi equipaggiare a un personaggio che sappia usarlo, oppure passarlo a un compagno. Un'arma nuova può cambiare molto il prossimo scontro.
POZIONI.PAGINA_1=Qualcuno è ferito. Le pozioni di salute lo curano subito; quelle grandi lo curano di più e alzano anche il massimo della sua salute. Bevi le piccole solo quando serve: sono poche.
SCELTE_IN_COMBATTIMENTO.PAGINA_1=Ora hai più scelte. Il singolo attacco ti fa agire un personaggio alla volta; il combattimento lascia fare alle tattiche. Puoi anche fuggire, ma costa ferite e una parte delle scorte, o provare a passare inosservato.
MISSIONI.PAGINA_1=Questo riquadro elenca le missioni in corso. Portalo in primo piano per leggerlo, scorri l'elenco con la rotella del mouse e chiudi una missione cliccandoci sopra.
MISSIONI.PAGINA_1.TOCCO=Questo riquadro elenca le missioni in corso. Portalo in primo piano per leggerlo, scorri l'elenco trascinando e chiudi una missione toccandola.
TATTICHE.PAGINA_1=Hai visto come i tuoi personaggi scelgono da soli cosa fare: è la loro tattica. Con l'icona delle tattiche puoi cambiarla per ognuno, per esempio far curare chi sta male o colpire prima i più deboli.
CORRUZIONE.PAGINA_1=Questo avversario si può corrompere: paghi qualche moneta e se ne va senza combattere. Non sempre funziona, ma se riesce non perdi salute.
AMICIZIA.PAGINA_1=Con questo avversario puoi anche fare amicizia: un personaggio ci prova, e più è carismatico più probabilità ha. Un amico può darti un aiuto, un'informazione o un oggetto.
INCANTESIMI.PAGINA_1=Hai degli incantesimi: nel riquadro vedi quanti ne hai per ogni elemento. In combattimento puoi lanciarne uno scegliendo chi lo formula e il bersaglio. Ogni lancio consuma un incantesimo e un poco di magia.
BOTTEGHE.PAGINA_1=Benvenuto in città. Qui trovi il locandiere, l'armaiolo, il venditore di pergamene, l'alchimista e l'incantatore: compri e vendi, e puoi far incantare un artefatto. Contratta: il prezzo dipende da chi tratta.
ACCAMPAMENTO.PAGINA_1=È notte. Puoi accamparti per riposare e recuperare salute e magia, ma qualcuno deve restare di guardia: un gruppo che dorme senza guardia rischia brutte sorprese.
GESTI_SUL_TOCCO.PAGINA_1=Gesti: un tocco sceglie, un doppio tocco apre, una pressione prolungata spiega e il trascinamento sposta o scorre.
