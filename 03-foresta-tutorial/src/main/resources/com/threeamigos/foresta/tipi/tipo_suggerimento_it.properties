# I suggerimenti del tutorial: una pagina per ogni cosa che si può fare (al massimo tre). COSTANTE.PAGINA_n; la variante per il dito è COSTANTE.PAGINA_n.TOCCO
SCELTA_DELLA_CLASSE.PAGINA_1=Questa è la scelta più importante: la classe decide come giocherai. Nella barra delle icone ci sono le classi: passa sopra un'icona per leggere la scheda di quella classe, con le sue abilità, i suoi punti forti e le sue debolezze, e premila per sceglierla. Oppure scorri l'elenco a sinistra.
SCELTA_DELLA_CLASSE.PAGINA_1.TOCCO=Questa è la scelta più importante: la classe decide come giocherai. Nella barra delle icone ci sono le classi. Tocca un nome nell'elenco a sinistra per leggere la scheda di quella classe, con le sue abilità, i suoi punti forti e le sue debolezze, poi premi la sua icona per sceglierla.
SCELTA_DELLA_CLASSE.PAGINA_2=Se è la prima volta, ti consigliamo il Guerriero, il Chierico o il Ladro: sono i più semplici da usare e reggono bene i primi scontri (il Chierico, in più, cura i compagni). Il Mago, il Druido e l'Elfo hanno incantesimi e poteri magici ma sono più fragili; il Bardo e il Sacerdote aiutano il gruppo più che combattere.
PRIMI_PASSI.PAGINA_1=Benvenuto! Lo schermo è diviso in riquadri: il gruppo, le missioni, la mappa e, quando ne avrai, gli incantesimi e le pozioni. Clicca su un riquadro per portarlo in primo piano e leggerlo meglio.
PRIMI_PASSI.PAGINA_1.TOCCO=Benvenuto! Lo schermo è diviso in riquadri: il gruppo, le missioni, la mappa e, quando ne avrai, gli incantesimi e le pozioni. Tocca un riquadro per portarlo in primo piano e leggerlo meglio.
PRIMI_PASSI.PAGINA_2=Questi suggerimenti compaiono una volta sola, quando servono. Se non li vuoi, premi l'icona di annullamento qui sotto: il tutorial si spegne per sempre, e puoi riaccenderlo dalle opzioni, nella schermata iniziale.
BARRA_DELLE_ICONE.PAGINA_1=Questa è la barra delle icone: mostra solo i comandi che puoi dare adesso, quindi cambia a ogni situazione. Se un comando non c'è, in questo momento non si può usare.
BARRA_DELLE_ICONE.PAGINA_2=Non ricordi cosa fa un'icona? Accendi l'aiuto con il punto interrogativo, poi passa il mouse sopra l'icona, senza cliccare: ne leggi la descrizione.
BARRA_DELLE_ICONE.PAGINA_2.TOCCO=Non ricordi cosa fa un'icona? Accendi l'aiuto con il punto interrogativo, poi passa il dito sopra l'icona: ne leggi la descrizione, senza lanciare il comando.
MOVIMENTO_E_MAPPA.PAGINA_1=Con le frecce scegli dove andare: nord, est, sud, ovest. Poi scegli quanti passi fare: ogni passo costa un'ora. Il viaggio si interrompe comunque sulla prima locazione che non è un bosco o una radura (una città, una locanda, un tempio, le rovine, una grotta, una palude...) e al bordo della mappa: lì ti fermi e vedi che cosa c'è.
MOVIMENTO_E_MAPPA.PAGINA_2=Questo riquadro è la mappa: mostra la zona che conosci e dove si trova il gruppo. Si riempie man mano che esplori.
MOVIMENTO_E_MAPPA.PAGINA_3=L'icona della mappa la apre a tutto schermo: vedi tutto quello che conosci, cosa hai già visitato e le ultime notizie delle locande.
JOYSTICK_DELLA_MAPPA.PAGINA_1=Questo disco è un joystick virtuale: tienilo premuto e una mano si muove sulla mappa. Dove punta, leggi il nome del luogo.
TRASCINARE_LA_MAPPA.PAGINA_1=La mappa è più grande dello schermo: clicca e trascina per vedere le altre zone.
TRASCINARE_LA_MAPPA.PAGINA_1.TOCCO=La mappa è più grande dello schermo: trascina il dito per vedere le altre zone.
INVENTARIO.PAGINA_1=Questo è l'inventario: due liste affiancate, quella del gruppo e quella del personaggio scelto. Con un doppio click su un oggetto lo equipaggi, o lo rimetti nell'inventario del gruppo.
INVENTARIO.PAGINA_1.TOCCO=Questo è l'inventario: due liste affiancate, quella del gruppo e quella del personaggio scelto. Con un doppio tocco su un oggetto lo equipaggi, o lo rimetti nell'inventario del gruppo.
LIVELLO_SALITO.PAGINA_1=Un personaggio è salito di livello! Lo vedi nel riquadro del gruppo: ora ha un punto abilità da spendere per diventare più forte.
LIVELLO_SALITO.PAGINA_2=Per spenderlo apri l'inventario con questa icona e scegli il personaggio: lì puoi aumentare i suoi attributi.
ATTRIBUTI.PAGINA_1=Ogni personaggio ha degli attributi. Quelli primari, come la forza o l'intelligenza, si aumentano spendendo i punti abilità; quelli secondari, come la precisione o la parata, non si toccano: crescono da soli quando aumentano i primari da cui dipendono.
ATTRIBUTI.PAGINA_2=Gli attributi si possono aumentare anche con gli artefatti: un'arma, un'armatura o un gioiello equipaggiato può dare un bonus agli attributi di chi lo porta, finché lo porta.
PUNTI_ABILITA.PAGINA_1=Qualcuno ha dei punti abilità da spendere! Li riconosci dagli attributi primari in arancione nella scheda del personaggio. Con un doppio click su un attributo primario lo aumenti di uno, e con lui crescono anche gli attributi secondari che ne dipendono.
PUNTI_ABILITA.PAGINA_1.TOCCO=Qualcuno ha dei punti abilità da spendere! Li riconosci dagli attributi primari in arancione nella scheda del personaggio. Con un doppio tocco su un attributo primario lo aumenti di uno, e con lui crescono anche gli attributi secondari che ne dipendono.
INVENTARIO.PAGINA_2=Dalla barra delle icone si aprono altre pagine: i trofei, il bestiario, il grimorio con gli incantesimi e, dopo i primi scontri, le tattiche di combattimento.
COMBATTIMENTO.PAGINA_1=Un mostro! In questo riquadro vedi chi agisce e chi è il bersaglio, e le barre della salute di ognuno. I tuoi personaggi seguono una tattica: scelgono da soli chi colpire e come. Per ora attacca tu, un colpo alla volta, con l'icona dell'attacco.
RECUPERO_FRA_LOCAZIONI.PAGINA_1=Cambiando locazione i tuoi personaggi recuperano un po' di salute e di magia: guarda le barre. Non serve bere una pozione dopo ogni scontro, tienile per quando stai davvero male.
COMBATTIMENTO_AUTOMATICO.PAGINA_1=Ora puoi lasciar fare ai tuoi personaggi: con questa icona il combattimento procede da solo, un turno dopo l'altro, secondo le loro tattiche, finché lo scontro non è finito. Se vuoi riprendere in mano la situazione, l'icona di interruzione lo ferma.
OGGETTO_TROVATO.PAGINA_1=Hai trovato un oggetto! Se si può equipaggiare e solo uno del gruppo può usarlo subito, lo prende e lo equipaggia da solo; se possono usarlo in più di uno, scegli tu chi lo prende.
POZIONI.PAGINA_1=Qualcuno è ferito. Le pozioni di salute lo curano subito; quelle grandi lo curano di più e alzano anche il massimo della sua salute. Bevi le pozioni solo quando serve: sono poche.
SCELTE_IN_COMBATTIMENTO.PAGINA_1=Ora hai più scelte. Oltre ad attaccare tu o lasciar fare alle tattiche, puoi anche fuggire, ma costa ferite e una parte delle scorte, o provare a passare inosservato.
MISSIONI.PAGINA_1=Questo riquadro elenca le missioni in corso. Portalo in primo piano per leggerlo, scorri l'elenco con la rotella del mouse e clicca su una missione per chiuderla o riaprirla.
MISSIONI.PAGINA_1.TOCCO=Questo riquadro elenca le missioni in corso. Portalo in primo piano per leggerlo, scorri l'elenco trascinando e tocca una missione per chiuderla o riaprirla.
MISSIONI.PAGINA_2=Quando vedi queste quattro frecce blu, l'elenco si può scorrere: trascinalo con il mouse o usa la rotella.
MISSIONI.PAGINA_2.TOCCO=Quando vedi queste quattro frecce blu, l'elenco si può scorrere: trascinalo con il dito.
MISSIONI.PAGINA_2.ICONA=FRECCIA_SINISTRA,FRECCIA_DESTRA,FRECCIA_SU,FRECCIA_GIU
TATTICHE.PAGINA_1=Hai visto come i tuoi personaggi scelgono da soli cosa fare: è la loro tattica. Aprendo l'inventario (l'icona qui sotto) trovi le tattiche: da lì puoi cambiarla per ognuno, per esempio far curare chi sta male o colpire prima i più deboli. Vale la pena dare un'occhiata!
CORRUZIONE.PAGINA_1=Questo avversario si può corrompere: paghi qualche moneta e se ne va senza combattere. Non sempre funziona, ma se riesce non perdi salute.
AMICIZIA.PAGINA_1=Con questo avversario puoi anche fare amicizia: un personaggio ci prova, e più è carismatico più probabilità ha. Un amico può darti un aiuto, un'informazione o un oggetto.
INCANTESIMI.PAGINA_1=Questa icona apre l'elenco di quello che puoi lanciare: gli incantesimi e, per alcune classi, le abilità innate. Scegli chi lo lancia o la usa; il bersaglio lo sceglie la tattica.
INCANTESIMI.PAGINA_2=Nel riquadro vedi quanti incantesimi hai per ogni elemento. Ogni incantesimo consuma una pergamena e un poco di magia; le abilità innate non consumano pergamene, ma poi hanno bisogno di qualche turno di ricarica.
BOTTEGHE.PAGINA_1=Benvenuto in città. Qui trovi il locandiere, l'armaiolo, il venditore di pergamene, l'alchimista e l'incantatore: compri e vendi, e puoi far incantare un artefatto. Contratta: il prezzo dipende da chi tratta.
BOTTEGHE.PAGINA_2=Vende armi e armature.
BOTTEGHE.PAGINA_2.TITOLO=Armaiolo
BOTTEGHE.PAGINA_2.ICONA=ARMAIOLO
BOTTEGHE.PAGINA_3=Vende gli incantesimi.
BOTTEGHE.PAGINA_3.TITOLO=Venditore di pergamene
BOTTEGHE.PAGINA_3.ICONA=VENDITORE_DI_PERGAMENE
BOTTEGHE.PAGINA_4=Vende le pozioni.
BOTTEGHE.PAGINA_4.TITOLO=Alchimista
BOTTEGHE.PAGINA_4.ICONA=ALCHIMISTA
BOTTEGHE.PAGINA_5=Migliora gli artefatti.
BOTTEGHE.PAGINA_5.TITOLO=Incantatore
BOTTEGHE.PAGINA_5.ICONA=INCANTATORE
PILA_SCORREVOLE.PAGINA_1=Nel luogo ci sono tanti personaggi e lo spazio è poco. Trascina verso destra uno dei riquadri, o fai clic sulla freccia blu in alto a sinistra: i riquadri si spostano, ne resta in vista solo una striscia e il luogo si allarga.
PILA_SCORREVOLE.PAGINA_1.TOCCO=Nel luogo ci sono tanti personaggi e lo spazio è poco. Trascina verso destra uno dei riquadri, o tocca la freccia blu in alto a sinistra: i riquadri si spostano, ne resta in vista solo una striscia e il luogo si allarga.
PILA_SCORREVOLE.PAGINA_2=Per riaprirli trascinali verso sinistra, o fai di nuovo clic sulla freccia.
PILA_SCORREVOLE.PAGINA_2.TOCCO=Per riaprirli trascinali verso sinistra, o tocca di nuovo la freccia.
ACCAMPAMENTO.PAGINA_1=È notte. Puoi accamparti per riposare e recuperare salute e magia, ma qualcuno deve restare di guardia: un gruppo che dorme senza guardia rischia brutte sorprese.
GESTI_SUL_TOCCO.PAGINA_1=Gesti: un tocco sceglie, un doppio tocco apre, una pressione prolungata spiega e il trascinamento sposta o scorre.
OGGETTO_TROVATO.PAGINA_2=Se nessuno può usarlo, l'oggetto finisce nell'inventario del gruppo. Dall'icona dell'inventario puoi sempre cambiare chi porta cosa o passare un oggetto a un compagno. Un'arma nuova può cambiare molto il prossimo scontro.
LUOGHI.PAGINA_1=Il bosco è il passaggio: ci si cammina in mezzo e capita di incontrare mostri o di trovare oggetti.
LUOGHI.PAGINA_1.TITOLO=Bosco
LUOGHI.PAGINA_1.ICONA=BOSCO
LUOGHI.PAGINA_2=Come il bosco, ma qui crescono anche gli ingredienti per l'alchimista.
LUOGHI.PAGINA_2.TITOLO=Radura
LUOGHI.PAGINA_2.ICONA=RADURA
LUOGHI.PAGINA_3=Il posto dove tirare il fiato: pagando si mangia e si pernotta, e il gruppo recupera la salute. Il locandiere racconta notizie e voci, e ogni tanto c'è qualcuno che chiede di unirsi alla tua avventura: è così che si trovano i compagni. Se sei in difficoltà, cerca una locanda.
LUOGHI.PAGINA_3.TITOLO=Locanda
LUOGHI.PAGINA_3.ICONA=LOCANDA
LUOGHI.PAGINA_4=Nyena, Malgaard, Ruuna e Fleena: ognuna ha una locanda e le botteghe.
LUOGHI.PAGINA_4.TITOLO=Città
LUOGHI.PAGINA_4.ICONA=CITTA_NYENA
LUOGHI.PAGINA_5=I templi sono custoditi da viverne, ma custodiscono un cofano o un artefatto.
LUOGHI.PAGINA_5.TITOLO=Tempio
LUOGHI.PAGINA_5.ICONA=TEMPIO
LUOGHI.PAGINA_6=Nasconde un cofano la prima volta che la visiti, ma a volte ci vive una viverna o un eremita.
LUOGHI.PAGINA_6.TITOLO=Grotta
LUOGHI.PAGINA_6.ICONA=GROTTA
LUOGHI.PAGINA_7=Ciò che resta di antichi luoghi: ci vivono creature poco accoglienti.
LUOGHI.PAGINA_7.TITOLO=Rovine
LUOGHI.PAGINA_7.ICONA=ROVINE
LUOGHI.PAGINA_8=È il covo di uno dei cinque nemici più forti, il Drago compreso: quello del Drago è nascosto da un incantesimo finché non hai sconfitto gli altri. Sono i luoghi più pericolosi: vacci preparato.
LUOGHI.PAGINA_8.TITOLO=Castello
LUOGHI.PAGINA_8.ICONA=CASTELLO_DRAGO
SCHERMATA_DELLE_TATTICHE.PAGINA_1=Questa è la tattica del personaggio: un elenco di voci, lette dall'alto in basso. Il personaggio guarda la prima voce: se la può fare, la fa e il suo turno finisce; altrimenti passa alla seconda, e così via. Se nessuna voce si può fare, attacca.
SCHERMATA_DELLE_TATTICHE.PAGINA_2=L'ordine conta: in alto sta quello che vuoi fare per primo. Il numero di ogni voce la accende (verde) o la spegne (rosso: viene saltata); cliccando sul nome la ripieghi per averla più corta; con un doppio click la rinomini.
SCHERMATA_DELLE_TATTICHE.PAGINA_2.TOCCO=L'ordine conta: in alto sta quello che vuoi fare per primo. Il numero di ogni voce la accende (verde) o la spegne (rosso: viene saltata); toccando il nome la ripieghi per averla più corta; con un doppio tocco la rinomini.
SCHERMATA_DELLE_TATTICHE.PAGINA_3=A destra di ogni voce ci sono tre icone: una la sposta in alto, una in basso e una la toglie. In fondo all'elenco «Nuova voce» ne aggiunge una; la riga grigia sotto, l'attacco di riserva, c'è sempre e non si può togliere.
SCHERMATA_DELLE_TATTICHE.PAGINA_4=I colori: il numero della voce è verde se la voce vale e rosso se è spenta (e allora tutta la voce diventa grigio scuro e viene saltata). I numeri gialli sono valori da cambiare con i pulsanti - e +. In grigio scuro c'è anche l'attacco di riserva.
SCHERMATA_DELLE_TATTICHE.PAGINA_5=Non devi imparare niente a memoria: passa il mouse sopra una riga e qui a destra leggi che cosa significa, e come si legge la voce intera.
SCHERMATA_DELLE_TATTICHE.PAGINA_5.TOCCO=Non devi imparare niente a memoria: tocca una riga e qui a destra leggi che cosa significa, e come si legge la voce intera.
SCHERMATA_DELLE_TATTICHE.PAGINA_6=Ogni voce risponde a poche domande. La prima: su chi? Può essere un avversario, un alleato o il personaggio stesso: è la parola dopo «su».
SCHERMATA_DELLE_TATTICHE.PAGINA_7=La seconda: quali fra loro? Sono i filtri, dopo la parola «con»: per esempio «con salute in percentuale minore di 40». Ogni filtro toglie qualcuno dai candidati: «(aggiungi un filtro)» ne mette un altro, l'icona accanto lo toglie.
SCHERMATA_DELLE_TATTICHE.PAGINA_8=La terza: quale di questi? Se restano più candidati se ne sceglie uno con l'ordinamento: il primo, quello con meno salute, uno a caso... Se non ne resta nessuno la voce si salta e si passa alla successiva.
SCHERMATA_DELLE_TATTICHE.PAGINA_9=Una voce può avere delle condizioni, dopo la parola «se»: per esempio «se round maggiore di 2» o «nel 30% dei casi». Servono per ciò che non riguarda un bersaglio. Senza condizioni la voce vale sempre; si aggiungono con «(aggiungi una condizione)» e si tolgono con l'icona accanto.
SCHERMATA_DELLE_TATTICHE.PAGINA_10=Dopo «fai» ci sono le azioni, in ordine: si fa la prima che si può fare. Pozioni, pergamene e magia le controlla il gioco: se mancano, si passa all'azione dopo, e poi alla voce dopo. Con «(aggiungi un'azione)» ne metti altre, con l'icona accanto le togli; dove compare «solo se più forte» in giallo, l'azione si fa solo se rende più dell'attacco con le armi (un click lo cambia in «sempre»).
SCHERMATA_DELLE_TATTICHE.PAGINA_11=Quando hai finito, premi Sì per confermare o No per annullare. Predefinita rimette la tattica consigliata per questa classe. Le modifiche valgono per un personaggio alla volta: se ne cambi un altro senza confermare, le perdi.
SCHERMATA_DELLE_TATTICHE.PAGINA_12=Un consiglio: metti in alto le voci particolari (per esempio curare chi sta male) e in fondo quelle generali (per esempio attaccare il primo). Non si cambiano le tattiche durante un combattimento.
NON_ANCORA_IL_MOMENTO.PAGINA_1=Non è ancora il momento di visitare {0}: scegli un'altra direzione.
RESURREZIONE.PAGINA_1=Un compagno è caduto! Finché è a terra non può combattere, ma non è finita: si può riportare in vita.
RESURREZIONE.PAGINA_2=Serve un incantesimo di Resurrezione: se ne trovano in giro, o si comprano dall'alchimista, in città.
RESURREZIONE.PAGINA_3=Quando ne hai uno, lo lanci dall'icona degli incantesimi e scegli chi riportare in vita.
EFFETTI_DI_STATO.PAGINA_1=Un effetto di stato! Attacchi, incantesimi e pozioni possono lasciare un effetto su chi li subisce: sul personaggio compare una scritta.
EFFETTI_DI_STATO.PAGINA_2=Gli effetti di stato possono migliorare le caratteristiche del personaggio (come l'ispirazione del Bardo) oppure dargli dei malus (come il veleno o il bagnato). Entrambi durano qualche turno.
REAZIONI_ELEMENTALI.PAGINA_1=Una reazione elementale! Un effetto di stato più un certo tipo di attacco possono scatenare una reazione, che aumenta i danni: per esempio, chi è bagnato e viene colpito da un fulmine ne subisce molti di più.
REAZIONI_ELEMENTALI.PAGINA_2=Nel grimorio, che si apre dall'inventario, trovi quali tipi di incantesimo reagiscono con quali stati.
AVANZA_VERSO_I_BOSCHI.PAGINA_1=Adesso prova a dirigerti verso un'area boscosa o una radura: sulla mappa sono le caselle con gli alberi o con l'erba. Templi, grotte, locande e città possono aspettare: per ora ti ci fermeresti senza essere pronto.
AVANZA_VERSO_I_BOSCHI.PAGINA_1.ICONA=BOSCO,RADURA
SCELTA_DEL_PERSONAGGIO.PAGINA_1=Quando più di un personaggio può compiere l'azione, devi decidere chi lo fa: nella barra ci sono le icone di chi può farlo, clicca su quella del personaggio che scegli.
SCELTA_DEL_PERSONAGGIO.PAGINA_1.TOCCO=Quando più di un personaggio può compiere l'azione, devi decidere chi lo fa: nella barra ci sono le icone di chi può farlo, tocca quella del personaggio che scegli.
COMPAGNO_IN_LOCANDA.PAGINA_1=Qualcuno vuole unirsi al tuo gruppo! Se accetti entra a far parte del gruppo in modo permanente: è un personaggio in più che combatte al tuo fianco.
COMPAGNO_IN_LOCANDA.PAGINA_2=Il costo delle locande però cresce di pari passo con il numero dei personaggi: ognuno paga il suo pasto e il suo letto. Tuttavia, meglio avere un compagno in più.
