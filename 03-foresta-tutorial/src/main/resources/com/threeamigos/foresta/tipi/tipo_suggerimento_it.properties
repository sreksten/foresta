# I suggerimenti del tutorial: una pagina per ogni cosa che si può fare (al massimo tre). COSTANTE.PAGINA_n; la variante per il dito è COSTANTE.PAGINA_n.TOCCO
SCELTA_DELLA_CLASSE.PAGINA_1=Questa è la scelta più importante: la classe decide come giocherai. Le icone in basso sono le classi: passa sopra un'icona per leggere la scheda di quella classe, con le sue abilità, i suoi punti forti e le sue debolezze, e premila per sceglierla. Oppure scorri l'elenco a sinistra.
SCELTA_DELLA_CLASSE.PAGINA_1.TOCCO=Questa è la scelta più importante: la classe decide come giocherai. Le icone in basso sono le classi. Tocca un nome nell'elenco a sinistra per leggere la scheda di quella classe, con le sue abilità, i suoi punti forti e le sue debolezze, poi premi la sua icona per sceglierla.
SCELTA_DELLA_CLASSE.PAGINA_2=Se è la prima volta, ti consigliamo il Guerriero o il Ladro: sono i più semplici da usare e reggono bene i primi scontri. Il Mago, il Druido e l'Elfo hanno gli incantesimi ma sono più fragili; il Bardo e il Sacerdote aiutano il gruppo più che combattere.
PRIMI_PASSI.PAGINA_1=Benvenuto! Lo schermo è diviso in riquadri: il gruppo, le missioni, la mappa e, quando ne avrai, gli incantesimi e le pozioni. Clicca su uno per portarlo in primo piano e leggerlo meglio.
PRIMI_PASSI.PAGINA_1.TOCCO=Benvenuto! Lo schermo è diviso in riquadri: il gruppo, le missioni, la mappa e, quando ne avrai, gli incantesimi e le pozioni. Tocca un riquadro per portarlo in primo piano e leggerlo meglio.
PRIMI_PASSI.PAGINA_2=Questi suggerimenti compaiono una volta sola, quando servono. Se non li vuoi, premi l'icona di annullamento qui sotto: il tutorial si spegne per sempre, e a inizio partita puoi riaccenderlo.
BARRA_DELLE_ICONE.PAGINA_1=Questa è la barra delle icone: mostra solo i comandi che puoi dare adesso, quindi cambia a ogni situazione. Se un comando non c'è, in questo momento non si può usare.
BARRA_DELLE_ICONE.PAGINA_2=Non ricordi cosa fa un'icona? Premi il punto interrogativo e poi l'icona: ne leggi la descrizione.
BARRA_DELLE_ICONE.PAGINA_2.TOCCO=Non ricordi cosa fa un'icona? Tienila premuta: ne leggi la descrizione.
MOVIMENTO_E_MAPPA.PAGINA_1=Con le frecce scegli dove andare: nord, est, sud, ovest. Poi scegli quanti passi fare: ogni passo costa un'ora. Il viaggio si interrompe comunque sulla prima locazione che non è un bosco o una radura (una città, una locanda, un tempio, le rovine, una grotta, una palude...) e al bordo della mappa: lì ti fermi e vedi che cosa c'è.
MOVIMENTO_E_MAPPA.PAGINA_2=L'icona della mappa la apre a tutto schermo: vedi dove sei, cosa hai già visitato e le ultime notizie delle locande. Trascinala per spostarti.
MOVIMENTO_E_MAPPA.PAGINA_2.TOCCO=L'icona della mappa la apre a tutto schermo: vedi dove sei, cosa hai già visitato e le ultime notizie delle locande. Trascina il dito per spostarti, o usa il joystick sullo schermo.
COMBATTIMENTO.PAGINA_1=Un mostro! In questo riquadro vedi chi agisce e chi è il bersaglio, e le barre della salute di ognuno. I tuoi personaggi seguono una tattica: scelgono da soli chi colpire e come, tu decidi solo se attaccare.
OGGETTO_TROVATO.PAGINA_1=Hai trovato un oggetto! Se si può equipaggiare e solo uno del gruppo può usarlo subito, lo prende e lo equipaggia da solo; se possono usarlo in più di uno, scegli tu chi lo prende; se nessuno può usarlo, finisce nell'inventario del gruppo.
POZIONI.PAGINA_1=Qualcuno è ferito. Le pozioni di salute lo curano subito; quelle grandi lo curano di più e alzano anche il massimo della sua salute. Bevi le piccole solo quando serve: sono poche.
SCELTE_IN_COMBATTIMENTO.PAGINA_1=Ora hai più scelte. Il singolo attacco ti fa agire un personaggio alla volta; il combattimento lascia fare alle tattiche. Puoi anche fuggire, ma costa ferite e una parte delle scorte, o provare a passare inosservato.
MISSIONI.PAGINA_1=Questo riquadro elenca le missioni in corso. Portalo in primo piano per leggerlo, scorri l'elenco con la rotella del mouse e chiudi una missione cliccandoci sopra.
MISSIONI.PAGINA_1.TOCCO=Questo riquadro elenca le missioni in corso. Portalo in primo piano per leggerlo, scorri l'elenco trascinando e chiudi una missione toccandola.
TATTICHE.PAGINA_1=Hai visto come i tuoi personaggi scelgono da soli cosa fare: è la loro tattica. Aprendo l'inventario (l'icona qui sotto) trovi le tattiche: da lì puoi cambiarla per ognuno, per esempio far curare chi sta male o colpire prima i più deboli. Vale la pena dare un'occhiata!
CORRUZIONE.PAGINA_1=Questo avversario si può corrompere: paghi qualche moneta e se ne va senza combattere. Non sempre funziona, ma se riesce non perdi salute.
AMICIZIA.PAGINA_1=Con questo avversario puoi anche fare amicizia: un personaggio ci prova, e più è carismatico più probabilità ha. Un amico può darti un aiuto, un'informazione o un oggetto.
INCANTESIMI.PAGINA_1=Hai degli incantesimi: nel riquadro vedi quanti ne hai per ogni elemento. In combattimento puoi lanciarne uno scegliendo chi lo formula e il bersaglio. Ogni lancio consuma un incantesimo e un poco di magia.
BOTTEGHE.PAGINA_1=Benvenuto in città. Qui trovi il locandiere, l'armaiolo, il venditore di pergamene, l'alchimista e l'incantatore: compri e vendi, e puoi far incantare un artefatto. Contratta: il prezzo dipende da chi tratta.
ACCAMPAMENTO.PAGINA_1=È notte. Puoi accamparti per riposare e recuperare salute e magia, ma qualcuno deve restare di guardia: un gruppo che dorme senza guardia rischia brutte sorprese.
GESTI_SUL_TOCCO.PAGINA_1=Gesti: un tocco sceglie, un doppio tocco apre, una pressione prolungata spiega e il trascinamento sposta o scorre.
OGGETTO_TROVATO.PAGINA_2=Dall'icona dell'inventario puoi sempre cambiare chi porta cosa o passare un oggetto a un compagno. Un'arma nuova può cambiare molto il prossimo scontro.
LUOGHI.PAGINA_1=La Foresta è piena di luoghi, e sulla mappa ognuno ha il suo segno. Il bosco e la radura sono il passaggio: ci si cammina in mezzo e capita di incontrare mostri o di trovare oggetti (nella radura crescono anche gli ingredienti per l'alchimista). Anche la palude è di passaggio, ma di solito è vuota e conviene non fermarsi.
LUOGHI.PAGINA_2=Le locande sono il posto dove rifiatare: pagando si mangia e si pernotta, e il gruppo recupera la salute. Il locandiere racconta notizie e voci, e ogni tanto c'è qualcuno che chiede di unirsi alla tua avventura: è così che si trovano i compagni. Se sei in difficoltà, cerca una locanda.
LUOGHI.PAGINA_3=Le città (Nyena, Malgaard, Ruuna e Fleena) hanno una locanda e le botteghe: l'armaiolo vende armi e armature, il venditore di pergamene gli incantesimi, l'alchimista le pozioni, e l'incantatore migliora gli artefatti. Qualche bottega rinasce anche nella Foresta, dalle rovine.
LUOGHI.PAGINA_4=I templi sono custoditi da viverne, ma custodiscono un cofano o un artefatto. Le grotte nascondono un cofano la prima volta che le visiti, ma a volte ci vive una viverna o un eremita. Le rovine sono ciò che resta di castelli, città e botteghe, e ci vivono creature poco accoglienti.
LUOGHI.PAGINA_5=I castelli sono i covi dei cinque nemici più forti, il Drago compreso: quello del Drago è nascosto da un incantesimo finché non hai sconfitto gli altri. Sono i luoghi più pericolosi: vacci preparato.
