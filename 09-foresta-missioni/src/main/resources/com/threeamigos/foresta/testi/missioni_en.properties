LaFalceDelTristoMietitore.1=Help! I'm still trembling... I saw Death! Death in person, in the forest, from afar!
LaFalceDelTristoMietitore.2=Death? Calm down. What exactly did you see?
LaFalceDelTristoMietitore.3=He held his scythe, and he was surrounded by skeletons. A row of skeletons, like a guard of honor.
