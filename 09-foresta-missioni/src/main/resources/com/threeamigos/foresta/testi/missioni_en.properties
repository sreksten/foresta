IlViaggioDellaMoglie.1=Look who's here! You are the ones who brought me home, some time ago. I thank you, despite the dire consequences.
IlViaggioDellaMoglie.10=With us you will be safe.
IlViaggioDellaMoglie.11=I know, I have a good feeling. I'll take my luggage and the broom, in case we meet my husband.
IlViaggioDellaMoglie.2=Dire consequences?
IlViaggioDellaMoglie.3=My wife {0} did not speak to me for a week, and I spent a fortune on Health Potions.
IlViaggioDellaMoglie.4=But I am alive, and I am in your debt. In fact, seeing how well you manage, I'd like to ask you another favor.
IlViaggioDellaMoglie.5={0} lives {1}, and must reach {2}. The roads are dangerous: would you accompany her?
IlViaggioDellaMoglie.6=We'll take care of it.
IlViaggioDellaMoglie.7=Thank you. And please, don't tell her you found me in an inn again.
IlViaggioDellaMoglie.8=It's you! My husband {0} wrote to me about you. I am {1}.
IlViaggioDellaMoglie.9=I must go {0}, and I don't trust the roads alone.
