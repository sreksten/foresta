IntermezzoUrloDellaBanshee.1=You're back! My wife {0} wrote to me: she arrived safe and sound {1}, thanks to you.
IntermezzoUrloDellaBanshee.2=It was the least we could do, after you brought us home.
IntermezzoUrloDellaBanshee.3=I owe you more than a thank you. I'll teach you my most secret song, which I have never taught anyone.
IntermezzoUrloDellaBanshee.4=It's called the Banshee's Wail: a song that chills the blood. Whoever hears it becomes frightened and loses their head.
IntermezzoUrloDellaBanshee.5=It will be useful.
IntermezzoUrloDellaBanshee.6=Whoever among you can sing will learn it in a moment. Use it well, and don't let my wife hear it.
