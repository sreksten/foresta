# intermezzi: English (American). UTF-8 file. Same keys as the Italian file.

ACCAMPAMENTO.1.1=I once heard of someone who woke up turned into a cockroach. Or maybe it was a golden ass.
ACCAMPAMENTO.1.2=You pay too much attention to those absurd stories in the inns.
ACCAMPAMENTO.2.1=Did you see the moon tonight?
ACCAMPAMENTO.2.2=That's no moon... it's a battle station!
ACCAMPAMENTO.2.3=You spend too much time listening to stories in the inns.
ACCAMPAMENTO.3.1=What a strange moon tonight...
ACCAMPAMENTO.3.2=Don't panic.
IntermezzoAccampamento.1=The party makes camp for the night.
IntermezzoFinePrimaLocazione.F=I see you are prepared. Good luck on your quest!
IntermezzoFinePrimaLocazione.M=I see you are prepared. Good luck on your quest!
IntermezzoIntroduttivo.1=The Forest is silent, and {0} walks in among the trees.
IntermezzoIntroduttivo.2=Far away, above the treetops, a thread of black smoke rises. The Dragon doesn't sleep.
IntermezzoIntroduttivo.3=Who goes there?
IntermezzoIntroduttivo.5=His castle is hidden by a spell. You'll not be able to find it unless you first defeat his allies.
IntermezzoIntroduttivo.6=And anyway... I'd not want to be in his shoes.
IntermezzoLibroTecnico.1=A book at the bottom of the chest.
IntermezzoRiprogrammazione.1=We found a book, The C Programming Language. It must be something for computer wizards, though I don't know what a computer is.
IntermezzoRiprogrammazione.2=Computer wizards, yes. Don't ask me what that's either, but I know that book.
IntermezzoRiprogrammazione.3=It contains spells to reprogram artifacts. They are very arcane spells, and you must be very careful.
IntermezzoRiprogrammazione.4=What can happen?
IntermezzoRiprogrammazione.5=An error in execution, and the artifact falls apart into its components. It's called a Core Dump.
IntermezzoRiprogrammazione.6=Understood. We will be careful.
IntermezzoSpadaNascosta.1=We have read the Unix System V Manual. It talks about a two-letter spell, ls. Can you explain it to us?
IntermezzoSpadaNascosta.2=Ls? It lists what is in a place. But try using its options: "ls -a".
IntermezzoSpadaNascosta.3=And what does "ls -a" do?
IntermezzoSpadaNascosta.4=It lets you see hidden things.
IntermezzoSpadaNascosta.5=But... a sword has appeared out of nowhere!
IntermezzoSpadaNascosta.6=Behold the .normally-hidden-sword! It was in your inventory all along, but no one could see it.
IntermezzoSpadaNascosta.7=And can we use it now?
IntermezzoSpadaNascosta.8=Certainly. But let's get down to business. {0}
