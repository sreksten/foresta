# Le battute e le didascalie degli intermezzi (vedi le classi che hanno il nome della chiave). {0}... sono valori inseriti dal codice
# (il nome dell'eroe, un saluto); .M e .F: la forma per un capo maschio o femmina.
ACCAMPAMENTO.1.1=Una volta ho sentito di uno che si è svegliato trasformato in uno scarafaggio. O forse era un asino d'oro.
ACCAMPAMENTO.1.2=Tu presti troppa attenzione a quelle assurde storie nelle locande.
ACCAMPAMENTO.2.1=Hai visto che luna stasera?
ACCAMPAMENTO.2.2=Quella non è una luna... è una stazione da battaglia!
ACCAMPAMENTO.2.3=Tu passi troppo tempo ad ascoltare le storie nelle locande.
ACCAMPAMENTO.3.1=Che luna strana stasera...
ACCAMPAMENTO.3.2=Non fatevi prendere dal panico.
Fabbrica.salutoAlchimista=Benvenuti nella mia bottega da Alchimista! Posso vendervi incantesimi, pozioni, mappe oppure incrementare il vostro potere magico.
Fabbrica.salutoArmaiolo=Benvenuto nella mia bottega da armaiolo. Compro e vendo armi, armature, elmi, tutto della migliore qualità.
Fabbrica.salutoIncantatore=Benvenuti nel mio laboratorio di incantamenti. Posso migliorare le vostre armi con quel pizzico di magia in più.
Fabbrica.salutoVenditore=Benvenuti nel mio negozio di Pergamene, Amuleti, Gingilli e Ninnoli vari! Questi sono gli ingredienti di base necessari per migliorare le vostre armi.
IntermezzoAccampamento.1=Il gruppo si accampa per la notte.
IntermezzoFinePrimaLocazione.F=Vedo che sei preparata. Buona fortuna nella tua missione!
IntermezzoFinePrimaLocazione.M=Vedo che sei preparato. Buona fortuna nella tua missione!
IntermezzoIntroduttivo.1=La Foresta e' silenziosa, e {0} si inoltra fra gli alberi.
IntermezzoIntroduttivo.2=Lontano, oltre le chiome, si alza un filo di fumo nero. Il Drago non dorme.
IntermezzoIntroduttivo.3=Chi va là?
IntermezzoIntroduttivo.4=Mi chiamo {0}. Sto cercando il Drago.
IntermezzoIntroduttivo.5=Il suo castello è nascosto da un incantesimo. Non riuscirai a trovarlo, a meno che tu prima non sconfigga i suoi alleati.
IntermezzoIntroduttivo.6=E comunque... Non vorrei essere nei suoi panni.
IntermezzoLibroTecnico.1=Un libro in fondo al cofano.
IntermezzoNonChiudeteMai.1=Ma voi {0} non chiudete mai?
IntermezzoNonChiudeteMai.2=No, perché esistono clienti come te.
IntermezzoRiprogrammazione.1=Abbiamo trovato un libro, The C Programming Language. Deve essere roba da maghi del computer, anche se non so cosa sia un computer.
IntermezzoRiprogrammazione.2=Maghi del computer, sì. Non chiedetemi cosa sia nemmeno a me, ma quel libro lo conosco.
IntermezzoRiprogrammazione.3=Contiene incantesimi per riprogrammare gli artefatti. Sono incantesimi molto arcani, e bisogna fare molta attenzione.
IntermezzoRiprogrammazione.4=Che cosa può succedere?
IntermezzoRiprogrammazione.5=Un errore nell'esecuzione, e l'artefatto si disfa nelle sue componenti. Si chiama Core Dump.
IntermezzoRiprogrammazione.6=Capito. Staremo attenti.
IntermezzoSpadaNascosta.1=Abbiamo letto il Manuale di Unix System V. Parla di un incantesimo di due lettere, ls. Potete spiegarcelo?
IntermezzoSpadaNascosta.2=Ls? Elenca ciò che si trova in un luogo. Ma provate ad usare le sue opzioni: "ls -a".
IntermezzoSpadaNascosta.3=E che cosa fa, "ls -a"?
IntermezzoSpadaNascosta.4=Permette di vedere le cose nascoste.
IntermezzoSpadaNascosta.5=Ma... è comparsa una spada dal nulla!
IntermezzoSpadaNascosta.6=Ecco la .spada normalmente nascosta! Era nel vostro inventario da sempre, ma nessuno poteva vederla.
IntermezzoSpadaNascosta.7=E ora possiamo usarla?
IntermezzoSpadaNascosta.8=Certamente. Ma veniamo a noi. {0}
