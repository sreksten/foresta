# Le scritte che la UI mostra al giocatore e che non vengono da un'enum: sprite sopra i personaggi, annunci, domande della
# creazione del personaggio, riga dei dati di un artefatto (vedi TestiDellaUI).
#
# Lingua: italiano. File in UTF-8. {0} è il valore che la UI inserisce nella frase.
#   COLPO_MANCATO       l'attacco o l'incantesimo non ha raggiunto il bersaglio
#   REAZIONE_*          la classe del personaggio è immune, resiste o è debole a un tipo di danno ({0} è il tipo)
#   ERRORE, FILE_CORROTTO  annuncio quando il file di una partita non si legge
#   TROFEO_VINTO, NUOVA_VOCE  etichette degli annunci (il trofeo e la voce del bestiario ne sono il testo)
#   SCEGLI_*            le domande della creazione del personaggio ({0} è il nome scelto)
#   LIVELLO_ARTEFATTO, DANNI_ARTEFATTO  la riga dei dati di un artefatto ({0} è il numero)
COLPO_MANCATO=Mancato
REAZIONE_IMMUNE=Immune a {0}
REAZIONE_RESISTE=Resiste a {0}
REAZIONE_DEBOLE=Debole a {0}
ERRORE=Errore
FILE_CORROTTO=File caricamento corrotto
TROFEO_VINTO=Trofeo vinto
NUOVA_VOCE=Nuova voce
SCEGLI_NOME=Scegli il nome del tuo personaggio o lascialo vuoto per un personaggio casuale.
SCEGLI_SESSO=Scegli il sesso di {0}
SCEGLI_CLASSE=Scegli la classe di {0}
LIVELLO_ARTEFATTO=Livello {0}
DANNI_ARTEFATTO=danni {0}
