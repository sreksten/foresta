# L'ora del giorno e gli eventi del tempo che passa (vedi LineaTemporale).
#   FRASE        {0} l'ora, {1} il giorno in ordinale; FRASE_ELISA per gli ordinali che si elidono (l'ottavo, l'undicesimo)
#   EVENTO_*     {0} chi (il capo), o la città; {1} il gruppo o la direzione
FRASE={0} del {1} giorno.
FRASE_ELISA={0} dell'{1} giorno.
ORA.0=E' la mezzanotte
ORA.1=E' l'una del mattino
ORA.2=Sono le due del mattino
ORA.3=Sono le tre del mattino
ORA.4=E' il canto del gallo
ORA.5=Sorge l'aurora
ORA.6=E' l'alba
ORA.7=Sono le sette del mattino
ORA.8=Sono le otto del mattino
ORA.9=Sono le nove del mattino
ORA.10=E' la mezza mattinata
ORA.11=E' la tarda mattina
ORA.12=E' mezzogiorno
ORA.13=E' il tocco
ORA.14=Sono le due
ORA.15=E' il primo pomeriggio
ORA.16=E' il pomeriggio
ORA.17=E' il tardo pomeriggio
ORA.18=E' il tramonto
ORA.19=E' l'imbrunire
ORA.20=E' la sera
ORA.21=E' la tarda sera
ORA.22=E' la notte
ORA.23=Sono le undici di notte
EVENTO_FINE=Sventura! {0} ha invano tentato di fermare il Drago, che col tempo ha abbattuto l'ultimo baluardo della resistenza... tutto e' perduto!
EVENTO_FUMO={0} vede levarsi una colonna di fumo {1}
EVENTO_SCAMPATO=Un boato scuote {0} prima dell'alba: il Drago! {1} riesce a fuggire per un pelo tra le fiamme, e di {0} non restano che rovine fumanti.
EVENTO_ROVINE=Dove sorgeva {0} {1} trova solo le rovine: il Drago è passato di qui.
