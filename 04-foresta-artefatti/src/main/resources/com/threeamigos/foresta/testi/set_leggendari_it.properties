# set_leggendari: i testi che parlano dei set leggendari (vedi RegoleSetLeggendari). File UTF-8.
# {0} il nome del set (con la preposizione, o senza articolo), {1} il moltiplicatore dei bonus, {2} quanti pezzi bastano

# Sotto un pezzo di un set, nella rivelazione e negli elenchi
PEZZO=Pezzo {0} (bonus x{1})
# Per un set che si completa con una parte dei pezzi (PEZZI= in leggendari.txt)
PEZZO_PARZIALE=Pezzo {0} (ne bastano {2}, bonus x{1})
# Nella scheda del personaggio, per ogni set completo: senza aggettivi da accordare, perché i set sono maschili e femminili
SET_COMPLETO=Set completo: {0} (bonus x{1})
SEPARATORE_DECIMALE=,
