// Il prototipo Android della Foresta: fuori da Maven (vedi porting_libGDX.md, Fase 7 e foresta-android.md).
// I jar del gioco li copia Maven (`mvn package -Pandroid` dalla radice, modulo 13-foresta-app-android): vedi app/build.gradle.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'foresta-android'
include ':app'
