plugins {
    id 'com.android.application'
}

// La stessa versione di libGDX del pom padre (libgdx.version)
def gdxVersion = '1.14.2'

android {
    namespace 'com.threeamigos.foresta.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.threeamigos.foresta'
        // 24: java.util.stream e le interfacce funzionali ci sono dalla 24; String.join (26) e simili li riscrive D8 (backport), come le lambda.
        // Sotto la 24 mancano gli stream, che il gioco usa ovunque (vedi foresta-android.md).
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            // I jar dei moduli e di libGDX portano tutti i loro META-INF
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module']
            pickFirsts += ['META-INF/services/*']
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }
}

configurations {
    natives
}

// I jar del gioco (motore, interfaccia libGDX e tutte le parti sotto) li copia Maven: `mvn package -Pandroid` dalla radice
// (modulo 13-foresta-app-android), che passa la cartella con -Pforesta.libs; da solo Gradle li cerca dove li lascia Maven
def cartellaDeiJar = rootProject.file(findProperty('foresta.libs') ?: "${rootDir}/../13-foresta-app-android/target/libs")
if (!cartellaDeiJar.isDirectory()) {
    throw new GradleException("Mancano i jar del gioco in ${cartellaDeiJar}: prima `mvn package -Pandroid` dalla radice (vedi foresta-android.md)")
}

dependencies {
    implementation fileTree(dir: cartellaDeiJar, include: '*.jar')

    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86_64"
}

// Le librerie native di libGDX (.so) vanno in jniLibs, una cartella per architettura: si estraggono dai jar `natives-*` prima della compilazione
tasks.register('copiaLeLibrerieNative') {
    doLast {
        def cartelle = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        configurations.natives.files.each { jar ->
            def arch = cartelle.find { jar.name.endsWith("natives-${it}.jar") }
            if (arch == null) {
                return
            }
            def destinazione = file("src/main/jniLibs/${arch}")
            destinazione.mkdirs()
            copy {
                from zipTree(jar)
                into destinazione
                include '*.so'
            }
        }
    }
}

tasks.matching { it.name.startsWith('merge') && it.name.endsWith('JniLibFolders') }.configureEach {
    dependsOn 'copiaLeLibrerieNative'
}
