# I testi di TipoAbilita (vedi Testi): una voce per costante, con chiave COSTANTE.VOCE.
#
# Lingua: italiano. File in UTF-8. Voci: NOME, DESCRIZIONE.
# Per una lingua nuova si copia questo file in tipo_abilita_<lingua>.properties e si traduce: quel che manca in una
# traduzione si legge in italiano.

SCACCIARE_I_NON_MORTI.NOME=Scacciare i non morti
SCACCIARE_I_NON_MORTI.DESCRIZIONE=Spaventa i non morti avversari, che cedono a seconda del loro coraggio.

IMPOSIZIONE_DELLE_MANI.NOME=Imposizione delle mani
IMPOSIZIONE_DELLE_MANI.DESCRIZIONE=Cura il personaggio più ferito del gruppo.

MARTELLO_SACRO.NOME=Martello sacro
MARTELLO_SACRO.DESCRIZIONE=Un colpo di martello benedetto su un solo avversario: danno sacro, il doppio contro i non morti.

RADICI.NOME=Radici
RADICI.DESCRIZIONE=Radici che afferrano gli avversari: danno di terra a più bersagli.

SCIAME.NOME=Sciame
SCIAME.DESCRIZIONE=Uno sciame di insetti velenosi: danno di veleno a più bersagli.

PELLE_DI_CORTECCIA.NOME=Pelle di corteccia
PELLE_DI_CORTECCIA.DESCRIZIONE=Rafforza la parata e la resistenza magica di tutto il gruppo per qualche turno.

RIGENERAZIONE.NOME=Rigenerazione
RIGENERAZIONE.DESCRIZIONE=Un personaggio guarisce un poco a ogni turno, per qualche turno.

DARDO_ARCANO.NOME=Dardo arcano
DARDO_ARCANO.DESCRIZIONE=Un dardo di energia arcana su un solo bersaglio, che costa magia ma non consuma pergamene.

LUCE_DIVINA.NOME=Luce Divina
LUCE_DIVINA.DESCRIZIONE=Una luce sacra che brucia i non morti, e che non fa distinzioni: investe anche lo Scheletro che combatte al fianco di chi la invoca.

ATTACCO_ALLE_SPALLE.NOME=Attacco alle spalle
ATTACCO_ALLE_SPALLE.DESCRIZIONE=Un colpo con le armi che va sempre a segno ed è sempre un critico, mentre i compagni distraggono gli avversari: servono almeno tre personaggi nel gruppo.

ALBA_SACRA.NOME=Alba Sacra
ALBA_SACRA.DESCRIZIONE=Rimuove gli effetti di stato negativi e i modificatori temporanei al gruppo, lasciando l'ispirazione e il berserk.
