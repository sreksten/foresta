# tipo_abilita: English (American). UTF-8 file. Same keys as the Italian file;
# an entry missing here is read from the parent language and then from Italian.

SCACCIARE_I_NON_MORTI.NOME=Turn undead
SCACCIARE_I_NON_MORTI.DESCRIZIONE=Frightens the opposing undead, who yield according to their courage.

IMPOSIZIONE_DELLE_MANI.NOME=Laying on of hands
IMPOSIZIONE_DELLE_MANI.DESCRIZIONE=Heals the most wounded character in the party.

MARTELLO_SACRO.NOME=Holy hammer
MARTELLO_SACRO.DESCRIZIONE=A blessed hammer blow on a single opponent: holy damage, double against the undead.

RADICI.NOME=Roots
RADICI.DESCRIZIONE=Roots that grab the opponents: earth damage to several targets.

SCIAME.NOME=Swarm
SCIAME.DESCRIZIONE=A swarm of venomous insects: poison damage to several targets.

PELLE_DI_CORTECCIA.NOME=Bark skin
PELLE_DI_CORTECCIA.DESCRIZIONE=Strengthens the parry and the magic resistance of the whole party for a few turns.

RIGENERAZIONE.NOME=Regeneration
RIGENERAZIONE.DESCRIZIONE=A character heals a little every turn, for a few turns.

DARDO_ARCANO.NOME=Arcane bolt
DARDO_ARCANO.DESCRIZIONE=A bolt of arcane energy on a single target, which costs magic but uses up no scrolls.

LUCE_DIVINA.NOME=Divine Light
LUCE_DIVINA.DESCRIZIONE=A holy light that burns the undead and makes no distinctions: it also strikes the Skeleton fighting beside whoever calls it.

ATTACCO_ALLE_SPALLE.NOME=Backstab
ATTACCO_ALLE_SPALLE.DESCRIZIONE=A weapon strike that always hits and is always a critical, while the companions distract the opponents: at least three characters are needed in the party.

ALBA_SACRA.NOME=Holy Dawn
ALBA_SACRA.DESCRIZIONE=Removes the negative status effects and the temporary modifiers from the party, leaving inspiration and berserk.
