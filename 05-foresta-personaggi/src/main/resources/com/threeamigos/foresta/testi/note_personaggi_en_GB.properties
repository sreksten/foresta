CHIERICO.VELOCITA=A bit slow: armour and shield weigh, and faith does not lighten them.
CHIERICO.FURTIVITA=Armour and holy symbols jingle: going unnoticed is not his trade.
CHIERICO.PARATA=Trained to defend with shield and armour: second only to the warrior.
CHIERICO.STANCHEZZA=Standard. Fasts and marches in armour have tempered him.
DRUIDO.PARATA=Little trained: no shield or metal armour, only the staff.
