DRAGO.CRITICO=Legendary and millennia old, it compensates its imposing bulk with a superb intelligence that lets it recognise the enemies' weak points.
DRAGO.PARATA=Its armoured membranous wings and titanic legs can intercept and deflect almost any conventional attack.
