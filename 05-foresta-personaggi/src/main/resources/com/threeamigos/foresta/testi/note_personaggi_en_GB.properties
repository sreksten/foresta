CENTAURO.FURIA=Proud and loyal defender of the tribe; has a deep sense of honour and of protecting the herd.
CENTAURO.VALORE=Proud and loyal defender of the tribe; possesses a deep sense of honour and of safeguarding his own herd.
CHIMERA_DRAGO.CRITICO=Twice the size of the normal chimera. Becomes clumsier and more brutal; loses the finesse of the three heads in favour of devastation.
FOLLETTO.CRITICO=Tiny and extremely fast, it slips its little needles and magic darts exactly into the gaps in armour.
GIGANTE.CARICO_MASSIMO=Easily exceeds 4-5 metres in height. Its basic weapons weigh as much as an entire human soldier.
GIGANTE.CRITICO=Its weapons are so enormous that they hit whole portions of the body. It need not hit “dead centre” to hurt.
GIGANTE.VELOCITA=Moving limbs several metres long takes time. Its attacks are slow and wide, easy to predict.
GIGANTE.DANNI_FISICI=5 metres tall; wields mammoth weapons capable of felling trees. Frightening impact force.
GOBLIN.FURIA=The antithesis of Valour. Cowardly and treacherous by nature; if a companion is in trouble, uses them as a shield to save itself.
GOBLIN.VALORE=The antithesis of Valour. Cowardly and treacherous; if a companion is in trouble, does not hesitate to use them as a shield to save itself.
HOBGOBLIN.CRITICO=More disciplined and militarily trained than the common goblin, it can recognise the structural weaknesses of formations.
HOBGOBLIN.VELOCITA=Heavier, more armoured and methodical than the common goblin; prefers the stability of the line to speed.
HOBGOBLIN.FURTIVITA=Bulkier than the goblin and usually equipped with clanking martial armour, reducing elusiveness.
HOBGOBLIN.FURIA=Has a rigid military code of honour and a sense of duty to the legion that drives it to protect the phalanx.
HOBGOBLIN.VALORE=Has a rigid military code of honour and a sense of duty to the legion that drives it to protect the phalanx.
MINOTAURO.CARICO_MASSIMO=A massive bull-headed biped, over two and a half metres tall, with frightening muscle density.
OMBRA_NERA.CRITICO=Irascible but deadly undead; materialises behind the victim, striking the life essence directly with malign precision.
SCHELETRO.FURIA=Without Choice. A mindless, moral-less, soulless automaton. It cannot choose valour or sacrifice; it only follows orders.
SCHELETRO.CORAGGIO=Emotional Immunity. An automaton without brain, hormones or fear. Advances towards danger carrying out orders until destroyed.
SCHELETRO.VALORE=Without Choice. An automaton without mind or soul. It cannot choose valour or sacrifice; it only follows mechanical orders.
SPETTRO.PARATA=Like the ghost, its ethereal nature favours evasion over blocking solid matter.
TITANO.CARICO_MASSIMO=Semi-divine forces or mythological creatures able to move the surrounding environment. For him, lifting a boulder or heavy armour makes no difference.
TITANO.PRECISIONE=His attacks move mountains. He does not aim at the single soldier, he aims at the postcode the soldier lives in.
TITANO.DANNI_FISICI=The Physical Cataclysm. Semi-divine force. A punch of his has the force of an earthquake; he ignores the physical defences of mortals.
VIVERNA.RESISTENZA_MAGICA=Flying predator with exceptional sight, specialised in locking onto moving targets from above.
VIVERNA.PERCEZIONE=Flying predator with exceptional sight, specialised in locking onto and chasing targets running on the ground.
VIVERNA.DANNI_FISICI=A large predatory reptile; has powerful jaws and a tail stinger able to pierce armour.
IDRA.VELOCITA=Massive body and low centre of gravity. Moves slowly and the heads often compete over attack reflexes.
LICH.CRITICO=Superior to the common mage because it masters deadly magic (Necromancy), channelling anathemas that target the soul.
LICH.DANNI_FISICI=Mummified or skeletal body without living muscles. Rejects physical combat in favour of magic.
