ARPIA.RESISTENZA_MAGICA=Raptor's sight. Able to spot a mouse moving in the grass from hundreds of metres up.
ARPIA.PERCEZIONE=Raptor's sight. Able to spot a mouse moving in the grass from hundreds of metres up in the sky.
