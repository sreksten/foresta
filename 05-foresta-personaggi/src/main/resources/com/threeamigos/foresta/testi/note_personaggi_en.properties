ELFA.CARICO_MASSIMO=Slender, elegant build. Favors mobility and light armor over sheer carrying capacity.
ELFA.CRITICO=Grace, millennia of training and keen sight guarantee a native accuracy above the human average.
ELFA.PRECISIONE=Among the best. Legendary sight, centuries of archery training and a total absence of muscle tremor.
ELFA.VELOCITA=Light, agile and gifted with reflexes biologically superior to human ones. Almost always acts before the enemies.
ELFA.FURTIVITA=Extremely light step. Elves walk on the ground leaving almost no footprints and can blend perfectly with nature.
ELFA.PARATA=Makes up for lesser physical strength with lightning reflexes, deflecting enemy blows with the tip of the sword (deflect).
ELFA.RESISTENZA_MAGICA=Legendary Hunter. Very keen sight and hearing; perceives the breath of a hidden enemy at a great distance.
ELFA.PERCEZIONE=Legendary Hunter. Very keen sight and hearing; perceives the breath or heartbeat of a hidden enemy at a great distance.
ELFA.SOGGEZIONE=Gives off an aloof, ethereal, almost divine elegance that intimidates ordinary mortals.
ELFA.FURIA=Deep sense of responsibility toward their lineage and nature; fights with nobility and team spirit.
ELFA.CORAGGIO=Aloof and proud; regards the dangers of the world with the cold steadiness of one who has lived for centuries and seen kingdoms fall.
ELFA.VALORE=Deep sense of responsibility toward their lineage and nature; fights with nobility and team spirit.
ELFA.CONTRATTAZIONE=The Baseline. Courteous and patient, deals with grace but considers haggling a somewhat vulgar custom.
ELFA.NUMERO_BERSAGLI=Balanced: prefers the accuracy of the single blow, but their grace lets them handle the front line.
ELFA.STANCHEZZA=Light, athletic step. Their superior physiology wastes very little energy in movement.
ELFA.DANNI_MAGICI=Above the human average. Innate magic runs in their veins; an elf will always deal more magic damage than a warrior or a thief.
ELFA.DANNI_FISICI=Slender and agile. In physical combat favors dexterity and precision (Critical) over impact power.
ELFA.RIGENERAZIONE_SALUTE=Athletic, light, coordinated build that wastes very little energy and recovers with great efficiency.
ELFA.RIGENERAZIONE_MAGIA=The elven "trance" allows deep mental and spiritual rest, drawing on the native magic in their veins.

