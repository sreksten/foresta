# note_personaggi: English (American). UTF-8 file. Same keys as the Italian file;
# an entry missing here is read from the parent language and then from Italian.

BARDO.CARICO_MASSIMO=Slender, elegant build. Favors mobility and light armor over sheer carrying capacity.
BARDO.CRITICO=Opportunist on the battlefield; can read the rhythm of a duel and strike when the enemy is exposed by a mistake.
BARDO.PRECISIONE=Standard human accuracy; relies on timing and basic coordination.
BARDO.VELOCITA=Quicker than the human average; relies on mobility to move among the rear lines of the battlefield.
BARDO.FURTIVITA=Skilled in the art of disguise and misdirection; knows how to go unnoticed in a crowd or move with a light step.
BARDO.PARATA=Human baseline. Trained in the use of light fencing weapons or small bucklers.
BARDO.RESISTENZA_MAGICA=Excellent observer of human behavior; instantly notices out-of-place details, whispers and suspicious movements.
BARDO.PERCEZIONE=Excellent observer of behavior; instantly notices out-of-place details, whispers and suspicious movements in the party or among the enemies.
BARDO.SOGGEZIONE=Exceptional charm and magnetism. Gives off a theatrical majesty that captivates allies and subdues enemies.
BARDO.FURIA=Fascinated by heroic ballads and epic deeds; inclined to bold, showy actions to save his companions.
BARDO.CORAGGIO=Has a strong personality; used to being the center of attention and defying the audience, he is not intimidated by physical threats.
BARDO.VALORE=Fascinated by heroic ballads and epics; inclined to bold, showy actions to protect the party.
BARDO.CONTRATTAZIONE=Stage patter: between a rhyme and a compliment, the merchant ends up giving a discount without knowing why.
BARDO.NUMERO_BERSAGLI=His music or his words spread through the air, letting him influence several targets at once.
BARDO.STANCHEZZA=Human standard; moving and singing at the same time keeps him average.
BARDO.DANNI_MAGICI=Channels magic through art and music; his attack spells are decent, but he excels at buffs.
BARDO.DANNI_FISICI=Trains in movement and coordination, but does not focus his style on developing brute strength.
BARDO.RIGENERAZIONE_SALUTE=His very music and breathing-rhythm control slightly speed up muscle relaxation.
BARDO.RIGENERAZIONE_MAGIA=His very music serves as a meditative catalyst, speeding up the energy recovery of the party and of himself.

