MAGA.CARICO_MASSIMO=Physique unused to prolonged effort; prefers light bags for alchemical ingredients and scrolls.
MAGA.CRITICO=Focused on area spells (e.g. fireballs) or manipulations. They do not look for the anatomical weak point.
MAGA.PRECISIONE=Standard. Physical coordination is not excellent, but compensated by precision in channeling magic flows.
MAGA.VELOCITA=Prefers to calculate the situation before acting; their physical reaction times are slightly below average.
MAGA.FURTIVITA=Focused on their studies, they have no specific training in moving silently, but are not clumsy either.
MAGA.PARATA=Little physical strength and no martial skill in putting steel weapons or shields in the way.
MAGA.RESISTENZA_MAGICA=Used to perceiving disturbances in the magic weave and arcane energy, compensating for ordinary physical sight.
MAGA.PERCEZIONE=Used to perceiving disturbances in the magic weave and the surrounding arcane energy, compensating for ordinary physical sight.
MAGA.SOGGEZIONE=Standard. Their figure may command respect through knowledge, but is not inherently frightening.
MAGA.FURIA=Standard. Relies on logic and tactical duty to support the squad, without the warrior's martial drive.
MAGA.CORAGGIO=Standard. Relies on logic and study to coldly analyze danger, controlling emotions with the intellect.
MAGA.VALORE=Standard. Relies on logic and tactical duty to support the squad, without the warrior's martial drive.
MAGA.CONTRATTAZIONE=The Baseline. Knows the value of things, but has their head in the stars and rarely argues over the price.
MAGA.NUMERO_BERSAGLI=The masters of AoE. Their whole doctrine rests on channeling spells (e.g. Fireballs or Chain Lightning) onto several enemies.
MAGA.STANCHEZZA=Among the most fragile. Sedentary physique unused to effort; the stress of channeling the arcane exhausts them at once.
MAGA.DANNI_MAGICI=The King of Deadly Magic. Has studied the mathematical structure of the arcane all their life; maximizes the damage of every single rune.
MAGA.DANNI_FISICI=Sedentary, weak physique; has no training in putting force behind melee weapons.
MAGA.RIGENERAZIONE_SALUTE=Sedentary, weak physique unused to athletic effort; takes a long time to catch their breath.
MAGA.RIGENERAZIONE_MAGIA=The King of Living Magic. Has studied the mathematical structure of runes all their life; knows exactly how to realign the flows.

