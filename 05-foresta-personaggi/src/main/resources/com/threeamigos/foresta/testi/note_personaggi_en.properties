SACERDOTE.CARICO_MASSIMO=Travels light: prayer books, holy symbols and scrolls, no heavy armor.
SACERDOTE.CRITICO=Standard. Does not look for the enemy's weak point: prefers protecting companions to striking.
SACERDOTE.PRECISIONE=Good: the discipline of prayer trains a steady hand, even if it is not martial training.
SACERDOTE.VELOCITA=Average: meditation does not make one quick, but not clumsy either.
SACERDOTE.FURTIVITA=Robes and holy symbols do not help one go unnoticed.
SACERDOTE.PARATA=Some notion of defending with a staff, but no training with shields or weapons.
SACERDOTE.RESISTENZA_MAGICA=Their creed protects them from dark forces and magic alterations.
SACERDOTE.PERCEZIONE=Used to keeping watch through long vigils and spotting the signs of evil.
SACERDOTE.SOGGEZIONE=A bit of authority: their role makes them respected, even if they do not inspire fear.
SACERDOTE.FURIA=Standard. Faces combat calmly, without martial drive.
SACERDOTE.CORAGGIO=Good courage: faith sustains them in the face of danger.
SACERDOTE.VALORE=A bit above average: feels responsible for the safety of the party.
SACERDOTE.CONTRATTAZIONE=The Baseline. Does not give much weight to money.
SACERDOTE.NUMERO_BERSAGLI=Standard. Their blessings reach the whole party, but their attacks do not.
SACERDOTE.STANCHEZZA=Standard. Fasts and vigils have tempered them more than a mage, less than a warrior.
SACERDOTE.DANNI_MAGICI=Good: draws on sacred power, but is less devastating than those who study only the arcane.
SACERDOTE.DANNI_FISICI=Gets by with the staff and the mace, without being a fighter.
SACERDOTE.RIGENERAZIONE_SALUTE=Catches their breath through prayer and rest, a little less than a warrior.
SACERDOTE.RIGENERAZIONE_MAGIA=Prayer recharges their sacred flows faster than many casters.

