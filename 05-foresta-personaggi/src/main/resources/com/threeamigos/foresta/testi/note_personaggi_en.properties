GUERRIERA.CARICO_MASSIMO=The archetype of the fighter trained to march for days wearing steel plate.
GUERRIERA.CRITICO=The Baseline. Balanced frontal combat, based on standard martial effectiveness.
GUERRIERA.PRECISIONE=Receives a bonus thanks to constant martial training, discipline and the methodical use of weapons.
GUERRIERA.VELOCITA=The Baseline. Standard human quickness and initiative in a combat stance.
GUERRIERA.FURTIVITA=The Baseline. Represents standard human effectiveness when not weighed down by metal armor.
GUERRIERA.PARATA=The King of the Martial Parry. Trained in the use of tower shields, deflection techniques and defensive counterattacks.
GUERRIERA.RESISTENZA_MAGICA=The Baseline. The attention and watchful eye of a human soldier trained for guard duty.
GUERRIERA.PERCEZIONE=The Baseline. The attention, watchful eye and concentration of a human soldier trained for guard duty.
GUERRIERA.SOGGEZIONE=The Baseline. The firm, determined presence of an armored human soldier.
GUERRIERA.FURIA=The King of Valor. The archetype of the knight or protector trained to intercept blows and act as a bulwark for the party.
GUERRIERA.CORAGGIO=The essence of Martial Courage. Trained to hold the bloodline steady, follow orders and look death in the face.
GUERRIERA.VALORE=The King of Valor. The archetype of the knight or protector trained to intercept blows and act as a bulwark for the party.
GUERRIERA.CONTRATTAZIONE=Pays what is asked and trusts the handshake: an easy target for every shopkeeper.
GUERRIERA.NUMERO_BERSAGLI=Martial training teaches them to execute circular slashes and handle several enemies engaged around them.
GUERRIERA.STANCHEZZA=The Baseline. An athletic human soldier trained to handle fatigue in armor.
GUERRIERA.DANNI_MAGICI=The minimum for the living. Their training is 100% focused on physical matter and steel; they reject arcane channeling.
GUERRIERA.DANNI_FISICI=The pinnacle of human training. Elite musculature, trained to smash armor with swords and maces.
GUERRIERA.RIGENERAZIONE_SALUTE=The peak of human conditioning. Trained specifically to optimize recovery times and to catch their breath under armor.
GUERRIERA.RIGENERAZIONE_MAGIA=The minimum for the living. Their training rejects the arcane; their mind is focused only on steel and physical tactics.

