VIANDANTE.STANCHEZZA=Human standard; moving and singing at the same time keeps him average.
VIANDANTE.DANNI_MAGICI=Channels magic through art and music; his attack spells are decent, but he excels at buffs.
VIANDANTE.DANNI_FISICI=Trains in movement and coordination, but does not focus his style on developing brute strength.
VIANDANTE.RIGENERAZIONE_SALUTE=His very music and breathing-rhythm control slightly speed up muscle relaxation.
VIANDANTE.RIGENERAZIONE_MAGIA=His very music serves as a meditative catalyst, speeding up the energy recovery of the party and of himself.

OMBRAFIAMMA.CARICO_MASSIMO=Supernatural being
OMBRAFIAMMA.CRITICO=Supernatural being
OMBRAFIAMMA.PRECISIONE=Supernatural being
OMBRAFIAMMA.VELOCITA=Supernatural being
OMBRAFIAMMA.FURTIVITA=Supernatural being
OMBRAFIAMMA.PARATA=Supernatural being
OMBRAFIAMMA.RESISTENZA_MAGICA=Supernatural being
OMBRAFIAMMA.PERCEZIONE=Supernatural being
OMBRAFIAMMA.SOGGEZIONE=Supernatural being
OMBRAFIAMMA.FURIA=Supernatural being
OMBRAFIAMMA.CORAGGIO=Supernatural being
OMBRAFIAMMA.VALORE=Supernatural being
OMBRAFIAMMA.CONTRATTAZIONE=Supernatural being
OMBRAFIAMMA.NUMERO_BERSAGLI=Supernatural being
OMBRAFIAMMA.STANCHEZZA=Supernatural being
OMBRAFIAMMA.DANNI_MAGICI=Supernatural being
OMBRAFIAMMA.DANNI_FISICI=Supernatural being
OMBRAFIAMMA.RIGENERAZIONE_SALUTE=Supernatural being woven of magic; the vitality of fire grants accelerated regeneration.
OMBRAFIAMMA.RIGENERAZIONE_MAGIA=Supernatural being woven of fire magic; absorbs energy flows with exceptional efficiency.

ARPIA.CARICO_MASSIMO=Though of a size similar to a human, her bone structure must stay hollow and light to allow flight. An overload would keep her from taking off.
ARPIA.CRITICO=Uses the dive from above and sharp talons to aim straight at the target's eyes or throat.
ARPIA.PRECISIONE=Excellent raptor's sight and coordination in snatching moving targets from above.
ARPIA.VELOCITA=Extremely quick. The advantage of flight allows lightning dashes and dives that are hard to anticipate.
ARPIA.FURTIVITA=Her plumage and the beating of her wings make her noisy; she prefers the open attack from above to the stealthy approach.
ARPIA.PARATA=Light, fragile bone structure; prefers to dodge rather than block a blow that would break her wings.
ARPIA.RESISTENZA_MAGICA=Raptor's sight. Able to spot a mouse moving in the grass from hundreds of meters up.
ARPIA.PERCEZIONE=Raptor's sight. Able to spot a mouse moving in the grass from hundreds of meters up in the sky.
ARPIA.SOGGEZIONE=More annoying and shrill than truly terrifying; her presence commands neither respect nor psychological paralysis.
ARPIA.FURIA=Predatory, selfish creature; prefers to feast on carrion rather than risk her life for one of her own kind.
ARPIA.CORAGGIO=Opportunistic creature. If she realizes the fight is disadvantageous or too dangerous, she easily gives in to panic and withdraws.
ARPIA.VALORE=Predatory, selfish creature; prefers to feast on her companions' carcasses rather than risk her life to save them.
ARPIA.NUMERO_BERSAGLI=Focused on quick diving attacks against a single isolated target; has no wide range of action.
ARPIA.STANCHEZZA=Flapping flight in combat demands considerable energy expenditure, speeding up fatigue.
ARPIA.DANNI_MAGICI=Her nature is feral and primitive; casts instinctive spells lacking true refinement or destructive power.
ARPIA.DANNI_FISICI=Light bone structure suited to flight; her physical attacks (clawing) are quick but lack great mass impact.
ARPIA.RIGENERAZIONE_SALUTE=Light structure that recovers muscular strain at normal rates.
ARPIA.RIGENERAZIONE_MAGIA=Feral, primitive nature; her mind is too chaotic to concentrate on restoring magic flows.

CENTAURO.CARICO_MASSIMO=Joins a human upper half to the lower half of a horse. Benefits from the quadruped bonus (very stable).
CENTAURO.CRITICO=Excellent at the charge, but his hybrid bulk makes him less suited to feints or close rapier work.
CENTAURO.PRECISIONE=Stable anatomy that provides an excellent footing for shooting arrows or throwing javelins.
CENTAURO.VELOCITA=Among the fastest on land. The equine body gives him a devastating gallop speed and charge.
CENTAURO.FURTIVITA=Hooves beating on the ground make it almost impossible to move silently, except on soft grassy terrain.
CENTAURO.PARATA=His four-legged stability lets him absorb the impact of a block without losing balance.
CENTAURO.RESISTENZA_MAGICA=Being a creature of the grasslands and a born hunter, he has highly developed senses to prevent ambushes.
CENTAURO.PERCEZIONE=A creature of the wild grasslands and a born hunter, he has highly developed senses to prevent ambushes in his territory.
CENTAURO.SOGGEZIONE=The proud, imposing physique of the equine body inspires a natural awe.
CENTAURO.FURIA=Proud and loyal defender of the tribe; has a deep sense of honor and of protecting the herd.
CENTAURO.CORAGGIO=Proud warrior of the grasslands. Possesses a solid martial steadiness against fear and defends his land.
CENTAURO.VALORE=Proud and loyal defender of the tribe; possesses a deep sense of honor and of safeguarding his own herd.
CENTAURO.CONTRATTAZIONE=Proud and direct, he despises the haggling of the cities of men.
CENTAURO.NUMERO_BERSAGLI=The equine bulk and the sweeping lance in a charge let him hit several enemies in a line.
CENTAURO.STANCHEZZA=Legendary equine endurance. Used to galloping for hours before showing signs of giving way.
CENTAURO.DANNI_MAGICI=A proud race tied to the land and to physical hunting; its connection with destructive arcane is very limited.
CENTAURO.DANNI_FISICI=Exploits the immense kinetic thrust and muscular power of the equine legs during charges with lance or hooves.
CENTAURO.RIGENERAZIONE_SALUTE=Powerful equine physiology with elite lung and heart capacity to shake off fatigue.
CENTAURO.RIGENERAZIONE_MAGIA=A creature tied to the land and to physical hunting; has a very poor aptitude for summoning arcane energy.

CHIMERA.CARICO_MASSIMO=Lion's body (large quadruped), with three heads and tails. Has a formidable footing for charging at prey or carrying burdens on its back.
CHIMERA.CRITICO=Having three independent heads (lion, goat, serpent), it attacks from multiple angles, increasing the chances of finding an opening.
CHIMERA.PRECISIONE=Balanced: makes up for bestial fury with three independent lines of sight that cover the blind spots.
CHIMERA.VELOCITA=Feline agility combined with the reflexes of three heads. Responsive in the initial dash.
CHIMERA.FURTIVITA=Has the innate stealth of the lion, partly limited however by the other two heads, which can give it away.
CHIMERA.PARATA=Relies mainly on leaps and feline agility to avoid blows; it has no shields or limbs suited to a "parry" in the technical sense, but can partly deflect light attacks with its forelegs
CHIMERA.RESISTENZA_MAGICA=Three heads mean three independent pairs of eyes and ears. Practically impossible to catch from behind.
CHIMERA.PERCEZIONE=Three independent heads mean three pairs of eyes and ears. It is practically impossible to catch from behind.
CHIMERA.SOGGEZIONE=An abomination with three heads that roars, bleats and stares at the enemy all at once is a psychological nightmare.
CHIMERA.FURIA=A wild magic beast driven only by hunger and the instinct of individual survival.
CHIMERA.CORAGGIO=Balanced: the instinctive ferocity of the three heads keeps it from fleeing at once, but it has no real mental discipline.
CHIMERA.VALORE=A wild magic beast driven exclusively by hunger and the instinct of individual survival.
CHIMERA.NUMERO_BERSAGLI=Having three heads that bite and attack in different directions, it can engage several enemies at the same instant.
CHIMERA.STANCHEZZA=Efficient predator metabolism, but coordinating three heads in battle burns energy.
CHIMERA.DANNI_MAGICI=A magic beast that can spit elements (e.g. fire) through its heads, but lacks logical control over the magic weave.
CHIMERA.DANNI_FISICI=A great four-legged predator; the combination of feline bites and swipes inflicts severe lacerating damage.
CHIMERA.RIGENERAZIONE_SALUTE=A great four-legged predator; the presence of three heads lets it partly alternate phases of vigilance and bodily rest.
CHIMERA.RIGENERAZIONE_MAGIA=A wild beast; has innate elemental powers (spitting fire) but no real mental regeneration of the magic weave.

CHIMERA_DRAGO.CARICO_MASSIMO=Being twice the size of a normal chimera, its volumetric mass and lifting capacity scale exponentially.
CHIMERA_DRAGO.CRITICO=Twice the size of the normal chimera. Becomes clumsier and more brutal; loses the finesse of the three heads in favor of devastation.
CHIMERA_DRAGO.PRECISIONE=The doubled bulk makes it slightly slower at micro-adjustments of the attack.
CHIMERA_DRAGO.VELOCITA=Having doubled its bulk, it suffers the effect of inertia: powerful but much slower to start.
CHIMERA_DRAGO.FURTIVITA=The doubled size destroys any feline pretension: its steps make the ground vibrate.
CHIMERA_DRAGO.PARATA=The doubled bulk lets it use its enormous forelegs and scales as stable natural shields.
CHIMERA_DRAGO.RESISTENZA_MAGICA=Joins the chimera's 360-degree vision to the superior magic senses inherited from the line of dragons.
CHIMERA_DRAGO.PERCEZIONE=Joins the chimera's 360-degree vision to the superior magic senses inherited from the line of dragons.
CHIMERA_DRAGO.SOGGEZIONE=Doubled in size and infused with draconic traits; gives off an oppressive presence on the field.
CHIMERA_DRAGO.FURIA=Despite the bulk, it remains an abomination with no moral code or empathic ties to other creatures.
CHIMERA_DRAGO.CORAGGIO=The draconic component infused in its doubled form grants a clear increase in willpower.
CHIMERA_DRAGO.VALORE=Despite its imposing bulk, it remains an abomination with no moral code, empathy or ties to other creatures.
CHIMERA_DRAGO.NUMERO_BERSAGLI=Doubled in size; its claws and tail cover an immense portion of the battlefield.
CHIMERA_DRAGO.STANCHEZZA=The doubled bulk demands immense effort from the heart and muscles to move.
CHIMERA_DRAGO.DANNI_MAGICI=Benefits enormously from the dragon blood infused in its doubled form, which amplifies elemental damage.
CHIMERA_DRAGO.DANNI_FISICI=Doubled in size; each of its physical attacks moves tons of weight, crushing the defenders.
CHIMERA_DRAGO.RIGENERAZIONE_SALUTE=The doubled bulk is supported by the overwhelming vitality of dragon blood, which speeds up muscle recovery.
CHIMERA_DRAGO.RIGENERAZIONE_MAGIA=Benefits from the dragon blood infused in its doubled form, which acts as an enormous passive magic conductor.

EREMITA.CARICO_MASSIMO=Physique unused to prolonged effort; prefers light bags for alchemical ingredients and scrolls.
EREMITA.CRITICO=Focused on area spells (e.g. fireballs) or manipulations. They do not look for the anatomical weak point.
EREMITA.PRECISIONE=Physical reflexes slightly rusty from isolation, but offset by mental concentration.
EREMITA.VELOCITA=The ascetic lifestyle and advanced age slow his physical movements and initiative.
EREMITA.FURTIVITA=Years spent living in the woods or caves have taught him to move without disturbing the local fauna.
EREMITA.PARATA=Slowed reflexes and little inclination to use heavy shields; prefers to avoid direct confrontation.
EREMITA.RESISTENZA_MAGICA=A life of solitude in the wilderness has sharpened his intuition and his ability to listen to the environment.
EREMITA.PERCEZIONE=A life of solitude in the wilderness has sharpened his intuition and his ability to hear every smallest sound around him.
EREMITA.SOGGEZIONE=Unkempt, isolated appearance; evokes madness or pity rather than respect or awe.
EREMITA.FURIA=Detached from the dynamics of the world, but retains deep moral wisdom and compassion when forced to protect someone.
EREMITA.CORAGGIO=He has faced the solitude and privations of the wilderness; his mind is steady, though lacking the hero's drive.
EREMITA.VALORE=Detached from the dynamics of the world, but retains deep moral wisdom and compassion when forced to protect someone.
EREMITA.CONTRATTAZIONE=Lives on little and has lost the habit of trade; coins seem to him a recent invention.
EREMITA.NUMERO_BERSAGLI=Used to fighting alone, he struggles to split his attention across crowds of enemies.
EREMITA.STANCHEZZA=Advanced age and little habit of the frenzied pace of combat make him tire sooner.
EREMITA.DANNI_MAGICI=Years of isolation and deep communion with occult or natural forces have strengthened his mystic focus.
EREMITA.DANNI_FISICI=A body aged and weakened by ascetic privations drastically reduces the effectiveness of his physical blows.
EREMITA.RIGENERAZIONE_SALUTE=An elderly body slowed by the years; his muscles need more time to recover from intense effort.
EREMITA.RIGENERAZIONE_MAGIA=Years of isolated meditation and introspection let him focus his mind and channel mana with ease.

FANTASMA.CARICO_MASSIMO=Being a specter, it has no physical inventory for objects of the material world.
FANTASMA.CRITICO=Ethereal creatures that float. Their partial intangibility makes it hard to land a physical blow focused on the vital points of the body.
FANTASMA.PRECISIONE=Its incorporeal nature makes it hard to calculate the perfect impact with the physical matter of the real world.
FANTASMA.VELOCITA=Floats in the air ignoring ground friction and gravity, gaining decent quickness of action.
FANTASMA.FURTIVITA=Incorporeal and floating. Makes no footstep noise and can pass through visual obstacles to hide.
FANTASMA.PARATA=Almost impossible to parry a physical blow. Solid matter passes through its body unless it uses enchanted weapons.
FANTASMA.RESISTENZA_MAGICA=Senses the presence of souls and the living, but its spectral transition partly distorts its physical sight.
FANTASMA.PERCEZIONE=Senses the presence of souls and the living, but its spectral transition partly distorts its sight in the physical world.
FANTASMA.SOGGEZIONE=A spectral apparition that floats screaming easily breaks the morale of the less courageous soldiers.
FANTASMA.FURIA=A faded ethereal presence, too trapped in its own limbo to care about the fate of the living.
FANTASMA.CORAGGIO=Being already dead, it has overcome the fear of biological ending, and is very steady against mental and psychic debuffs.
FANTASMA.VALORE=A faded ethereal presence, too trapped in its own emotional limbo to care about the fate of the living.
FANTASMA.NUMERO_BERSAGLI=Its spectral attacks pass through matter, but it is limited in its ability to strike several solid bodies together.
FANTASMA.STANCHEZZA=Immune. Being an incorporeal specter, it has no muscles, lungs or lactic acid.
FANTASMA.DANNI_MAGICI=A spirit creature that easily manipulates the energies of the afterlife, inflicting good cold or attrition damage.
FANTASMA.DANNI_FISICI=Almost incapable of interacting with the material world. Its physical attacks are faint icy caresses.
FANTASMA.RIGENERAZIONE_SALUTE=Incorporeal. Has no reserve of physical vigor, accumulates no lactic acid and needs no muscle rest.
FANTASMA.RIGENERAZIONE_MAGIA=Being a pure spiritual entity, its bond with the energy plane is native, allowing excellent recovery.

FOLLETTO.CARICO_MASSIMO=Tiny, magical creature. Can carry only very light objects (rings, small vials, needles).
FOLLETTO.CRITICO=Tiny and extremely fast, it slips its little needles and magic darts exactly into the gaps in armor.
FOLLETTO.PRECISIONE=Despite the frenzy, its small size gives it a very keen perception of close-up space.
FOLLETTO.VELOCITA=The King of Speed. A true magic sliver, almost impossible to frame visually when it moves.
FOLLETTO.FURTIVITA=Tiny and endowed with natural elusive magic. Can easily hide behind a simple blade of grass or a mushroom.
FOLLETTO.PARATA=Far too small. Any attempt to block a normal weapon would send it flying because of the kinetic energy.
FOLLETTO.RESISTENZA_MAGICA=Very attentive and curious, although its hyperactive nature makes it easily distracted.
FOLLETTO.PERCEZIONE=Very attentive, curious and sensitive to magic alterations, although its hyperactive nature makes it easily distracted.
FOLLETTO.SOGGEZIONE=Too funny, tiny and irritating. No one feels intimidated by its stage presence alone.
FOLLETTO.FURIA=Mischievous and capricious; its nature drives it to flee or joke rather than sacrifice itself heroically for the party.
FOLLETTO.CORAGGIO=Extremely fickle, capricious and fearful. Faced with imposing enemies, it prefers to run, joke or hide.
FOLLETTO.VALORE=Mischievous and capricious; its playful nature drives it to flee or hide rather than sacrifice itself for the party.
FOLLETTO.NUMERO_BERSAGLI=Too small. Its attacks with micro-weapons are surgical but strictly limited to one enemy at a time.
FOLLETTO.STANCHEZZA=Hyperactive and frenetic; burns through its energy reserves quickly, needing rest.
FOLLETTO.DANNI_MAGICI=Small but woven of pure wild magic (Fey); its spells are unpredictable but can be painfully intense.
FOLLETTO.DANNI_FISICI=Far too tiny. Even putting all its strength in, its small mass produces no significant physical damage.
FOLLETTO.RIGENERAZIONE_SALUTE=Too hyperactive and frenetic; struggles to relax and calm its heartbeat during rest turns.
FOLLETTO.RIGENERAZIONE_MAGIA=A fey creature woven of wild magic (Fey); recharges quickly by drawing on the surrounding nature.

GARGOYLE.CARICO_MASSIMO=Being made of animated stone, its structure bears heavy loads, but the wings limit its extreme capacity if it wants to glide.
GARGOYLE.CRITICO=Rigid stone body. Its attacks are heavy and predictable, easy to intercept before they touch a vital point.
GARGOYLE.PRECISIONE=Rigid stone joints reduce fluidity and millimeter coordination in its blows.
GARGOYLE.VELOCITA=Made of animated stone. Its rigid joints make it slow and heavy in its action turns.
GARGOYLE.FURTIVITA=Made of stone. When still it looks like a statue (perfect camouflage), but when it moves the noise of the rock gives it away at once.
GARGOYLE.PARATA=Stone solidity. It can cross its rock wings in front of it, acting as a true static barrier.
GARGOYLE.RESISTENZA_MAGICA=In statue form its senses are limited; the stone dulls its reception of subtle sounds.
GARGOYLE.PERCEZIONE=When motionless in statue form its senses are limited; the rock dulls its reception of the subtlest sounds.
GARGOYLE.SOGGEZIONE=A grotesque stone monster perched in the shadows generates strong psychological anxiety in those who approach.
GARGOYLE.FURIA=A born protective sentinel; its whole biological and magic purpose is to act as a shield and defend the assigned place or people.
GARGOYLE.CORAGGIO=Unshakable stone sentinel. Performs its duty of eternal guard without feeling limiting emotions like terror.
GARGOYLE.VALORE=A born protective sentinel; its whole magic and biological purpose is to act as a shield and defend the assigned place or people.
GARGOYLE.NUMERO_BERSAGLI=Excellent at close crowd control thanks to the broad stone wings usable as whips.
GARGOYLE.STANCHEZZA=Made of stone animated by runes. Does not tire in a biological sense, but the magic bond wears down slowly.
GARGOYLE.DANNI_MAGICI=A creature of stone animated by constructs; its rigid nature blocks the smooth, destructive flow of magic energy.
GARGOYLE.DANNI_FISICI=Being made of animated stone, its fists and charges have the hardness and impact weight of a boulder.
GARGOYLE.RIGENERAZIONE_SALUTE=Stone structure. When it returns motionless to its statuesque pose, it channels earth runes to repair its mass.
GARGOYLE.RIGENERAZIONE_MAGIA=Baseline. When motionless in statue form, its runes align and absorb energy at normal rates.

GIGANTE.CARICO_MASSIMO=Easily exceeds 4-5 meters in height. Its basic weapons weigh as much as an entire human soldier.
GIGANTE.CRITICO=Its weapons are so enormous that they hit whole portions of the body. It need not hit "dead center" to hurt.
GIGANTE.PRECISIONE=Clumsy and slow. Its bet is to hit an area so vast that millimeter aim becomes unnecessary.
GIGANTE.VELOCITA=Moving limbs several meters long takes time. Its attacks are slow and wide, easy to predict.
GIGANTE.FURTIVITA=Tall as a tower, its every movement breaks trees or shifts debris. Stealth is not even contemplated for it.
GIGANTE.PARATA=One of its forearms is as big as a warrior's tower shield. It parries blows by sheer opposition of mass.
GIGANTE.RESISTENZA_MAGICA=Its imposing bulk distances it from the details of the ground; it struggles to notice tiny creatures at its feet.
GIGANTE.PERCEZIONE=Its imposing bulk distances it from the details of the ground; it struggles to notice tiny creatures or traps at its feet.
GIGANTE.SOGGEZIONE=A 5-meter mountain of muscle towering over you applies an automatic debuff to your self-esteem.
GIGANTE.FURIA=Though crude, it has a tribal dignity and fiercely protects the members of its clan.
GIGANTE.CORAGGIO=Its very imposing bulk and the awareness of its strength make it feel safe from most threats.
GIGANTE.VALORE=Though crude, it has a very solid tribal dignity and fiercely defends the members of its clan.
GIGANTE.CONTRATTAZIONE=Too big for the shops and too simple for negotiations.
GIGANTE.NUMERO_BERSAGLI=A 3-meter club wielded by it sweeps across the field horizontally, bowling over any soldier in its path.
GIGANTE.STANCHEZZA=Moving a body mass of several tons builds up fatigue very quickly.
GIGANTE.DANNI_MAGICI=Too tied to matter and physical mass; its mind struggles to channel spells beyond small impulses.
GIGANTE.DANNI_FISICI=5 meters tall; wields mammoth weapons capable of felling trees. Frightening impact force.
GIGANTE.RIGENERAZIONE_SALUTE=Colossal muscles that, though they demand a lot of energy, benefit from enormous biological reserves.
GIGANTE.RIGENERAZIONE_MAGIA=Too tied to matter and heavy physical mass; its mind is lazy at calling on the invisible forces of the arcane.

GOBLIN.CARICO_MASSIMO=Smaller than a human and historically forced to make do with light, improvised equipment.
GOBLIN.CRITICO=Fights extremely dirty. Constantly aims at tendons, heels and low blows to cripple the enemies.
GOBLIN.PRECISIONE=Average accuracy; makes up for the lack of discipline with opportunism and point-blank blows.
GOBLIN.VELOCITA=Small and hyperactive. Makes up for physical weakness with neurotic dashes and lightning strategic retreats.
GOBLIN.FURTIVITA=Master of infamy. Small, quick and used to crawling through tunnels or mud to set ambushes.
GOBLIN.PARATA=Short arms and improvised weapons. Prefers to avoid direct blocks so as not to have its weapons broken.
GOBLIN.RESISTENZA_MAGICA=Highly developed feral senses, especially smell and night vision, useful for surviving in caves.
GOBLIN.PERCEZIONE=Highly developed feral senses, especially smell and night vision, vital for surviving and ambushing in caves.
GOBLIN.SOGGEZIONE=A historically cowardly and tiny creature. Makes people laugh or irritates them, inspires no awe.
GOBLIN.FURIA=The antithesis of Valor. Cowardly and treacherous by nature; if a companion is in trouble, uses them as a shield to save itself.
GOBLIN.CORAGGIO=The King of Cowardice. Fights only with clear numerical superiority or from the shadows. If the leader falls, flees instantly.
GOBLIN.VALORE=The antithesis of Valor. Cowardly and treacherous; if a companion is in trouble, does not hesitate to use them as a shield to save itself.
GOBLIN.CONTRATTAZIONE=Greedy and insistent to the point of exhaustion: haggles over the price of anything, even when it does not want to buy it.
GOBLIN.NUMERO_BERSAGLI=Short weapons and a reduced physique. Tends to gang up on a single target rather than do the opposite.
GOBLIN.STANCHEZZA=Weak physiology and neurotic movements that make it run out of breath quickly if the fight drags on.
GOBLIN.DANNI_MAGICI=Its magic is crude, unstable and often based on cheap tricks; its pure spells have no great impact.
GOBLIN.DANNI_FISICI=Small and weak compared to a human. Must make up for the lack of physical damage with ambushes or poisons.
GOBLIN.RIGENERAZIONE_SALUTE=Weak physiology and a metabolism sped up by paranoia; its physical rest is less efficient than average.
GOBLIN.RIGENERAZIONE_MAGIA=A constantly paranoid and superstitious mind, which struggles to find the calm needed for optimal magic rest.

HOBGOBLIN.CARICO_MASSIMO=A sturdier, more military and massive variant of the common goblin.
HOBGOBLIN.CRITICO=More disciplined and militarily trained than the common goblin, it can recognize the structural weaknesses of formations.
HOBGOBLIN.PRECISIONE=Superior to the common warrior thanks to rigid military training and ruthless phalanx coordination.
HOBGOBLIN.VELOCITA=Heavier, more armored and methodical than the common goblin; prefers the stability of the line to speed.
HOBGOBLIN.FURTIVITA=Bulkier than the goblin and usually equipped with clanking martial armor, reducing elusiveness.
HOBGOBLIN.PARATA=Elite military training and constant use of heavy shields in phalanx formation.
HOBGOBLIN.RESISTENZA_MAGICA=Disciplined and paranoid; trained to constantly scan the perimeters to avoid ambushes on the troops.
HOBGOBLIN.PERCEZIONE=Disciplined and paranoid; militarily trained to constantly scan the perimeters to avoid ambushes on the troops.
HOBGOBLIN.SOGGEZIONE=Unlike the goblin, has a martial, proud and ruthless bearing that inspires fear on the field.
HOBGOBLIN.FURIA=Has a rigid military code of honor and a sense of duty to the legion that drives it to protect the phalanx.
HOBGOBLIN.CORAGGIO=Militarily disciplined like the human warrior; the sense of duty and of the phalanx completely cancels goblin cowardice.
HOBGOBLIN.VALORE=Has a rigid military code of honor and a sense of duty to the legion that drives it to protect the phalanx.
HOBGOBLIN.CONTRATTAZIONE=Familiar with war booty and how it is shared out, it knows what it holds is worth.
HOBGOBLIN.NUMERO_BERSAGLI=Trained in the phalanx; knows how to coordinate blows to cover the space in front of its post.
HOBGOBLIN.STANCHEZZA=As disciplined and hardy as a human warrior thanks to military training.
HOBGOBLIN.DANNI_MAGICI=Slightly better than the goblin thanks to military discipline, but far prefers phalanx tactics to magic.
HOBGOBLIN.DANNI_FISICI=Bigger and more muscular than the common goblin, militarily trained to strike with precision and martial strength.
HOBGOBLIN.RIGENERAZIONE_SALUTE=Rigid military discipline applied to breathing and to managing physical effort in battle.
HOBGOBLIN.RIGENERAZIONE_MAGIA=Slightly more disciplined than the goblin, but far prefers phalanx logic to magical understanding.

MINOTAURO.CARICO_MASSIMO=A massive bull-headed biped, over two and a half meters tall, with frightening muscle density.
MINOTAURO.CRITICO=Charges head down, driven by bloodlust. Crushes the opponent with brute force rather than precision.
MINOTAURO.PRECISIONE=Bloodlust and fury lead it to attack blindly, leaving its guard wide open and often missing agile targets.
MINOTAURO.VELOCITA=Although a predator, its imposing bulk and brute-force style make it slow in the turns.
MINOTAURO.FURTIVITA=The heavy breathing, hooves and bull bulk make it a predator of the frontal charge, not of the silent ambush.
MINOTAURO.PARATA=Uses its massive horns or the broad flats of its axes to intercept blows, offering brutal resistance.
MINOTAURO.RESISTENZA_MAGICA=Bloodlust and the labyrinth limit its strategic vision; it relies almost only on smell.
MINOTAURO.PERCEZIONE=Bloodlust and life in the labyrinth limit its strategic vision; it relies almost exclusively on smell.
MINOTAURO.SOGGEZIONE=The classic brutal monster of the labyrinth. Its bull's roar and bulk break the enemy's concentration.
MINOTAURO.FURIA=Blinded by bloodlust; in battle it sees only targets to destroy, ignoring the state of its allies.
MINOTAURO.CORAGGIO=More stubborn than courageous and blinded by bloodlust, which drives it to advance ignoring the risks to its life.
MINOTAURO.VALORE=Blinded by bloodlust; in battle it sees only targets to destroy, ignoring the state of its allies.
MINOTAURO.CONTRATTAZIONE=Beast of the labyrinth: knows not the value of money.
MINOTAURO.NUMERO_BERSAGLI=Wields enormous double-bladed axes with wild, brutal sweeps that hit everything around it.
MINOTAURO.STANCHEZZA=Its wild, uncontrolled frenzy makes it give its best at the start, but run short of breath if the fight lasts.
MINOTAURO.DANNI_MAGICI=Its mind is constantly clouded by bestial rage; it is biologically unable to concentrate enough to deal magic damage.
MINOTAURO.DANNI_FISICI=A massive bull-headed biped endowed with frightening muscle density. Every axe blow is brutal.
MINOTAURO.RIGENERAZIONE_SALUTE=Sturdy bull physiognomy and excellent biological stability for restoring muscle strength.
MINOTAURO.RIGENERAZIONE_MAGIA=Mind clouded by bloodlust and the bestial instinct of the labyrinth; unable to channel mental energy.

OMBRA_NERA.CARICO_MASSIMO=Being a specter, it has no physical inventory for objects of the material world.
OMBRA_NERA.CRITICO=Irascible but deadly undead; materializes behind the victim, striking the life essence directly with malign precision.
OMBRA_NERA.PRECISIONE=Moves driven by a supernatural predatory instinct; locks onto the target in the darkness and strikes without hesitation.
OMBRA_NERA.VELOCITA=Spreads and moves among the shadows at the speed of thought, catching victims by surprise.
OMBRA_NERA.FURTIVITA=Spectral excellence. Being literally a sentient shadow, it blends 100% with the ambient darkness, matching the Thief.
OMBRA_NERA.PARATA=Though aggressive, its semi-liquid, spectral nature makes physical blocks ineffective.
OMBRA_NERA.RESISTENZA_MAGICA=Sees perfectly in absolute darkness and perceives the heartbeat and fear of its prey.
OMBRA_NERA.PERCEZIONE=Sees perfectly in absolute darkness and perceives the life energy, heat and fear of its prey.
OMBRA_NERA.SOGGEZIONE=A shape of pure darkness, irascible and malign, that seems to swallow the surrounding light.
OMBRA_NERA.FURIA=Irascible undead driven by malign rancor and pure destructive selfishness.
OMBRA_NERA.CORAGGIO=Its irascible, malign and vengeful temperament translates into a fierce determination to destroy the target without hesitation.
OMBRA_NERA.VALORE=Irascible undead driven by malign rancor and by pure destructive selfishness.
OMBRA_NERA.NUMERO_BERSAGLI=Can stretch its shadow tendrils to scratch or snatch several nearby enemies in its irascible frenzy.
OMBRA_NERA.STANCHEZZA=Immune. Made of darkness and undead rancor; exempt from physical fatigue.
OMBRA_NERA.DANNI_MAGICI=Made of pure Void and Shadow energy; its dark spells corrode the targets with ruthless efficiency.
OMBRA_NERA.DANNI_FISICI=Although a spectral undead, its irascible frenzy lets it condense its form to scratch violently.
OMBRA_NERA.RIGENERAZIONE_SALUTE=Undead. Made of darkness and immaterial rancor; exempt from fatigue or bodily rest.
OMBRA_NERA.RIGENERAZIONE_MAGIA=Irascible undead made of pure darkness; absorbs and regenerates Void energy with ruthless efficiency in the shadow.

SCHELETRO.CARICO_MASSIMO=It may seem odd (it has no muscles), but having no internal organs, skin or fat, its entire bone structure is "empty payload". Moreover, being undead, it feels no pain from exertion (it can load itself until the bones physically break).
SCHELETRO.CRITICO=It has no muscles or emotions that tremble: it delivers geometrically perfect, cold blows, without hesitation.
SCHELETRO.PRECISIONE=Fixed, mathematical accuracy. It has no muscles to tire, but lacks the intuition to anticipate enemy feints.
SCHELETRO.VELOCITA=Jerky movements free of the weight of organs or fat, but rigidly bound to the absence of intuition or adrenaline.
SCHELETRO.FURTIVITA=It does not breathe and has no heartbeat, but the rubbing of bones and the rattling of worn joints produce a faint noise.
SCHELETRO.PARATA=If equipped as a soldier, it performs parries in a rigid, precise way, free of the fear of breaking a bone.
SCHELETRO.RESISTENZA_MAGICA=Lacking physical eyes and ears; it is moved only by a faint magic instinct that makes it very easy to get around.
SCHELETRO.PERCEZIONE=Lacking physical eyes and ears; it is moved only by a faint magic instinct that makes it very easy to get around and to deceive.
SCHELETRO.SOGGEZIONE=Although undead, it is too common and fragile to inspire any real psychological block in veterans.
SCHELETRO.FURIA=Without Choice. A mindless, moral-less, soulless automaton. It cannot choose valor or sacrifice; it only follows orders.
SCHELETRO.CORAGGIO=Emotional Immunity. An automaton without brain, hormones or fear. Advances toward danger carrying out orders until destroyed.
SCHELETRO.VALORE=Without Choice. An automaton without mind or soul. It cannot choose valor or sacrifice; it only follows mechanical orders.
SCHELETRO.NUMERO_BERSAGLI=Carries out rigid, linear attacks; lacks the mental elasticity to alternate blows fluidly among multiple targets.
SCHELETRO.STANCHEZZA=Immune. Pure bone structure moved by a basic magic impulse. Accumulates no fatigue.
SCHELETRO.DANNI_MAGICI=Without brain, soul or intellect; can cast spells only if temporarily animated by a master, and with minimal damage.
SCHELETRO.DANNI_FISICI=Without muscles, it moves only by magic impulses; delivers decent blows but lacking the weight of living muscle mass.
SCHELETRO.RIGENERAZIONE_SALUTE=Undead. Pure bone structure animated by a basic magic impulse. Has no muscles to rest.
SCHELETRO.RIGENERAZIONE_MAGIA=A heap of bones moved by low-level magic. It has no soul or intellect to autonomously regenerate large amounts of mana.

SPETTRO.CARICO_MASSIMO=Being a specter, it has no physical inventory for objects of the material world.
SPETTRO.CRITICO=Ethereal creatures that float. Their partial intangibility makes it hard to land a physical blow focused on the vital points of the body.
SPETTRO.PRECISIONE=Like the ghost, it suffers from the transition between the ethereal plane and the physical one during the thrust.
SPETTRO.VELOCITA=More aggressive than the common ghost; glides across the battlefield with frightening swiftness.
SPETTRO.FURTIVITA=Aggressive variant of the ghost; moves like a breath of icy wind among the shadows, almost impossible to perceive.
SPETTRO.PARATA=Like the ghost, its ethereal nature favors evasion over blocking solid matter.
SPETTRO.RESISTENZA_MAGICA=More vigilant than the common ghost; actively hunts the living by following the warmth of their life energy.
SPETTRO.PERCEZIONE=More vigilant than the common ghost; actively hunts the living by following the heat and spiritual trail of their life essence.
SPETTRO.SOGGEZIONE=A manifestation of spectral wrath and rancor that freezes the blood in the veins of whoever looks at it.
SPETTRO.FURIA=A manifestation of pure otherworldly hatred focused only on tormenting the living.
SPETTRO.CORAGGIO=Driven by an eternal, cold and relentless rancor that cancels any form of hesitation or biological fear.
SPETTRO.VALORE=A manifestation of pure otherworldly hatred focused only on tormenting and consuming the living.
SPETTRO.NUMERO_BERSAGLI=Its passage leaves an icy trail that can inflict damage on anyone in its path.
SPETTRO.STANCHEZZA=Immune. Otherworldly entities with no biological body to tire.
SPETTRO.DANNI_MAGICI=Aggressive variant of the ghost; channels its eternal rancor into extremely painful necrotic and mental spells.
SPETTRO.DANNI_FISICI=Slightly more aggressive than the ghost, but still limited by its ethereal nature in dealing solid impact damage.
SPETTRO.RIGENERAZIONE_SALUTE=Incorporeal. Manifestation of otherworldly hatred without physical or biological parameters.
SPETTRO.RIGENERAZIONE_MAGIA=Aggressive variant of the ghost; channels its eternal, icy rancor to tear energy from the surroundings.

SPIRITO.CARICO_MASSIMO=Being a specter, it has no physical inventory for objects of the material world.
SPIRITO.CRITICO=Ethereal creatures that float. Their partial intangibility makes it hard to land a physical blow focused on the vital points of the body.
SPIRITO.PRECISIONE=An abstract creature, more inclined to float and confuse than to strike with millimeter accuracy.
SPIRITO.VELOCITA=Constantly floats, shifting place in an ethereal, elusive way.
SPIRITO.FURTIVITA=Floats silently, but its energy nature may emit a faint mystic glow that gives away its position.
SPIRITO.PARATA=Floats and partly dissolves on impact; it has no structure suited to producing a solid parry.
SPIRITO.RESISTENZA_MAGICA=Senses the emotional and spiritual vibrations of the surrounding area extremely acutely.
SPIRITO.PERCEZIONE=Senses the emotional vibrations and spiritual disturbances of the surrounding area extremely acutely.
SPIRITO.SOGGEZIONE=More mysterious and elusive than terrifying; evokes caution or mystic curiosity.
SPIRITO.FURIA=An abstract entity that can act as a guardian or protector depending on its original nature.
SPIRITO.CORAGGIO=An abstract entity, immune to the standard psychological and biological conditioning tied to the survival of the living.
SPIRITO.VALORE=An abstract entity that can act as a guardian or protector depending on its original nature or the pact made; it sits just below the human average because its asceticism makes it slightly detached from the purely physical needs of the party.
SPIRITO.NUMERO_BERSAGLI=Can manifest energy pulses that radiate in a circle around its floating form.
SPIRITO.STANCHEZZA=Immune. Otherworldly entities with no biological body to tire.
SPIRITO.DANNI_MAGICI=Pure energy manifestation. Being composed of mystic essence, its energy attacks wound the enemies' souls directly.
SPIRITO.DANNI_FISICI=Pure energy manifestation. It has no body to strike physically; its multiplier is almost null.
SPIRITO.RIGENERAZIONE_SALUTE=Incorporeal. Pure energy essence with no body of flesh and bone subject to muscle fatigue.
SPIRITO.RIGENERAZIONE_MAGIA=Pure energy manifestation. Having no body of flesh, its rest coincides entirely with energy realignment.

TITANO.CARICO_MASSIMO=Semi-divine forces or mythological creatures able to move the surrounding environment. For him, lifting a boulder or heavy armor makes no difference.
TITANO.CRITICO=Primordial forces of nature. Their attack is like an earthquake or a landslide; the very concept of a "millimeter critical hit" does not exist for them.
TITANO.PRECISIONE=His attacks move mountains. He does not aim at the single soldier, he aims at the zip code the soldier lives in.
TITANO.VELOCITA=Moving at the speed of a mountain means acting last. His every action takes an entire phase of the turn.
TITANO.FURTIVITA=Impossible. A colossal divine force that alters gravity and the surrounding environment just by walking. Its multiplier zeroes the stat.
TITANO.PARATA=The Absolute Block. Can stop a catapult or a legendary slash simply by putting up the palm of the hand.
TITANO.RESISTENZA_MAGICA=Sees the world on a macroscopic scale; notices the great tellurian movements but ignores small individual details.
TITANO.PERCEZIONE=Sees the world on a macroscopic scale; notices the great tellurian movements and the armies, but ignores small individual details.
TITANO.SOGGEZIONE=Divine Presence. A primordial force of myth. Before him mortals fall to their knees at their own insignificance.
TITANO.FURIA=Monumental mythological figure. Keeper of the primordial order, faces colossal threats with epic dignity.
TITANO.CORAGGIO=The Unshakable. A primordial mythological force. The very concept of fear, panic or hesitation is totally alien to him.
TITANO.VALORE=Monumental mythological figure. Keeper of the primordial order, faces colossal threats with epic dignity.
TITANO.CONTRATTAZIONE=He does not stoop to discuss coins: take it or leave it.
TITANO.NUMERO_BERSAGLI=The Cataclysm. A punch or a stomp of his changes the topography of the land. He does not hit individuals, he hits regiments.
TITANO.STANCHEZZA=Monumental strength. The activities of mortals require so small a percentage of his power that they hardly tire him.
TITANO.DANNI_MAGICI=Semi-divine mythological force. When he uses magic, he evokes the forces of creation (earthquakes, divine storms) with immense power.
TITANO.DANNI_FISICI=The Physical Cataclysm. Semi-divine force. A punch of his has the force of an earthquake; he ignores the physical defenses of mortals.
TITANO.RIGENERAZIONE_SALUTE=Semi-divine mythological force. A single deep breath of his purifies the tissues and resets bodily fatigue.
TITANO.RIGENERAZIONE_MAGIA=Semi-divine mythological creature. A single breath of his recalibrates and purifies the entire magic reserve of his spiritual being.

TROLL.CARICO_MASSIMO=Lion's body (large quadruped), with three heads and tails. Has a formidable footing for charging at prey or carrying burdens on its back.
TROLL.CRITICO=Fights in a wild regenerative frenzy, flailing arms or knotty clubs chaotically.
TROLL.PRECISIONE=Waves clubs and claws in a chaotic adrenaline rush. Easy to dodge if the defender is even slightly agile.
TROLL.VELOCITA=Clumsy, hunchbacked and heavy. Moves awkwardly, balancing slowness with pure biological endurance.
TROLL.FURTIVITA=Big, hunchbacked and clumsy. Leaves obvious tracks and moves heavily and noisily.
TROLL.PARATA=Parries blows by deliberately taking them on its big leathery forearms, knowing its regeneration will heal the wounds.
TROLL.RESISTENZA_MAGICA=Primitive intellect and senses dulled by parasitism or poor hygiene; compensates only with a good sense of smell.
TROLL.PERCEZIONE=Primitive intellect and senses dulled by parasitism or poor hygiene; compensates only with a good predator's sense of smell.
TROLL.SOGGEZIONE=Big, deformed and frightening, but its evident stupidity partly softens the psychological awe.
TROLL.FURIA=Primitive, wild intellect; protects its own kind only if driven by a basic pack instinct.
TROLL.CORAGGIO=Dull enough not to fully grasp complex dangers (like curses), but visibly fears fire.
TROLL.VALORE=Primitive, wild intellect; protects its own kind only if driven by a basic pack instinct.
TROLL.NUMERO_BERSAGLI=Long, ape-like arms allow wide swipes able to hit two or three nearby opponents.
TROLL.STANCHEZZA=The monstrous regeneration of tissues clears lactic acid almost instantly, making it tireless.
TROLL.DANNI_MAGICI=Primitive intellect and physical regeneration; its biology is completely disconnected from study or arcane intuition.
TROLL.DANNI_FISICI=Very long arms and massive musculature. Strikes with wild swipes and rudimentary clubs of devastating power.
TROLL.RIGENERAZIONE_SALUTE=Shares with the Hydra a frightening cellular regeneration that clears lactic acid from the muscles in a few seconds.
TROLL.RIGENERAZIONE_MAGIA=Its biology is completely focused on regenerating flesh and muscles; totally disconnected from mana.

VIVERNA.CARICO_MASSIMO=A large winged predatory reptile. Can snatch and carry off whole livestock in flight.
VIVERNA.CRITICO=Efficient aerial predator. The tail strike with the stinger or the dive is lethal and aimed.
VIVERNA.PRECISIONE=Excellent aerial predator. Must be precise when darting to seize a prey running on the ground.
VIVERNA.VELOCITA=Quick aerial predator. Uses air currents to drop on targets at sustained speed.
VIVERNA.FURTIVITA=Although a predator, its size and the beating of its membranous wings make her noticeable before the attack.
VIVERNA.PARATA=Uses the clawed joints of its wings to deflect attacks on the ground, but its structure remains exposed.
VIVERNA.RESISTENZA_MAGICA=Flying predator with exceptional sight, specialized in locking onto moving targets from above.
VIVERNA.PERCEZIONE=Flying predator with exceptional sight, specialized in locking onto and chasing targets running on the ground.
VIVERNA.SOGGEZIONE=A large predatory reptile shrieking in the skies evokes the terror of being snatched at any moment.
VIVERNA.FURIA=Territorial beast; fiercely defends only its offspring or its nest, not the members of a mixed group.
VIVERNA.CORAGGIO=A proud predator but driven by pure animal instinct; if badly wounded, the instinct of self-preservation beats courage and it flies away.
VIVERNA.VALORE=Territorial beast; fiercely defends only its offspring or its nest, not the members of a mixed group.
VIVERNA.NUMERO_BERSAGLI=Exploits the reach of the long tail stinger and the wings to keep several opponents at bay.
VIVERNA.STANCHEZZA=Sturdy predator, but the effort of flight and biting sits at the combat average.
VIVERNA.DANNI_MAGICI=Winged predatory beast; relies on the physical venom of its stinger rather than supernatural spells.
VIVERNA.DANNI_FISICI=A large predatory reptile; has powerful jaws and a tail stinger able to pierce armor.
VIVERNA.RIGENERAZIONE_SALUTE=A large predatory reptile; once on the ground, it rests and oxygenates with the steadiness of a sturdy animal.
VIVERNA.RIGENERAZIONE_MAGIA=Winged predatory beast; relies on the venom of its biological stinger rather than reserves of magic energy.

IDRA.CARICO_MASSIMO=Pours all its reptilian muscle power into the ground, moving like a biological tracked vehicle able to drag frightening weights.
IDRA.CRITICO=The multiple heads bite chaotically and frantically to rip the prey apart, without any real surgical strategy.
IDRA.PRECISIONE=The heads get in each other's way in their eagerness to bite the same target, reducing the accuracy of a single blow.
IDRA.VELOCITA=Massive body and low center of gravity. Moves slowly and the heads often compete over attack reflexes.
IDRA.FURTIVITA=A huge multi-headed reptile that crawls along the ground stirring up earth and rocks, while hissing constantly from several mouths.
IDRA.PARATA=Can sacrifice or use one of its many heads to intercept or deflect a blow aimed at the body.
IDRA.RESISTENZA_MAGICA=Like the chimera, its numerous heads cover every angle of view. If one head sleeps, the others keep watch.
IDRA.PERCEZIONE=Like the chimera, its numerous heads cover every angle of view. If one head sleeps, the others keep watch over the territory.
IDRA.SOGGEZIONE=Seeing five or more giant heads ready to tear you apart generates an immediate biological terror.
IDRA.FURIA=A primordial creature driven by a chaotic appetite; it does not grasp the concept of alliance or sacrifice.
IDRA.CORAGGIO=Its primordial nature and monstrous regenerative capacity make it extremely stubborn: it keeps advancing and fighting as long as it has at least one active head, ignoring most mental fear debuffs.
IDRA.VALORE=A primordial creature driven exclusively by a chaotic, wild appetite; it does not grasp in the least the concept of alliance, pack or sacrifice for others.
IDRA.NUMERO_BERSAGLI=The Maximum Physical Potential. With five or more independent heads darting about, it is a natural multi-target machine.
IDRA.STANCHEZZA=Continuous cellular regeneration helps fight muscle micro-trauma, reducing fatigue.
IDRA.DANNI_MAGICI=An ancient abomination with excellent resistance, but its magic attacks are limited to acid or venom spit of a biological nature.
IDRA.DANNI_FISICI=The coordinated thrust of many serpentine necks biting at once easily tears the enemies' flesh.
IDRA.RIGENERAZIONE_SALUTE=The pinnacle of regeneration. Its monstrous biology erases the micro-traumas of muscle tissue almost instantly.
IDRA.RIGENERAZIONE_MAGIA=An ancient, reptilian abomination; its mystic reserves are small compared with its astonishing physical might.

LICH.CARICO_MASSIMO=Its body is moved by pure magic energy and suffers neither biological fatigue nor the muscle aches of carrying heavy burdens. It does not reach 1.1 like the common Skeleton because its figure is devoted exclusively to intellect and the arcane, not to manual labor.
LICH.CRITICO=Superior to the common mage because it masters deadly magic (Necromancy), channeling anathemas that target the soul.
LICH.PRECISIONE=Its immortal mind calculates trajectories with geometric coldness and ignores any physical or emotional distraction.
LICH.VELOCITA=In no physical hurry. Moves with ceremonial composure, relying on magic to make up for the slowness of the body.
LICH.FURTIVITA=Gives off a frigid aura of death and its ceremonial vestments make it visible; relies on illusions more than on physically hiding.
LICH.PARATA=Uses no shields or physical weapons; prefers that magic barriers or its Mana Shield absorb the damage.
LICH.RESISTENZA_MAGICA=Its sight is guided by a magic and spiritual perception that ignores the visual illusions of mortals.
LICH.PERCEZIONE=Its sight is guided by a magic and spiritual perception that completely ignores the visual illusions of mortals.
LICH.SOGGEZIONE=Majesty of Death. An immortal undead sovereign who gives off a frigid aura of absolute submission.
LICH.FURIA=Sacrificed every shred of humanity, ethics and empathy to obtain immortality; cynical and ruthless to the highest degree.
LICH.CORAGGIO=Immortal Will. Has defeated death itself through necromancy; its cold mind is an impregnable fortress.
LICH.VALORE=Sacrificed every shred of humanity and empathy to obtain immortality; cynical and ruthless to the highest degree.
LICH.NUMERO_BERSAGLI=Joins immense Intelligence to necrotic area magic able to seize the souls of entire platoons.
LICH.STANCHEZZA=Immune. Undead sovereign moved by pure necromancy; totally ignores fatigue.
LICH.DANNI_MAGICI=Undead excellence. Sacrificed its mortal life to master necromancy and the arcane; its death spells are lethal.
LICH.DANNI_FISICI=Mummified or skeletal body without living muscles. Rejects physical combat in favor of magic.
LICH.RIGENERAZIONE_SALUTE=Undead. Moved by pure necromancy and lacking living organs or muscles. Physical fatigue does not exist for it.
LICH.RIGENERAZIONE_MAGIA=The King of Mana. Has defeated death itself. Its immortal, undead mind is an open portal onto the Void and the Necrotic.

NECROMANTE.CARICO_MASSIMO=Physique unused to prolonged effort; prefers light bags for alchemical ingredients and scrolls.
NECROMANTE.CRITICO=Focused on area spells (e.g. fireballs) or manipulations. They do not look for the anatomical weak point.
NECROMANTE.PRECISIONE=Standard. Physical coordination is not excellent, but compensated by precision in channeling magic flows.
NECROMANTE.VELOCITA=Prefers to calculate the situation before acting; their physical reaction times are slightly below average.
NECROMANTE.FURTIVITA=Focused on their studies, they have no specific training in moving silently, but are not clumsy either.
NECROMANTE.PARATA=Little physical strength and no martial skill in putting steel weapons or shields in the way.
NECROMANTE.RESISTENZA_MAGICA=Used to perceiving disturbances in the magic weave and arcane energy, compensating for ordinary physical sight.
NECROMANTE.PERCEZIONE=Used to perceiving disturbances in the magic weave and the surrounding arcane energy, compensating for ordinary physical sight.
NECROMANTE.SOGGEZIONE=The whiteness of bones and the smell of the tomb frighten more than a mere scholar: whoever sees him summon the dead hesitates.
NECROMANTE.FURIA=Cold and calculating; lets his dead get themselves killed in his place, without bursts of anger.
NECROMANTE.CORAGGIO=Used to living with the dead and the darkness, he is not troubled by danger or fear.
NECROMANTE.VALORE=He risks his own skin for no one: his dead servants are there for that.
NECROMANTE.CONTRATTAZIONE=Does not deal with merchants: never joins the party.
NECROMANTE.NUMERO_BERSAGLI=The masters of AoE. Their whole doctrine rests on channeling spells (e.g. Fireballs or Chain Lightning) onto several enemies.
NECROMANTE.STANCHEZZA=Among the most fragile. Sedentary physique unused to effort; the stress of channeling the arcane exhausts them at once.
NECROMANTE.DANNI_MAGICI=Master of dark magic: like the Wizard, he has studied the structure of the arcane all his life, but bends it to necrotic energy.
NECROMANTE.DANNI_FISICI=Sedentary, weak physique; has no training in putting force behind melee weapons.
NECROMANTE.RIGENERAZIONE_SALUTE=Sedentary, weak physique unused to athletic effort; takes a long time to catch their breath.
NECROMANTE.RIGENERAZIONE_MAGIA=The King of Living Magic. Has studied the mathematical structure of runes all their life; knows exactly how to realign the flows.

MINOTAURO_GIGANTE.CARICO_MASSIMO=A massive bull-headed biped, over four meters tall, with frightening muscle density.
MINOTAURO_GIGANTE.CRITICO=Joins the Minotaur's fury to the giant's bulk: its attacks are area cataclysms, accuracy is zero.
MINOTAURO_GIGANTE.PRECISIONE=Joins the blindness of bull rage to a mammoth bulk: its blows are slow and easily predicted.
MINOTAURO_GIGANTE.VELOCITA=A colossal mass of muscle and horns. Its reaction times are minimal, it almost always acts last.
MINOTAURO_GIGANTE.FURTIVITA=An enraged colossus. Impossible not to notice, both visually and by ear.
MINOTAURO_GIGANTE.PARATA=Its colossal bulk lets it block enemy attacks almost without noticing, thanks to muscles hard as iron.
MINOTAURO_GIGANTE.RESISTENZA_MAGICA=Too colossal and constantly enraged to mind details. Easy to fool with feints.
MINOTAURO_GIGANTE.PERCEZIONE=Too colossal and constantly enraged to mind details. It is very easy to fool or get around with feints.
MINOTAURO_GIGANTE.SOGGEZIONE=Joins the minotaur's terror to the giant's bulk. An unstoppable fury that forces enemies to flee.
MINOTAURO_GIGANTE.FURIA=A devastating fury completely unable to grasp the concept of protection or defensive coordination.
MINOTAURO_GIGANTE.CORAGGIO=Wild fury combined with colossal bulk makes it entirely heedless and indifferent to whatever stands before it.
MINOTAURO_GIGANTE.VALORE=A devastating fury completely unable to grasp the concept of protection or defensive coordination.
MINOTAURO_GIGANTE.NUMERO_BERSAGLI=Joins the minotaur's axe sweeps to the giant's geometric reach.
MINOTAURO_GIGANTE.STANCHEZZA=Joins the minotaur's instability to the giant's bulk. Wears itself out quickly if it does not close the match.
MINOTAURO_GIGANTE.DANNI_MAGICI=A colossal mass of pure physical frenzy. Its magic multiplier is minimal: its only "magic" is its fists.
MINOTAURO_GIGANTE.DANNI_FISICI=Physical Devastation. Joins the giant's bulk to the minotaur's muscular ferocity. Impact damage at the very top.
MINOTAURO_GIGANTE.RIGENERAZIONE_SALUTE=Pairs the minotaur's sturdiness with the giant's biological volume, maximizing the energy return.
MINOTAURO_GIGANTE.RIGENERAZIONE_MAGIA=Destructive frenzy exacerbated by the colossal bulk makes it almost entirely impervious to recovering mystic energy.

STREGA.CARICO_MASSIMO=Standard human
STREGA.CRITICO=Focused on area spells (e.g. fireballs) or manipulations. They do not look for the anatomical weak point.
STREGA.PRECISIONE=Prefers casting area hexes or cauldrons of debuffs; her direct physical aim is neglected.
STREGA.VELOCITA=Like the mage, her movements are tied to the casting times of spells, not to physical quickness.
STREGA.FURTIVITA=Used to acting in the shadows and hiding from witch hunts, she has a good knack for not being noticed.
STREGA.PARATA=Like the mage, she lacks the training and physical strength for martial blocks.
STREGA.RESISTENZA_MAGICA=Mistress of Spells. Like the mage, she manipulates curses and occult flows, possessing very high shielding.
STREGA.PERCEZIONE=Endowed with a strong natural intuition and a magic "third eye", she excels at uncovering secrets, poisons and hidden intentions.
STREGA.SOGGEZIONE=Gives off a malign, unsettling presence, backed by piercing stares and occult whispers.
STREGA.FURIA=Opportunistic and bound by dark pacts; she rarely risks her own skin to protect a dying ally.
STREGA.CORAGGIO=Used to dealing with dark forces, occult pacts and spirits, she has a mind hardened against mystic terrors.
STREGA.VALORE=Opportunistic and bound by dark pacts; she rarely risks her own skin to protect a dying ally.
STREGA.NUMERO_BERSAGLI=The Masters of AoE. Their whole doctrine rests on channeling spells (e.g. Fireballs or Chain Lightning) onto several enemies.
STREGA.STANCHEZZA=Among the most fragile. Sedentary physique unused to effort; the stress of channeling the arcane exhausts them at once.
STREGA.DANNI_MAGICI=Mistress of Hexes. Just below the Wizard only because she favors debilitating magic (debuffs and DoTs), but her anathemas are devastating.
STREGA.DANNI_FISICI=Similar to the mage; prefers ranged maleficence. Her direct physical strength is minimal.
STREGA.RIGENERAZIONE_SALUTE=Similar to the mage; prefers not to strain physically and her body suffers from the lack of athletic conditioning.
STREGA.RIGENERAZIONE_MAGIA=Mistress of Spells. Like the mage, she manipulates occult pacts and mystic currents, possessing very high regeneration.

DRAGO.CARICO_MASSIMO=Joins the advantages of an immense four-legged structure to the innate power of the draconic line.
DRAGO.CRITICO=Legendary and millennia old, it compensates its imposing bulk with a superb intelligence that lets it recognize the enemies' weak points.
DRAGO.PRECISIONE=A millennia-old creature endowed with divine senses and an intelligence that lets it calculate air currents and enemy movements.
DRAGO.VELOCITA=Despite its colossal bulk, its magic nature and imposing wings allow surprisingly quick movements.
DRAGO.FURTIVITA=Although it can use magic to conceal itself, its natural size makes it a presence impossible to hide from the naked eye.
DRAGO.PARATA=Its armored membranous wings and titanic legs can intercept and deflect almost any conventional attack.
DRAGO.RESISTENZA_MAGICA=The Absolute Sensorium. Divine millennial senses. Perceives ground vibrations, body heat and magic flows.
DRAGO.PERCEZIONE=The Absolute Sensorium. Divine millennial senses. Perceives ground vibrations, body heat and invisible magic flows.
DRAGO.SOGGEZIONE=The King of Terror. Possesses the innate Terrifying Presence. Its gaze alone can paralyze entire armies.
DRAGO.FURIA=Haughty and solitary, but possesses an immense dignity and an ancient pride that keep it from fleeing cowardly.
DRAGO.CORAGGIO=Millennial Pride. Aware of its absolute superiority over the world. Practically immune to the fear of mortals.
DRAGO.VALORE=Haughty and solitary, but possesses an immense dignity and an ancient pride that keep it from fleeing cowardly.
DRAGO.NUMERO_BERSAGLI=The Lord of Sweeps. Besides the intelligence to manage the field, a single tail or claw strike mows down entire groups.
DRAGO.STANCHEZZA=A legendary creature supported by an immense internal magic energy that prevents physical fatigue.
DRAGO.DANNI_MAGICI=The pinnacle of natural magic. Its words and elemental breaths are devastating magic cataclysms.
DRAGO.DANNI_FISICI=The pinnacle of natural physical destruction. Its claws pierce steel and its tail strikes shatter walls.
DRAGO.RIGENERAZIONE_SALUTE=A legendary creature endowed with a mythological metabolism. A single turn of rest reoxygenates enormous muscle masses.
DRAGO.RIGENERAZIONE_MAGIA=Regal. Perfect union of flesh and pure magic. Its millennial body absorbs the world's flows at catastrophic rates.

NON_COMBATTENTE.CARICO_MASSIMO=Slender, elegant build. Favors mobility and light armor over sheer carrying capacity.
NON_COMBATTENTE.CRITICO=Opportunist on the battlefield; can read the rhythm of a duel and strike when the enemy is exposed by a mistake.
NON_COMBATTENTE.PRECISIONE=Standard human accuracy; relies on timing and basic coordination.
NON_COMBATTENTE.VELOCITA=Quicker than the human average; relies on mobility to move among the rear lines of the battlefield.
NON_COMBATTENTE.FURTIVITA=Skilled in the art of disguise and misdirection; knows how to go unnoticed in a crowd or move with a light step.
NON_COMBATTENTE.PARATA=Human baseline. Trained in the use of light fencing weapons or small bucklers.
NON_COMBATTENTE.RESISTENZA_MAGICA=Excellent observer of human behavior; instantly notices out-of-place details, whispers and suspicious movements.
NON_COMBATTENTE.PERCEZIONE=Excellent observer of behavior; instantly notices out-of-place details, whispers and suspicious movements in the party or among the enemies.
NON_COMBATTENTE.SOGGEZIONE=Exceptional charm and magnetism. Gives off a theatrical majesty that captivates allies and subdues enemies.
NON_COMBATTENTE.FURIA=Fascinated by heroic ballads and epic deeds; inclined to bold, showy actions to save his companions.
NON_COMBATTENTE.CORAGGIO=Has a strong personality; used to being the center of attention and defying the audience, he is not intimidated by physical threats.
NON_COMBATTENTE.VALORE=Fascinated by heroic ballads and epics; inclined to bold, showy actions to protect the party.
NON_COMBATTENTE.CONTRATTAZIONE=Stage patter: between a rhyme and a compliment, the merchant ends up giving a discount without knowing why.
NON_COMBATTENTE.NUMERO_BERSAGLI=His music or his words spread through the air, letting him influence several targets at once.
NON_COMBATTENTE.STANCHEZZA=Human standard; moving and singing at the same time keeps him average.
NON_COMBATTENTE.DANNI_MAGICI=Channels magic through art and music; his attack spells are decent, but he excels at buffs.
NON_COMBATTENTE.DANNI_FISICI=Trains in movement and coordination, but does not focus his style on developing brute strength.
NON_COMBATTENTE.RIGENERAZIONE_SALUTE=His very music and breathing-rhythm control slightly speed up muscle relaxation.
NON_COMBATTENTE.RIGENERAZIONE_MAGIA=His very music serves as a meditative catalyst, speeding up the energy recovery of the party and of himself.

