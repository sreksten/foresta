LADRA.CARICO_MASSIMO=Represents the perfect human balance for reactivity. Carries only what is strictly necessary so as not to be heard.
LADRA.CRITICO=The King of Criticals. Studies anatomy, attacks from the shadows and uses piercing weapons on exposed spots.
LADRA.PRECISIONE=The pinnacle of aim. Trained to make every single dagger or dart of infamy count. Cannot afford to miss.
LADRA.VELOCITA=The pinnacle of reflexes. Lives on initiative and surprise attacks. Must act before the enemy draws a weapon.
LADRA.FURTIVITA=The King of Shadow. Built around this stat. Knows how to exploit every blind spot, shadow cone and concealment technique.
LADRA.PARATA=Human baseline. Relies on the reactive parry with twin daggers or short weapons, still preferring the dodge.
LADRA.RESISTENZA_MAGICA=The professional's eye. Must have a very high perception to uncover enemy traps and secrets before it is too late.
LADRA.PERCEZIONE=The professional's eye. Must have a very high perception to uncover enemy traps, secret passages and hidden treasures.
LADRA.SOGGEZIONE=Prefers not to be noticed at all. If you see them, their figure aims not to intimidate but to strike by surprise.
LADRA.FURIA=The Baseline. Individualist and pragmatic; helps the party only if it fits their plans for survival or profit.
LADRA.CORAGGIO=The Baseline. Pragmatic: does not get paralyzed by terror, but prefers to withdraw tactically when things heat up.
LADRA.VALORE=The Baseline. Individualist and pragmatic; helps the party only if it fits their plans for survival or profit.
LADRA.CONTRATTAZIONE=The Queen of the Deal. Always knows where the merchant hides the margin and how to make them give it up without noticing.
LADRA.NUMERO_BERSAGLI=Single-Target Specialist. Bets everything on the targeted assassination of a single victim from the shadows.
LADRA.STANCHEZZA=Used to pacing their strength, striking with precision and moving with economical fluidity without wasting breath.
LADRA.DANNI_MAGICI=The Human Baseline. Represents the magic potential of an ordinary human who uses magic only as a utility or support trick.
LADRA.DANNI_FISICI=The Human Baseline. Average physical strength; makes up for the standard multiplier by seeking the weak point (Critical).
LADRA.RIGENERAZIONE_SALUTE=Professional of economical movement; knows how to relax the muscles instantly and pace their breath.
LADRA.RIGENERAZIONE_MAGIA=Individualist and pragmatic; uses small utility tricks but has no open spiritual channel for big recharges.

