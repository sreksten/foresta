PREDEFINITA.CONTRATTAZIONE=Never joins the party: does not deal with merchants.

CHIERICO.CARICO_MASSIMO=Wears armor, shield and mace like a soldier, but without the warrior's physique.
CHIERICO.CRITICO=Standard. Prefers to withstand the enemy's blow than to look for the weak point.
CHIERICO.PRECISIONE=Average: the mace is handled with strength more than aim.
CHIERICO.VELOCITA=A bit slow: armor and shield weigh, and faith does not lighten them.
CHIERICO.FURTIVITA=Armor and holy symbols jingle: going unnoticed is not his trade.
CHIERICO.PARATA=Trained to defend with shield and armor: second only to the warrior.
CHIERICO.RESISTENZA_MAGICA=Their creed protects them from dark forces and magic alterations.
CHIERICO.PERCEZIONE=Average: keeps watch, but without the priest's long vigils.
CHIERICO.SOGGEZIONE=A bit of authority: his role makes him respected.
CHIERICO.FURIA=Standard. Fights with discipline, not with drive.
CHIERICO.CORAGGIO=Good courage: faith sustains him on the front line.
CHIERICO.VALORE=Above average: steps forward to protect the companions.
CHIERICO.CONTRATTAZIONE=The Baseline. Does not give much weight to money.
CHIERICO.NUMERO_BERSAGLI=Standard. His prayers reach the party, his blows one enemy at a time.
CHIERICO.STANCHEZZA=Standard. Fasts and marches in armor have tempered him.
CHIERICO.DANNI_MAGICI=Average: his sacred power is sincere but less deep than the priest's.
CHIERICO.DANNI_FISICI=Good: mace and shield in the hands of one trained to use them.
CHIERICO.RIGENERAZIONE_SALUTE=Catches his breath faster than the priest: he is used to holding the line.
CHIERICO.RIGENERAZIONE_MAGIA=Prayer recharges his sacred flows, but less than for one who does not fight.
DRUIDO.CARICO_MASSIMO=Travels light, with herbs, a staff and little metal.
DRUIDO.CRITICO=Standard. Waits for the forest to show him where the enemy is weak.
DRUIDO.PRECISIONE=Good: the staff and the spear are handled with a steady eye.
DRUIDO.VELOCITA=Quicker than average: used to moving through the undergrowth.
DRUIDO.FURTIVITA=Knows how to walk among the trees without a sound.
DRUIDO.PARATA=Little trained: no shield or metal armor, only the staff.
DRUIDO.RESISTENZA_MAGICA=The bond with nature protects him from magic alterations.
DRUIDO.PERCEZIONE=Excellent: catches every sound, smell and trace of the forest.
DRUIDO.SOGGEZIONE=A bit of authority: animals listen to him, men less so.
DRUIDO.FURIA=Standard. Faces combat calmly, like the forest in autumn.
DRUIDO.CORAGGIO=Good courage: nature has never frightened him.
DRUIDO.VALORE=Average: protects the party more with spells than with his body.
DRUIDO.CONTRATTAZIONE=The Baseline. Gladly barters herbs and favors rather than coins.
DRUIDO.NUMERO_BERSAGLI=Standard. His roots and his swarm grab whoever happens along.
DRUIDO.STANCHEZZA=Hard to tire: has the legs of one who lives outdoors.
DRUIDO.DANNI_MAGICI=Excellent: channels the earth, the water and the poisons of the forest.
DRUIDO.DANNI_FISICI=Modest: fights with the staff more to defend himself than to strike.
DRUIDO.RIGENERAZIONE_SALUTE=Catches his breath through rest outdoors and the right herbs.
DRUIDO.RIGENERAZIONE_MAGIA=Draws on the forces of the forest and recovers magic faster than many casters.
CHIERICA.COME=CHIERICO
DRUIDA.COME=DRUIDO
