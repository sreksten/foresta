# Perché un personaggio non può prendere un artefatto (vedi TipoMotivoRifiutoEquipaggiamento e RegoleEquipaggiamento).
#
# Lingua: italiano. File in UTF-8. Per ogni motivo due voci, con la chiave MOTIVO.SPIEGAZIONE e MOTIVO.FUMETTO:
#   SPIEGAZIONE  la frase in terza persona da far seguire al nome del personaggio ("Il guerriero" + " porta già troppo peso.")
#   FUMETTO      la frase che il personaggio dice nel fumetto, in prima persona
# Un %s è il nome dell'artefatto, quando il motivo lo nomina. Per una lingua nuova si copia questo file in
# rifiuti_equipaggiamento_<lingua>.properties e si traduce: quel che manca in una traduzione si legge in italiano (vedi Testi).

TROPPO_CARICO.SPIEGAZIONE=è già al massimo del carico che può portare
TROPPO_CARICO.FUMETTO=Sono già al massimo del carico che posso portare

SLOT_OCCUPATO.SPIEGAZIONE=non ha uno slot libero per usare %s
SLOT_OCCUPATO.FUMETTO=Sto già usando %s

PERGAMENA.SPIEGAZIONE=le pergamene rimangono nell'inventario del gruppo
PERGAMENA.FUMETTO=Le pergamene rimangono nell'inventario del gruppo

LIVELLO_TROPPO_ALTO.SPIEGAZIONE=non ha ancora il Livello per usare %s
LIVELLO_TROPPO_ALTO.FUMETTO=Non ho ancora il Livello per usare %s

NON_ADATTO_ALLA_CLASSE.SPIEGAZIONE=non usa questo tipo di oggetti
NON_ADATTO_ALLA_CLASSE.FUMETTO=Non uso questo tipo di oggetti

FORZA_INSUFFICIENTE.SPIEGAZIONE=non ha la forza necessaria per portare %s
FORZA_INSUFFICIENTE.FUMETTO=Non ho la forza per portare %s

SECONDA_ARMA_NON_CONSENTITA.SPIEGAZIONE=non combatte con due armi
SECONDA_ARMA_NON_CONSENTITA.FUMETTO=Non combatto con due armi

MANI_OCCUPATE_PER_ARMA_A_DUE_MANI.SPIEGAZIONE=non ha entrambe le mani libere per un'arma a due mani
MANI_OCCUPATE_PER_ARMA_A_DUE_MANI.FUMETTO=Non ho entrambe le mani libere per un'arma a due mani

ARMA_NON_DA_MANO_SECONDARIA.SPIEGAZIONE=non può usare questa arma con la mano secondaria perché non è un'arma da mano secondaria
ARMA_NON_DA_MANO_SECONDARIA.FUMETTO=%s non è un'arma da mano secondaria

MANO_SECONDARIA_OCCUPATA.SPIEGAZIONE=sta già usando anche %s
MANO_SECONDARIA_OCCUPATA.FUMETTO=Sto già usando anche %s

ARMA_A_DUE_MANI_IMPUGNATA.SPIEGAZIONE=impugna già un'arma a due mani
ARMA_A_DUE_MANI_IMPUGNATA.FUMETTO=Impugno già un'arma a due mani
