ARPIA.DESCRIZIONE=Half woman and half bird of prey, she haunts the cliffs and swoops down on travelers with piercing shrieks. She lives in the air and shields herself with it: wind magic slides right off her.
CENTAURO.DESCRIZIONE=Half man and half horse, proud and solitary, he dwells in the deepest woods. He has no known weaknesses, but a strength and speed best not underestimated.
CHIMERA.DESCRIZIONE=Lion, goat and serpent in a single body: three mouths, three ways to hurt. Its blood is made to withstand flames and poison better than many other beasts.
CHIMERA_DRAGO.DESCRIZIONE=A chimera with dragon blood: it breathes fire and cannot be touched by fire. In return, frost hurts it more than it should, and poison troubles it little.
DRAGO.DESCRIZIONE=The lord of the skies, ancient and terrible, keeper of the Forest's treasures. Fire is its home and does not scratch it; but frost wounds it more than anything else, and in flight the earth cannot reach it.
EREMITA.DESCRIZIONE=An old man who has chosen solitude and does not like being disturbed. He is no warrior, but no lamb either: whoever knocks on his door too often finds out.
FANTASMA.DESCRIZIONE=A soul that has found no peace and wanders among the ruins. Its body is mist: weapons pass halfway through it and earth and air spells ignore it. Holy light, however, burns it.
FOLLETTO.DESCRIZIONE=Small, mischievous and quick, it flies in circles around travelers. It fears iron: blades and points hurt it more than they seem to.
GARGOYLE.DESCRIZIONE=A stone statue that someone has brought to life. No spell grazes it and no poison touches it; but stone is hard and brittle at once, and a good hammer cracks it better than a sword.
GIGANTE.DESCRIZIONE=Tall as a tree and slow as a boulder, he sweeps travelers away with a single blow. He has no particular weak points: you must withstand his blows and keep hitting him to the very end.
GOBLIN.DESCRIZIONE=Small, filthy and numerous, the most common of the Forest's enemies. Alone it does little harm, in a pack it is a serious nuisance. Whoever kills a hundred deserves a trophy.
HOBGOBLIN.DESCRIZIONE=A grown-up goblin, stronger and nastier, who commands its kind with a cudgel. It has no particular weak points, but not its cousins' fears either.
IDRA.DESCRIZIONE=A swamp monster with many heads, which grow back if you do not act quickly. Earth, water and air do not scratch it, and confusion does not touch it; fire and acid, instead, keep it from regenerating.
LICH.DESCRIZIONE=A necromancer who gave up life so as not to die and made himself of ice and storm. He cannot be frightened, poisoned or silenced; holy light is his nightmare.
MINOTAURO.DESCRIZIONE=Half man and half bull, he dwells in the labyrinths and the deepest caves. He charges head down without asking permission, and has no known weaknesses.
MINOTAURO_GIGANTE.DESCRIZIONE=An oversized minotaur, lord of a labyrinth that no one has ever crossed in full. He hits hard and does not yield easily.
NECROMANTE.DESCRIZIONE=A mage who has turned his back on life and commands the dead: skeletons and specters walk before him and fight in his place. He studies like the mage, but his magic is made of bones and darkness: necrotic energy hurts him little, holy light much more.
OMBRA_NERA.DESCRIZIONE=A bodiless shadow that creeps among the tombs and sucks the warmth from the living. Like every spirit, weapons barely graze it and earth and air spells cannot reach it.
SCHELETRO.DESCRIZIONE=Bones that move at another's will. It does not bleed, cannot be poisoned and knows no fear; but bones break under blows from a club, while blades and points find little to cut.
SPETTRO.DESCRIZIONE=The ghost of one who died with rage in the body, and who draws strength from that rage. It passes through matter, and holy light is its weak point.
SPIRITO.DESCRIZIONE=A light, bodiless soul that manifests among the ruins. Weapons pass halfway through it and air and earth spells do not touch it; holy light scatters it.
STREGA.DESCRIZIONE=A dark sorceress who lives at the edge of the Forest and has made a trade of cursing. Water, air, earth and fire spells leave her indifferent; but a real flame burns her like anyone else, and curses, which she knows by heart, hurt her little.
TITANO.DESCRIZIONE=The greatest of giants, a colossus that shakes the earth with every step. He has no known weaknesses, and that is enough to make him an opponent to avoid.
TROLL.DESCRIZIONE=A mass of muscle and rage that regenerates from its wounds. Fire and acid are the only things that prevent it, and earth magic does not scratch it.
VIVERNA.DESCRIZIONE=A lesser cousin of the dragon: one wing, a stinger and a venom that does nothing to her. Spell fire does not hurt her, and she flies high enough not to fear the earth.
GUERRIERO.DESCRIZIONE=A fighter with sword and shield, strong and sturdy, who leads the party on the front line. With the right armor he withstands any blow, but he knows little of magic and in battle lets himself be taken by fury.
LADRO.DESCRIZIONE=Agile, quick and silent, he prefers two short blades to a big one. He can pass unnoticed and strike where it hurts most, but cannot withstand others' blows for long.
MAGO.DESCRIZIONE=He studies books and strikes from afar with spells. He has little health and few defenses, but knows the arcane bolt and has a reserve of magic the others can only dream of.
ELFO.DESCRIZIONE=Elegant, agile and gifted with innate magic, an elf fights with two blades or a spear and hurls the arcane bolt. Less sturdy than a warrior, more versatile than a thief.
BARDO.DESCRIZIONE=A wandering storyteller who heals, hypnotizes and instills courage with his voice. Not a great fighter, but a party with a bard lasts longer than one without.
SACERDOTE.DESCRIZIONE=A man of faith who carries divine light and the holy dawn, and who can heal almost any ill. Fragile with weapons, formidable against the undead.
CHIERICO.DESCRIZIONE=A priest who fights on the front line, with mace and shield and faith as armor. He lays hands on wounded companions and turns away the undead; necrotic damage and curses hurt him less.
DRUIDO.DESCRIZIONE=A nature caster who protects the party with bark skin, makes the ailing regenerate, and holds and poisons enemies with roots and swarms. Earth, water and poison do little to him, fire and blades much more.

