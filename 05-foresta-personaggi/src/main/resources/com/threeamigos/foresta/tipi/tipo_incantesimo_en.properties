# tipo_incantesimo: English (American). UTF-8 file. Same keys as the Italian file;
# an entry missing here is read from the parent language and then from Italian.

ARIA.NOME=Air
ARIA.NOME_SINGOLARE=Air spell
ARIA.NOME_PLURALE=Air spells
ARIA.EFFETTO=Unleashes a ramshackle gust that unbalances the opponent and sends them crashing to the ground with a resounding thud.

ACQUA.NOME=Water
ACQUA.NOME_SINGOLARE=Water spell
ACQUA.NOME_PLURALE=Water spells
ACQUA.EFFETTO=Floods the target with a corrosive jet that dampens their ardor and leaves them soaked from head to toe.

TERRA.NOME=Earth
TERRA.NOME_SINGOLARE=Earth spell
TERRA.NOME_PLURALE=Earth spells
TERRA.EFFETTO=Hurls a rain of mud and boulders, ideal for pinning the enemy's legs and blinding them with sand.

FUOCO.NOME=Fire
FUOCO.NOME_SINGOLARE=Fire spell
FUOCO.NOME_PLURALE=Fire spells
FUOCO.EFFETTO=Wraps the opponent in a nasty blaze that burns their clothes and deals a most annoying damage over time.

FULMINE.NOME=Lightning
FULMINE.NOME_SINGOLARE=Lightning spell
FULMINE.NOME_PLURALE=Lightning spells
FULMINE.EFFETTO=Shoots a swift energy arc that leaps between the enemies and stuns them with a high-voltage shock.

GELO.NOME=Frost
GELO.NOME_SINGOLARE=Frost spell
GELO.NOME_PLURALE=Frost spells
GELO.EFFETTO=Freezes the target's bodily fluids, slowing their reflexes or trapping them in an icy ornamental cube.

VELENO.NOME=Poison
VELENO.NOME_SINGOLARE=Poison spell
VELENO.NOME_PLURALE=Poison spells
VELENO.EFFETTO=Injects a sneaky toxin that weakens the victim's stats and eats away their health bit by bit.

MORTE.NOME=Death
MORTE.NOME_SINGOLARE=Death spell
MORTE.NOME_PLURALE=Death spells
MORTE.EFFETTO=Channels necrotic energy to drain the enemy's life force, preventing any desperate attempt at healing.

RESURREZIONE.NOME=Resurrection
RESURREZIONE.NOME_SINGOLARE=Resurrection spell
RESURREZIONE.NOME_PLURALE=Resurrection spells
RESURREZIONE.EFFETTO=Calls a fallen companion back from the realm of the dead, restoring a tenth of their health; if they are still alive, it heals them completely.

SILENZIO.NOME=Silence
SILENZIO.NOME_SINGOLARE=Silence spell
SILENZIO.NOME_PLURALE=Silence spells
SILENZIO.EFFETTO=Seals an opponent's voice, so they cannot cast spells for as long as the silence lasts.

NEBBIA.NOME=Fog
NEBBIA.NOME_SINGOLARE=Fog spell
NEBBIA.NOME_PLURALE=Fog spells
NEBBIA.EFFETTO=Wraps the battlefield in a thick fog: for a few turns all the opponents aim worse.

NEGA_MAGIA.NOME=Negate magic
NEGA_MAGIA.NOME_SINGOLARE=Magic Negation spell
NEGA_MAGIA.NOME_PLURALE=Magic Negation spells
NEGA_MAGIA.EFFETTO=Snuffs out the opponents' magic: for a few turns the spells of whoever is hit deal less damage.

GRIDO_DI_BATTAGLIA.NOME=Battle Cry
GRIDO_DI_BATTAGLIA.NOME_SINGOLARE=Battle Cry spell
GRIDO_DI_BATTAGLIA.NOME_PLURALE=Battle Cry spells
GRIDO_DI_BATTAGLIA.EFFETTO=A battle cry that fires up the party: for a few turns everyone has more courage and more valor.

TERREMOTO.NOME=Earthquake
TERREMOTO.NOME_SINGOLARE=Earthquake spell
TERREMOTO.NOME_PLURALE=Earthquake spells
TERREMOTO.EFFETTO=Shakes the ground under all the opponents' feet: a light Earth damage to each, and whoever is hit may fall.

TEMPESTA.NOME=Storm
TEMPESTA.NOME_SINGOLARE=Storm spell
TEMPESTA.NOME_PLURALE=Storm spells
TEMPESTA.EFFETTO=Unleashes a lightning storm over the whole battlefield: it hits every opponent, but also the companions of whoever summons it.

TERRORE.NOME=Terror
TERRORE.NOME_SINGOLARE=Terror spell
TERRORE.NOME_PLURALE=Terror spells
TERRORE.EFFETTO=A wave of fear over the whole field: every opponent must resist, and whoever fails stays frightened for a few turns.
