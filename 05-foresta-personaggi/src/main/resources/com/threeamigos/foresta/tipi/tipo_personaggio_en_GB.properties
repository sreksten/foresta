# tipo_personaggio: English (British). UTF-8 file. Only the entries that differ from the American English file.

SPETTRO.NOME=Spectre

# British/American spelling differences found in a later check
ARMAIOLO.NOME=Armourer
ARPIA.DESCRIZIONE=Half woman and half bird of prey, she haunts the cliffs and swoops down on travellers with piercing shrieks. She lives in the air and shields herself with it: wind magic slides right off her.
FOLLETTO.DESCRIZIONE=Small, mischievous and quick, it flies in circles around travellers. It fears iron: blades and points hurt it more than they seem to.
GIGANTE.DESCRIZIONE=Tall as a tree and slow as a boulder, he sweeps travellers away with a single blow. He has no particular weak points: you must withstand his blows and keep hitting him to the very end.
NECROMANTE.DESCRIZIONE=A mage who has turned his back on life and commands the dead: skeletons and spectres walk before him and fight in his place. He studies like the mage, but his magic is made of bones and darkness: necrotic energy hurts him little, holy light much more.
GUERRIERO.DESCRIZIONE=A fighter with sword and shield, strong and sturdy, who leads the party on the front line. With the right armour he withstands any blow, but he knows little of magic and in battle lets himself be taken by fury.
MAGO.DESCRIZIONE=He studies books and strikes from afar with spells. He has little health and few defences, but knows the arcane bolt and has a reserve of magic the others can only dream of.
CHIERICO.DESCRIZIONE=A priest who fights on the front line, with mace and shield and faith as armour. He lays hands on wounded companions and turns away the undead; necrotic damage and curses hurt him less.
SPETTRO.NOME_SINGOLARE=Spectre
SPETTRO.NOME_PLURALE=Spectres
ARMAIOLO.NOME_SINGOLARE=Armourer
