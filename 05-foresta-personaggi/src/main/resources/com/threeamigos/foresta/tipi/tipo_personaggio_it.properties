# DESCRIZIONE: il testo della voce del bestiario (vedi bestiario.md), una per ruolo, quindi solo alla classe al maschile (Mago, non Maga). Dice chi
# è e accenna alle sue forze e debolezze senza dare i numeri: quelli il bestiario li scrive man mano che si scoprono (CaratteristicaDiClasse).
ARPIA.DESCRIZIONE=Metà donna e metà uccello rapace, abita le rupi e piomba sui viandanti con strida laceranti. Vive nell'aria e dell'aria si fa scudo: le magie del vento le scivolano addosso.
CENTAURO.DESCRIZIONE=Metà uomo e metà cavallo, fiero e solitario, abita i boschi più fitti. Non ha debolezze note, ma una forza e una velocità che è meglio non sottovalutare.
CHIMERA.DESCRIZIONE=Leone, capra e serpente in un solo corpo: tre bocche, tre modi di far male. Il suo sangue è fatto per tollerare le fiamme e il veleno meglio di molte altre bestie.
CHIMERA_DRAGO.DESCRIZIONE=Una chimera con il sangue del drago: soffia fuoco e dal fuoco non si fa toccare. In compenso il gelo la ferisce più del dovuto, e il veleno la affligge poco.
DRAGO.DESCRIZIONE=Il signore dei cieli, antico e terribile, custode dei tesori della Foresta. Il fuoco è casa sua e non lo scalfisce; ma il gelo lo ferisce più di ogni altra cosa, e in volo la terra non lo raggiunge.
EREMITA.DESCRIZIONE=Un vecchio che ha scelto la solitudine e non ama essere disturbato. Non è un guerriero, ma nemmeno un agnello: chi bussa troppo spesso alla sua porta se ne accorge.
FANTASMA.DESCRIZIONE=Un'anima che non ha trovato pace e vaga fra le rovine. Il suo corpo è nebbia: le armi lo attraversano a metà e gli incantesimi della terra e dell'aria lo ignorano. La luce sacra, invece, lo brucia.
FOLLETTO.DESCRIZIONE=Piccolo, dispettoso e veloce, vola in tondo attorno ai viandanti. Teme il ferro: lame e punte lo feriscono più di quanto sembri.
GARGOYLE.DESCRIZIONE=Una statua di pietra a cui qualcuno ha dato vita. Nessun incantesimo la sfiora e nessun veleno la tocca; ma la pietra è dura e fragile insieme, e un buon martello la spacca meglio di una spada.
GIGANTE.DESCRIZIONE=Alto come un albero e lento come un macigno, spazza via i viandanti con un colpo solo. Non ha punti deboli particolari: bisogna reggere i suoi colpi e colpirlo fino alla fine.
GOBLIN.DESCRIZIONE=Piccolo, sporco e numeroso, il più comune dei nemici della Foresta. Da solo fa poco male, in branco è un fastidio serio. Chi ne uccide cento merita un trofeo.
HOBGOBLIN.DESCRIZIONE=Un goblin cresciuto, più forte e più cattivo, che comanda i suoi simili a suon di randellate. Non ha punti deboli particolari, ma nemmeno le paure dei suoi cugini.
IDRA.DESCRIZIONE=Un mostro di palude con tante teste, che ricrescono se non si agisce in fretta. Terra, acqua e aria non la scalfiscono, e la confusione non la tocca; il fuoco e l'acido invece le impediscono di rigenerarsi.
LICH.DESCRIZIONE=Un necromante che ha rinunciato alla vita per non morire e si è fatto di ghiaccio e di tempesta. Non si spaventa, non si avvelena e non lo si fa tacere; la luce sacra è il suo incubo.
MINOTAURO.DESCRIZIONE=Metà uomo e metà toro, abita i labirinti e le grotte più profonde. Carica a testa bassa senza chiedere il permesso, e non ha debolezze note.
MINOTAURO_GIGANTE.DESCRIZIONE=Un minotauro di taglia fuori misura, signore di un labirinto che nessuno ha mai attraversato per intero. Colpisce forte e non cede facilmente.
NECROMANTE.DESCRIZIONE=Un mago che ha voltato le spalle alla vita e comanda i morti: scheletri e spettri camminano davanti a lui e combattono al suo posto. Studia come il mago, ma la sua magia è fatta di ossa e di tenebra: l'energia necrotica lo ferisce poco, la luce sacra molto di più.
OMBRA_NERA.DESCRIZIONE=Un'ombra senza corpo che striscia fra le tombe e succhia il calore dei vivi. Come ogni spirito, le armi la sfiorano appena e gli incantesimi della terra e dell'aria non la raggiungono.
SCHELETRO.DESCRIZIONE=Ossa che si muovono per volontà d'altri. Non sanguina, non si avvelena e non conosce paura; ma le ossa si spezzano a bastonate, mentre lame e punte trovano poco da tagliare.
SPETTRO.DESCRIZIONE=Il fantasma di chi è morto con la rabbia in corpo, e che dalla rabbia trae la sua forza. Passa attraverso la materia, e la luce sacra è il suo punto debole.
SPIRITO.DESCRIZIONE=Un'anima leggera e senza corpo che si manifesta fra le rovine. Le armi lo attraversano a metà e gli incantesimi dell'aria e della terra non lo toccano; la luce sacra lo disperde.
STREGA.DESCRIZIONE=Una maga oscura che vive ai margini della Foresta e ha fatto della maledizione il suo mestiere. Gli incantesimi dell'acqua, dell'aria, della terra e del fuoco la lasciano indifferente; ma una vera fiamma la brucia come tutti, e le maledizioni, che conosce a menadito, la feriscono poco.
TITANO.DESCRIZIONE=Il più grande dei giganti, un colosso che scuote la terra a ogni passo. Non ha debolezze note, e questo basta a farne un avversario da evitare.
TROLL.DESCRIZIONE=Una massa di muscoli e di rabbia che si rigenera dalle ferite. Il fuoco e l'acido sono gli unici a impedirglielo, e la magia della terra non lo scalfisce.
VIVERNA.DESCRIZIONE=Una cugina minore del drago: un'ala, un pungiglione e un veleno che a lei non fa nulla. Il fuoco degli incantesimi non la ferisce, e vola abbastanza alta da non temere la terra.
GUERRIERO.DESCRIZIONE=Un combattente di spada e scudo, forte e robusto, che guida il gruppo in prima linea. Con l'armatura giusta regge qualsiasi colpo, ma di magia sa poco e in battaglia si lascia prendere dalla furia.
LADRO.DESCRIZIONE=Agile, rapido e silenzioso, preferisce due lame corte a una grande. Sa passare inosservato e colpire dove fa più male, ma non regge a lungo i colpi altrui.
MAGO.DESCRIZIONE=Studia i libri e colpisce da lontano con gli incantesimi. Ha poca salute e poche difese, ma conosce il dardo arcano e ha una riserva di magia che gli altri si sognano.
ELFO.DESCRIZIONE=Elegante, agile e dotato di una magia innata, combatte con due lame o con una lancia e scaglia il dardo arcano. Meno robusto di un guerriero, più versatile di un ladro.
BARDO.DESCRIZIONE=Un cantastorie errante che con la voce cura, ipnotizza e infonde coraggio. Non è un gran combattente, ma un gruppo con un bardo regge più a lungo di uno senza.
SACERDOTE.DESCRIZIONE=Un uomo di fede che porta con sé la luce divina e l'alba sacra, e che sa guarire quasi ogni male. Fragile con le armi, formidabile contro i non morti.
CHIERICO.DESCRIZIONE=Un sacerdote che combatte in prima linea, con mazza e scudo e la fede come armatura. Impone le mani sui compagni feriti e scaccia i non morti; il necrotico e le maledizioni lo feriscono meno.
DRUIDO.DESCRIZIONE=Un incantatore della natura che protegge il gruppo con una pelle di corteccia, fa rigenerare chi sta male e ferma e avvelena i nemici con radici e sciami. Terra, acqua e veleno gli fanno poco, il fuoco e le lame molto di più.

