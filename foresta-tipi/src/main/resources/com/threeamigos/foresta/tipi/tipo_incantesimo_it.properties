# I testi di TipoIncantesimo (vedi Testi): una voce per costante, con chiave COSTANTE.VOCE.
#
# Lingua: italiano. File in UTF-8. Voci: NOME, NOME_SINGOLARE, NOME_PLURALE, EFFETTO.
# Per una lingua nuova si copia questo file in tipo_incantesimo_<lingua>.properties e si traduce: quel che manca in una
# traduzione si legge in italiano.

ARIA.NOME=Aria
ARIA.NOME_SINGOLARE=incantesimo dell'Aria
ARIA.NOME_PLURALE=incantesimi dell'Aria
ARIA.EFFETTO=Scatena una folata sgangherata che destabilizza l'avversario e lo scaraventa a terra con un sonoro tonfo.

ACQUA.NOME=Acqua
ACQUA.NOME_SINGOLARE=incantesimo dell'Acqua
ACQUA.NOME_PLURALE=incantesimi dell'Acqua
ACQUA.EFFETTO=Inonda il bersaglio con un getto corrosivo che spegne i suoi bollori e lo lascia inzuppato da capo a piedi.

TERRA.NOME=Terra
TERRA.NOME_SINGOLARE=incantesimo di Terra
TERRA.NOME_PLURALE=incantesimi di Terra
TERRA.EFFETTO=Scaglia una pioggia di fango e macigni ideale per bloccare le gambe del nemico e accecarlo di sabbia.

FUOCO.NOME=Fuoco
FUOCO.NOME_SINGOLARE=incantesimo del Fuoco
FUOCO.NOME_PLURALE=incantesimi del Fuoco
FUOCO.EFFETTO=Avvolge l'avversario in un incendio molesto che brucia i suoi vestiti e infligge un fastidiosissimo danno nel tempo.

FULMINE.NOME=Fulmine
FULMINE.NOME_SINGOLARE=incantesimo del Fulmine
FULMINE.NOME_PLURALE=incantesimi del Fulmine
FULMINE.EFFETTO=Saetta un arco energetico rapido che si propaga tra i nemici e li stordisce con una scossa ad alto voltaggio.

GELO.NOME=Gelo
GELO.NOME_SINGOLARE=incantesimo del Gelo
GELO.NOME_PLURALE=incantesimi del Gelo
GELO.EFFETTO=Congela i fluidi corporei del bersaglio riducendone i riflessi o bloccandolo in un gelido cubetto ornamentale.

VELENO.NOME=Veleno
VELENO.NOME_SINGOLARE=incantesimo del Veleno
VELENO.NOME_PLURALE=incantesimi del Veleno
VELENO.EFFETTO=Inietta una tossina subdola che debilita le statistiche della vittima consumando la sua salute scatto dopo scatto.

MORTE.NOME=Morte
MORTE.NOME_SINGOLARE=incantesimo di Morte
MORTE.NOME_PLURALE=incantesimi di Morte
MORTE.EFFETTO=Canalizza l'energia necrotica per prosciugare la forza vitale nemica, impedendo qualsiasi disperato tentativo di cura.

RESURREZIONE.NOME=Resurrezione
RESURREZIONE.NOME_SINGOLARE=incantesimo della Resurrezione
RESURREZIONE.NOME_PLURALE=incantesimi della Resurrezione
RESURREZIONE.EFFETTO=Richiama un compagno caduto dal regno dei morti, restituendogli un decimo della sua salute; se è ancora vivo lo risana del tutto.

ALBA_SACRA.NOME=Alba Sacra
ALBA_SACRA.NOME_SINGOLARE=incantesimo dell'Alba Sacra
ALBA_SACRA.NOME_PLURALE=incantesimi dell'Alba Sacra
ALBA_SACRA.EFFETTO=Rimuove gli effetti di stato negativi e i modificatori temporanei al gruppo, lasciando l'ispirazione e il berserk.

SILENZIO.NOME=Silenzio
SILENZIO.NOME_SINGOLARE=incantesimo del Silenzio
SILENZIO.NOME_PLURALE=incantesimi del Silenzio
SILENZIO.EFFETTO=Sigilla la voce di un avversario, che non può più lanciare incantesimi finché dura il silenzio.

LUCE_DIVINA.NOME=Luce Divina
LUCE_DIVINA.NOME_SINGOLARE=incantesimo della Luce Divina
LUCE_DIVINA.NOME_PLURALE=incantesimi della Luce Divina
LUCE_DIVINA.EFFETTO=Invoca una luce sacra che brucia i non morti, e che non fa distinzioni: investe anche lo Scheletro che combatte al fianco di chi la invoca.
