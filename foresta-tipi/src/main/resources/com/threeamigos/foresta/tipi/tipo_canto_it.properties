# I testi di TipoCanto (vedi Testi): una voce per costante, con chiave COSTANTE.VOCE.
#
# Lingua: italiano. File in UTF-8. Voci: NOME, DESCRIZIONE.
# Per una lingua nuova si copia questo file in tipo_canto_<lingua>.properties e si traduce: quel che manca in una
# traduzione si legge in italiano.

CURATIVO.NOME=Canto curativo
CURATIVO.DESCRIZIONE=Cura il personaggio più ferito del gruppo.

IPNOTICO.NOME=Canto ipnotico
IPNOTICO.DESCRIZIONE=Spaventa o confonde gli avversari.

DI_VALORE.NOME=Canto di valore
DI_VALORE.DESCRIZIONE=Rafforza il coraggio e la precisione di tutto il gruppo.

URLO_DELLA_BANSHEE.NOME=Urlo della Banshee
URLO_DELLA_BANSHEE.DESCRIZIONE=Spaventa e confonde gli avversari, con più probabilità di successo del canto ipnotico.
