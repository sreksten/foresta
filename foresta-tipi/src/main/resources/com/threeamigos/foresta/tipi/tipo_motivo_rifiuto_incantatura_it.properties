# I testi di TipoMotivoRifiutoIncantatura (vedi Testi): una voce per costante, con chiave COSTANTE.VOCE.
#
# Lingua: italiano. File in UTF-8. Voci: FRASE.
# Per una lingua nuova si copia questo file in tipo_motivo_rifiuto_incantatura_<lingua>.properties e si traduce: quel che manca in una
# traduzione si legge in italiano.

NESSUN_ARTEFATTO.FRASE=Sul banco manca l'artefatto da incantare.
PIU_ARTEFATTI.FRASE=Sul banco ci va un artefatto alla volta.
NESSUN_INGREDIENTE.FRASE=Sul banco manca un ingrediente magico da fondere.
NON_INCANTABILE.FRASE=Questo non si può incantare: solo armi, scudi, elmi, maschere, armature, schinieri e libri magici.
NESSUN_MIGLIORAMENTO.FRASE=Nessun effetto degli ingredienti è migliore di quelli dell'artefatto.
POTERE_MAGICO_FUORI_POSTO.FRASE=Il potere magico si fonde solo su bastoni e libri magici, e questo ingrediente non ha altro.
INCANTAMENTO_SU_LIBRO.FRASE=Su un libro magico gli incantamenti elementali non hanno effetto, e questo ingrediente non ha altro.
LIVELLO_DEL_MONDO_RAGGIUNTO.FRASE=Un artefatto non può salire oltre il livello del mondo.
MONETE_INSUFFICIENTI.FRASE=Non avete abbastanza monete per la fusione.
NIENTE_DA_RIPROGRAMMARE.FRASE=Questo artefatto non ha incantamenti da riprogrammare.
