# Le descrizioni dei comandi del giocatore, mostrate nei cartigli della barra delle icone (vedi Comando.getDescrizione).
#
# Lingua: italiano. File in UTF-8. Chiave: il nome della costante di Comando. Un comando senza voce non ha descrizione
# (gli slot NUMERO_1..5, le frecce di scorrimento, il timer, i comandi segreti). Per una lingua nuova si copia questo file
# in comandi_<lingua>.properties e si traduce: quel che manca in una traduzione si legge in italiano (vedi Testi).

