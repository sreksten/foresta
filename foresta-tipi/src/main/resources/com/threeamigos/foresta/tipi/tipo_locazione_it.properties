# I testi di TipoLocazione (vedi Testi): una voce per costante, con chiave COSTANTE.VOCE.
#
# Lingua: italiano. File in UTF-8. Voci: NOME_PROPRIO (il nome con l'articolo, per le locazioni uniche), NOME_DELLA_CITTA (il nome di una città senza articolo né "la città di": la provenienza dei suoi abitanti, solo per le città).
# Per una lingua nuova si copia questo file in tipo_locazione_<lingua>.properties e si traduce: quel che manca in una
# traduzione si legge in italiano.

CITTA_NYENA.NOME_PROPRIO=la città di Nyena
CITTA_NYENA.NOME_DELLA_CITTA=Nyena
CITTA_MALGAARD.NOME_PROPRIO=la città di Malgaard
CITTA_MALGAARD.NOME_DELLA_CITTA=Malgaard
CITTA_RUUNA.NOME_PROPRIO=la città di Ruuna
CITTA_RUUNA.NOME_DELLA_CITTA=Ruuna
CITTA_FLEENA.NOME_PROPRIO=la città di Fleena
CITTA_FLEENA.NOME_DELLA_CITTA=Fleena
CASTELLO_IDRA.NOME_PROPRIO=la Rocca del Sangue
CASTELLO_MINOTAURO.NOME_PROPRIO=la Torre della Paura
CASTELLO_LICH.NOME_PROPRIO=il Castello dell'Ombra
CASTELLO_STREGA.NOME_PROPRIO=il Maniero del Malefizio
CASTELLO_DRAGO.NOME_PROPRIO=il Castello della Morte Alata
