OMBRAFIAMMA.DANNI_FISICI=Essere sovrannaturale
OMBRAFIAMMA.RIGENERAZIONE_SALUTE=Essere sovrannaturale intessuto di magia; la vitalità del fuoco gli permette una rigenerazione accelerata.
OMBRAFIAMMA.RIGENERAZIONE_MAGIA=Essere sovrannaturale intessuto di magia del fuoco; assorbe i flussi energetici con eccezionale efficienza.

ARPIA.CARICO_MASSIMO=Pur avendo dimensioni simili a un umano, la sua struttura ossea deve rimanere cava e leggera per consentirle il volo. Un sovraccarico le impedirebbe di decollare.
ARPIA.CRITICO=Sfrutta la picchiata dall'alto e gli artigli affilati per mirare direttamente agli occhi o alla gola del bersaglio.
ARPIA.PRECISIONE=Ottima vista da rapace e coordinazione nel ghermire i bersagli in movimento dall'alto.
ARPIA.VELOCITA=Estremamente rapida. Il vantaggio del volo le permette scatti fulminei e picchiate difficili da anticipare.
ARPIA.FURTIVITA=Il piumaggio e lo sbattere delle ali la rendono rumorosa; predilige l'attacco a viso aperto dall'alto piuttosto che l'approccio furtivo.
ARPIA.PARATA=Struttura ossea leggera e fragile; preferisce schivare piuttosto che bloccare un colpo che le spezzerebbe le ali.
ARPIA.RESISTENZA_MAGICA=Vista da rapace. Capace di scorgere un topo che si muove tra l'erba da centinaia di metri d'altezza.
ARPIA.PERCEZIONE=Vista da rapace. Capace di scorgere un topo che si muove tra l'erba da centinaia di metri d'altezza nei cieli.
ARPIA.SOGGEZIONE=Più fastidiosa e stridula che veramente terrificante; la sua presenza non impone rispetto o blocco psicologico.
ARPIA.FURIA=Creatura predatrice ed egoista; preferisce banchettare sulle carogne piuttosto che rischiare la vita per un suo simile.
ARPIA.CORAGGIO=Creatura opportunista. Se si rende conto che lo scontro è svantaggioso o troppo pericoloso, cede facilmente al panico e si ritira.
ARPIA.VALORE=Creatura predatrice ed egoista; preferisce banchettare sulle carogne dei compagni piuttosto che rischiare la vita per salvarli.
ARPIA.NUMERO_BERSAGLI=Focalizzata su attacchi rapidi in picchiata contro un singolo bersaglio isolato; non ha raggio d'azione ampio.
ARPIA.STANCHEZZA=Il volo battuto in combattimento richiede un dispendio energetico notevole, accelerando la fatica.
ARPIA.DANNI_MAGICI=La sua natura è ferina e primitiva; lancia incantesimi istintivi ma privi di vera raffinatezza o potenza distruttiva.
ARPIA.DANNI_FISICI=Struttura ossea leggera adatta al volo; i suoi attacchi fisici (artigliate) sono rapidi ma privi di grande impatto di massa.
ARPIA.RIGENERAZIONE_SALUTE=Struttura leggera che recupera lo sforzo muscolare a ritmi normali.
ARPIA.RIGENERAZIONE_MAGIA=Natura ferina e primitiva; la sua mente è troppo caotica per concentrarsi sul ripristino dei flussi magici.

CENTAURO.CARICO_MASSIMO=Unisce la parte superiore umana a quella inferiore di un cavallo. Beneficia del bonus da quadrupede (molto stabile).
CENTAURO.CRITICO=Eccellente nella carica, ma la sua stazza ibrida lo rende meno adatto alle finte o ai colpi di fioretto ravvicinati.
CENTAURO.PRECISIONE=Anatomia stabile che fornisce un'eccellente base d'appoggio per scoccare frecce o lanciare giavellotti.
CENTAURO.VELOCITA=Tra i più veloci a terra. Il corpo equino gli conferisce una velocità di galoppo e una carica devastanti.
CENTAURO.FURTIVITA=Gli zoccoli che battono sul terreno rendono quasi impossibile muoversi silenziosamente, tranne che su terreni erbosi soffici.
CENTAURO.PARATA=La sua stabilità a quattro zampe gli permette di incassare l'impatto di un blocco senza perdere l'equilibrio.
CENTAURO.RESISTENZA_MAGICA=Essendo una creatura delle praterie e un cacciatore nato, ha sensi molto sviluppati per prevenire gli agguati.
CENTAURO.PERCEZIONE=Creatura delle praterie selvagge e cacciatore nato, ha sensi molto sviluppati per prevenire gli agguati nel suo territorio.
CENTAURO.SOGGEZIONE=La fisionomia fiera e imponente del corpo equino incute un naturale timore reverenziale.
CENTAURO.FURIA=Fiero e leale difensore della tribù; ha un profondo senso dell'onore e della protezione del branco.
CENTAURO.CORAGGIO=Orgoglioso e fiero guerriero delle praterie. Possiede una solida fermezza marziale contro la paura e difende la sua terra.
CENTAURO.VALORE=Fiero e leale difensore della tribù; possiede un profondo senso dell'onore e della salvaguardia del proprio branco.
CENTAURO.CONTRATTAZIONE=Fiero e diretto, disprezza il mercanteggiare delle città degli uomini.
CENTAURO.NUMERO_BERSAGLI=La stazza equina e la travolgente spazzata della lancia in carica gli permettono di colpire più nemici in linea.
CENTAURO.STANCHEZZA=Resistenza equina leggendaria. Abituato a galoppare per ore prima di mostrare segni di cedimento.
CENTAURO.DANNI_MAGICI=Razza fiera legata alla terra e alla caccia fisica; la sua connessione con l'arcano distruttivo è molto limitata.
CENTAURO.DANNI_FISICI=Sfrutta l'immensa spinta cinetica e la potenza muscolare delle zampe equine durante le cariche con lancia o zoccoli.
CENTAURO.RIGENERAZIONE_SALUTE=Fisiologia equina possente dotata di una capacità polmonare e cardiaca d'élite per smaltire la fatica.
CENTAURO.RIGENERAZIONE_MAGIA=Creatura legata alla terra e alla caccia fisica; ha una scarsissima attitudine a richiamare l'energia arcana.

CHIMERA.CARICO_MASSIMO=Corpo da leone (quadrupede grande), con tre teste e code. Ha una base d'appoggio formidabile per caricare prede o fardelli sulla schiena.
CHIMERA.CRITICO=Avendo tre teste indipendenti (leone, capra, serpente), attacca da angolazioni multiple aumentando le chance di trovare un punto scoperto.
CHIMERA.PRECISIONE=Bilanciata: compensa la foga bestiale con tre linee visive indipendenti che coprono gli angoli ciechi.
CHIMERA.VELOCITA=Agilità felina combinata con i riflessi di tre teste. Reattiva nello scatto iniziale.
CHIMERA.FURTIVITA=Possiede la furtività felina innata del leone, parzialmente limitata però dalla presenza delle altre due teste che possono tradirla.
CHIMERA.PARATA=Si affida principalmente ai balzi e all'agilità felina per evitare i colpi; non possiede scudi o arti adatti a una "parata" in senso tecnico, ma può deviare parzialmente gli attacchi leggeri usando le zampe anteriori
CHIMERA.RESISTENZA_MAGICA=Tre teste significano tre paia di occhi e orecchie indipendenti. Praticamente impossibile da cogliere alle spalle.
CHIMERA.PERCEZIONE=Tre teste indipendenti significano tre paia di occhi e orecchie. È praticamente impossibile da cogliere alle spalle.
CHIMERA.SOGGEZIONE=Un abominio a tre teste che ruggisce, bela e fissa il nemico contemporaneamente è un incubo psicologico.
CHIMERA.FURIA=Bestia magica selvaggia mossa solo da fame e istinto di sopravvivenza individuale.
CHIMERA.CORAGGIO=Bilanciata: la ferocia istintiva delle tre teste le impedisce di fuggire subito, ma non possiede una vera disciplina mentale.
CHIMERA.VALORE=Bestia magica selvaggia mossa esclusivamente dalla fame e dall'istinto di sopravvivenza individuale.
CHIMERA.NUMERO_BERSAGLI=Avendo tre teste che mordono e attaccano in direzioni diverse, può ingaggiare più nemici nello stesso istante.
CHIMERA.STANCHEZZA=Metabolismo predatore efficiente, ma coordinare tre teste in battaglia consuma energia stagna.
CHIMERA.DANNI_MAGICI=Bestia magica che può sputare elementi (es. fuoco) grazie alle sue teste, ma manca di controllo logico sulla trama magica.
CHIMERA.DANNI_FISICI=Grande predatore quadrupede; la combinazione di morsi e zampate feline infligge gravi danni laceranti.
CHIMERA.RIGENERAZIONE_SALUTE=Grande predatore quadrupede; la presenza di tre teste permette di alternare parzialmente le fasi di vigilanza e riposo corporeo.
CHIMERA.RIGENERAZIONE_MAGIA=Bestia selvaggia; possiede poteri elementali innati (sputare fuoco) ma non una vera rigenerazione mentale della trama magica.

CHIMERA_DRAGO.CARICO_MASSIMO=Essendo il doppio di una chimera normale, la sua massa volumetrica e la capacità di sollevamento scalano in modo esponenziale.
CHIMERA_DRAGO.CRITICO=Grande il doppio della chimera normale. Diventa più sgraziata e brutale; perde la finezza delle tre teste a favore della devastazione.
CHIMERA_DRAGO.PRECISIONE=La mole raddoppiata la rende leggermente più lenta nei micro-aggiustamenti d'attacco.
CHIMERA_DRAGO.VELOCITA=Avendo raddoppiato la sua mole, subisce l'effetto dell'inerzia: è potente ma molto più lenta a partire.
CHIMERA_DRAGO.FURTIVITA=Le dimensioni raddoppiate distruggono ogni velleità felina: i suoi passi fanno vibrare il terreno.
CHIMERA_DRAGO.PARATA=La mole raddoppiata le permette di usare le sue enormi zampe anteriori e le scaglie come scudi naturali stabili.
CHIMERA_DRAGO.RESISTENZA_MAGICA=Unisce la visione a 360 gradi della chimera ai sensi magici superiori ereditati dalla stirpe dei draghi.
CHIMERA_DRAGO.PERCEZIONE=Unisce la visione a 360 gradi della chimera ai sensi magici superiori ereditati dalla stirpe dei draghi.
CHIMERA_DRAGO.SOGGEZIONE=Raddoppiata nelle dimensioni e infusa di tratti draconici; emana una presenza opprimente sul campo.
CHIMERA_DRAGO.FURIA=Nonostante la mole, resta un abominio privo di codice morale o legami empatici con altre creature.
CHIMERA_DRAGO.CORAGGIO=La componente draconica infusa nella sua forma raddoppiata le conferisce un netto aumento della forza di volontà.
CHIMERA_DRAGO.VALORE=Nonostante la mole imponente, resta un abominio privo di codice morale, empatia o legami con altre creature.
CHIMERA_DRAGO.NUMERO_BERSAGLI=Raddoppiata nelle dimensioni; i suoi artigli e la coda coprono una porzione di campo di battaglia immensa.
CHIMERA_DRAGO.STANCHEZZA=La mole raddoppiata richiede uno sforzo immenso del cuore e dei muscoli per muoversi.
CHIMERA_DRAGO.DANNI_MAGICI=Beneficia enormemente del sangue di drago infuso nella sua forma raddoppiata, che amplifica i danni elementali.
CHIMERA_DRAGO.DANNI_FISICI=Raddoppiata nelle dimensioni; ogni suo attacco fisico sposta tonnellate di peso, schiacciando i difensori.
CHIMERA_DRAGO.RIGENERAZIONE_SALUTE=La mole raddoppiata è supportata dalla vitalità travolgente del sangue di drago, che accelera il ripristino muscolare.
CHIMERA_DRAGO.RIGENERAZIONE_MAGIA=Beneficia del sangue di drago infuso nella sua forma raddoppiata, che funge da enorme conduttore magico passivo.

EREMITA.CARICO_MASSIMO=Fisico non avvezzo agli sforzi prolungati; preferisce borse leggere per ingredienti alchemici e pergamene.
EREMITA.CRITICO=Focalizzati su incantesimi ad area (es. palle di fuoco) o manipolazioni. Non cercano il punto debole anatomico.
EREMITA.PRECISIONE=Riflessi fisici leggermente arrugginiti dall'isolamento, compensati però dalla concentrazione mentale.
EREMITA.VELOCITA=Lo stile di vita ascetico e l'età avanzata ne rallentano i movimenti fisici e l'iniziativa.
EREMITA.FURTIVITA=Anni passati a vivere nei boschi o nelle grotte gli hanno insegnato a muoversi senza disturbare la fauna locale.
EREMITA.PARATA=Riflessi rallentati e scarsa propensione all'uso di scudi pesanti; preferisce evitare il tipoConfronto diretto.
EREMITA.RESISTENZA_MAGICA=La vita in solitudine nella natura selvaggia ha affinato il suo intuito e la sua capacità di ascoltare l'ambiente.
EREMITA.PERCEZIONE=La vita in solitudine nella natura selvaggia ha affinato il suo intuito e la sua capacità di ascoltare ogni minimo rumore ambientale.
EREMITA.SOGGEZIONE=Aspetto trasandato e isolato; evoca follia o pietà più che rispetto o timore reverenziale.
EREMITA.FURIA=Distaccato dalle dinamiche del mondo, ma conserva una profonda saggezza morale e compassione se costretto a proteggere qualcuno.
EREMITA.CORAGGIO=Ha affrontato la solitudine e le privazioni della natura selvaggia; la sua mente è stabile, anche se priva dello slancio dell'eroe.
EREMITA.VALORE=Distaccato dalle dinamiche del mondo, ma conserva una profonda saggezza morale e compassione se costretto a proteggere qualcuno.
EREMITA.CONTRATTAZIONE=Vive di poco e ha perso l'abitudine agli scambi; le monete gli sembrano un'invenzione recente.
EREMITA.NUMERO_BERSAGLI=Abituato a combattere da solo, fatica a dividere la sua attenzione su folle di nemici.
EREMITA.STANCHEZZA=L'età avanzata e la scarsa abitudine ai ritmi frenetici del combattimento lo fanno stancare prima.
EREMITA.DANNI_MAGICI=Anni di isolamento e profonda comunione con le forze occulte o naturali ne hanno potenziato la focalizzazione mistica.
EREMITA.DANNI_FISICI=Il corpo invecchiato e indebolito dalle privazioni ascetiche riduce drasticamente l'efficacia dei suoi colpi fisici.
EREMITA.RIGENERAZIONE_SALUTE=Corpo anziano e rallentato dagli anni; i suoi muscoli richiedono più tempo per riprendersi da uno sforzo intenso.
EREMITA.RIGENERAZIONE_MAGIA=Anni di meditazione isolata e introspezione gli permettono di focalizzare la mente e canalizzare il mana con facilità.

FANTASMA.CARICO_MASSIMO=Trattandosi di uno spettro, non ha un inventario fisico per gli oggetti del mondo materiale.
FANTASMA.CRITICO=Creature eteree che fluttuano. La loro parziale intangibilità rende difficile sferrare un colpo fisico concentrato sui punti vitali corporei.
FANTASMA.PRECISIONE=La sua natura incorporea rende difficile calcolare l'impatto perfetto con la materia fisica del mondo reale.
FANTASMA.VELOCITA=Fluttua nell'aria ignorando l'attrito del terreno e la gravità, guadagnando una discreta rapidità d'azione.
FANTASMA.FURTIVITA=Incorporeo e fluttuante. Non produce alcun rumore di passi e può attraversare gli ostacoli visivi per nascondersi.
FANTASMA.PARATA=Quasi impossibile parare un colpo fisico. La materia solida attraversa il suo corpo a meno che non usi armi incantate.
FANTASMA.RESISTENZA_MAGICA=Sente la presenza delle anime e dei vivi, ma la sua transizione spettrale ne distorce parzialmente la vista fisica.
FANTASMA.PERCEZIONE=Sente la presenza delle anime e dei vivi, ma la sua transizione spettrale ne distorce parzialmente la vista nel mondo fisico.
FANTASMA.SOGGEZIONE=Un'apparizione spettrale che fluttua urlando spezza facilmente il morale dei soldati meno coraggiosi.
FANTASMA.FURIA=Una presenza eterea sbiadita, troppo intrappolata nel proprio limbo per curarsi del destino dei vivi.
FANTASMA.CORAGGIO=Essendo già morto, ha superato la paura della fine biologica, risultando molto saldo contro i debuff mentali e psichici.
FANTASMA.VALORE=Una presenza eterea sbiadita, troppo intrappolata nel proprio limbo emotivo per curarsi del destino dei vivi.
FANTASMA.NUMERO_BERSAGLI=I suoi attacchi spettrali passano attraverso la materia, ma è limitato nella capacità di colpire più corpi solidi insieme.
FANTASMA.STANCHEZZA=Immune. Essendo uno spettro incorporeo, non ha muscoli, polmoni o acido lattico.
FANTASMA.DANNI_MAGICI=Creatura spirituale che manipola facilmente le energie dell'oltretomba, infliggendo buoni danni da freddo o da logoramento.
FANTASMA.DANNI_FISICI=Quasi incapace di interagire con il mondo materiale. I suoi attacchi fisici sono flebili carezze gelide.
FANTASMA.RIGENERAZIONE_SALUTE=Incorporeo. Non ha una riserva di vigore fisico, non accumula acido lattico e non necessita di riposo muscolare.
FANTASMA.RIGENERAZIONE_MAGIA=Essendo un'entità spirituale pura, il suo legame con il piano energetico è nativo, permettendo un ottimo recupero.

FOLLETTO.CARICO_MASSIMO=Creatura minuscola e magica. Può trasportare solo oggetti leggerissimi (anelli, piccole fiale, aghi).
FOLLETTO.CRITICO=Minuscolo e rapidissimo, infila i suoi piccoli aghi e dardi magici esattamente nelle fessure delle armature.
FOLLETTO.PRECISIONE=Nonostante la frenesia, le sue dimensioni ridotte gli permettono una percezione dello spazio ravvicinato molto acuta.
FOLLETTO.VELOCITA=Il Re della Velocità. Una vera e propria scheggia magica, quasi impossibile da inquadrare visivamente quando si muove.
FOLLETTO.FURTIVITA=Minuscolo e dotato di magie elusive naturali. Può nascondersi facilmente dietro a un semplice filo d'erba o a un fungo.
FOLLETTO.PARATA=Troppo minuto. Qualsiasi tentativo di bloccare un'arma normale lo farebbe volare via a causa dell'energia cinetica.
FOLLETTO.RESISTENZA_MAGICA=Molto attento e curioso, anche se la sua natura iperattiva lo porta a distrarsi facilmente.
FOLLETTO.PERCEZIONE=Molto attento, curioso e sensibile alle alterazioni magiche, anche se la sua natura iperattiva lo porta a distrarsi facilmente.
FOLLETTO.SOGGEZIONE=Troppo buffo, minuscolo e irritante. Nessuno si sente intimidito dalla sua sola presenza scenica.
FOLLETTO.FURIA=Dispettoso e capriccioso; la sua natura lo spinge a fuggire o a scherzare anziché sacrificarsi eroicamente per il gruppo.
FOLLETTO.CORAGGIO=Estremamente volubile, capriccioso e pauroso. Se affrontato da nemici imponenti, preferisce scappare, scherzare o nascondersi.
FOLLETTO.VALORE=Dispettoso e capriccioso; la sua natura scherzosa lo spinge a fuggire o a nascondersi anziché sacrificarsi per il gruppo.
FOLLETTO.NUMERO_BERSAGLI=Troppo piccolo. I suoi attacchi con micro-armi sono chirurgici ma strettamente limitati a un nemico alla volta.
FOLLETTO.STANCHEZZA=Iperattivo e frenetico; brucia le sue riserve di energia rapidamente, necessitando di riposo.
FOLLETTO.DANNI_MAGICI=Piccolo ma intessuto di pura magia selvaggia (Fey); le sue magie sono imprevedibili ma sanno essere dolorosamente intense.
FOLLETTO.DANNI_FISICI=Troppo minuto. Anche imprimendo tutta la sua forza, la sua massa ridotta non genera danni fisici rilevanti.
FOLLETTO.RIGENERAZIONE_SALUTE=Troppo iperattivo e frenetico; fatica a rilassarsi e a calmare il battito cardiaco durante i turni di pausa.
FOLLETTO.RIGENERAZIONE_MAGIA=Creatura fatata intessuta di magia selvaggia (Fey); si ricarica rapidamente attingendo alla natura circostante.

GARGOYLE.CARICO_MASSIMO=Essendo fatto di pietra animata, la sua struttura sopporta pesi elevati, ma le ali ne limitano la capacità estrema se vuole planare.
GARGOYLE.CRITICO=Corpo di pietra rigido. I suoi attacchi sono pesanti e prevedibili, facili da intercettare prima che tocchino un punto vitale.
GARGOYLE.PRECISIONE=Le articolazioni di pietra rigida riducono la fluidità e la coordinazione millimetrica nei colpi.
GARGOYLE.VELOCITA=Fatto di pietra animata. Le sue articolazioni rigide lo rendono lento e pesante nei turni d'azione.
GARGOYLE.FURTIVITA=Fatto di pietra. Quando è immobile sembra una statua (mimetismo perfetto), ma quando si muove il rumore della roccia lo tradisce subito.
GARGOYLE.PARATA=Solidità di pietra. Può incrociare le ali di roccia davanti a sé, agendo come un vero e propria barriera statica.
GARGOYLE.RESISTENZA_MAGICA=Quando è in forma di statua i suoi sensi sono limitati; la pietra ne attenua la ricezione dei suoni sottili.
GARGOYLE.PERCEZIONE=Quando è immobile in forma di statua i suoi sensi sono limitati; la roccia ne attenua la ricezione dei suoni più sottili.
GARGOYLE.SOGGEZIONE=Un mostro di pietra grottesco arroccato nell'ombra genera una forte ansia psicologica in chi si avvicina.
GARGOYLE.FURIA=Sentinella protettiva nata; il suo intero scopo biologico e magico è fare da scudo e difendere il luogo o le persone assegnate.
GARGOYLE.CORAGGIO=Sentinella di pietra incrollabile. Esegue il suo compito di guardia eterna senza provare emozioni limitanti come il terrore.
GARGOYLE.VALORE=Sentinella protettiva nata; il suo intero scopo magico e biologico è fare da scudo e difendere il luogo o le persone assegnate.
GARGOYLE.NUMERO_BERSAGLI=Ottimo nel controllo della folla ravvicinata grazie alle ampie ali di pietra utilizzabili come fruste.
GARGOYLE.STANCHEZZA=Fatto di pietra animata da rune. Non si stanca in senso biologico, ma il legame magico si usura lentamente.
GARGOYLE.DANNI_MAGICI=Creatura di pietra animata da costrutti; la sua natura rigida blocca lo scorrere fluido e distruttivo dell'energia magica.
GARGOYLE.DANNI_FISICI=Essendo fatto di pietra animata, i suoi pugni e le sue cariche hanno la durezza e il peso d'impatto di un masso.
GARGOYLE.RIGENERAZIONE_SALUTE=Struttura di pietra. Quando torna immobile nella sua posa statuaria, canalizza le rune terrestri per riparare la sua massa.
GARGOYLE.RIGENERAZIONE_MAGIA=Linea di Base. Quando è immobile in forma di statua, le sue rune si allineano e assorbono energia a ritmi normali.

GIGANTE.CARICO_MASSIMO=Supera facilmente i 4-5 metri d'altezza. Le sue armi base pesano quanto un intero soldato umano.
GIGANTE.CRITICO=Le sue armi sono talmente enormi che colpiscono intere porzioni del corpo. Non ha bisogno di fare "centro" per fare male.
GIGANTE.PRECISIONE=Sgraziato e lento. La sua scommessa è colpire un'area così vasta da rendere superflua la mira millimetrica.
GIGANTE.VELOCITA=Spostare arti lunghi diversi metri richiede tempo. I suoi attacchi sono lenti e ampi, facili da prevedere.
GIGANTE.FURTIVITA=Alto come una torre, ogni suo movimento spezza alberi o sposta detriti. La furtività per lui non è contemplata.
GIGANTE.PARATA=Un suo avambraccio è grande quanto lo scudo a torre di un guerriero. Para i colpi per pura opposizione di massa.
GIGANTE.RESISTENZA_MAGICA=La sua mole imponente lo allontana dai dettagli del terreno; fatica a notare creature minuscole ai suoi piedi.
GIGANTE.PERCEZIONE=La sua mole imponente lo allontana dai dettagli del terreno; fatica a notare creature minuscole o trappole ai suoi piedi.
GIGANTE.SOGGEZIONE=Una montagna di muscoli alta 5 metri che ti sovrasta applica un debuff automatico alla tua autostima.
GIGANTE.FURIA=Sebbene rozzo, possiede una dignità tribale stagna e protegge accanitamente i membri del suo clan.
GIGANTE.CORAGGIO=La sua stessa mole imponente e la consapevolezza della sua forza lo fanno sentire al sicuro dalla maggior parte delle minacce.
GIGANTE.VALORE=Sebbene rozzo, possiede una dignità tribale molto solida e difende accanitamente i membri del suo clan.
GIGANTE.CONTRATTAZIONE=Troppo grosso per le botteghe e troppo semplice per le trattative.
GIGANTE.NUMERO_BERSAGLI=Una clava lunga 3 metri brandita da lui attraversa il campo orizzontalmente, travolgendo qualunque soldato si trovi sulla traiettoria.
GIGANTE.STANCHEZZA=Spostare una massa corporea di svariate tonnellate genera un accumulo di fatica molto rapido.
GIGANTE.DANNI_MAGICI=Troppo legato alla materia e alla massa fisica; la sua mente fatica a canalizzare incantesimi che vadano oltre piccoli impulsi.
GIGANTE.DANNI_FISICI=Alto 5 metri; brandisce armi mastodontiche capaci di abbattere alberi. Forza d'urto spaventosa.
GIGANTE.RIGENERAZIONE_SALUTE=Muscoli colossali che, sebbene richiedano molta energia, beneficiano di riserve biologiche enormi.
GIGANTE.RIGENERAZIONE_MAGIA=Troppo legato alla materia e alla massa fisica pesante; la sua mente è pigra nel richiamare le forze invisibili dell'arcano.

GOBLIN.CARICO_MASSIMO=Più piccolo di un umano e storicamente costretto ad arrangiarsi con equipaggiamento leggero e di fortuna.
GOBLIN.CRITICO=Combatte in modo estremamente sporco. Mira costantemente a tendini, talloni e parti basse per invalidare i nemici.
GOBLIN.PRECISIONE=Precisione nella media; sopperisce alla mancanza di disciplina con l'opportunismo e colpi a bruciapelo.
GOBLIN.VELOCITA=Piccolo e iperattivo. Compensa la debolezza fisica con scatti nevrotici e ritirate strategiche fulminee.
GOBLIN.FURTIVITA=Maestro dell'infamia. Piccolo, scattante e abituato a strisciare nei cunicoli o nel fango per tendere imboscate.
GOBLIN.PARATA=Braccia corte e armi di fortuna. Preferisce evitare i blocchi diretti per non farsi spezzare le armi.
GOBLIN.RESISTENZA_MAGICA=Sensi ferini molto sviluppati, specialmente l'olfatto e la vista notturna, utili per sopravvivere nelle caverne.
GOBLIN.PERCEZIONE=Sensi ferini molto sviluppati, specialmente l'olfatto e la vista notturna, vitali per sopravvivere e tendere agguati nelle caverne.
GOBLIN.SOGGEZIONE=Creatura storicamente codarda e minuta. Fa ridere o innervosire, non incute soggezione.
GOBLIN.FURIA=L'antitesi del Valore. Vigliacco e traditore per natura; se un compagno è in difficoltà, lo usa come scudo per salvarsi.
GOBLIN.CORAGGIO=Il Re della Codardia. Combatte solo se in netta superiorità numerica o dall'ombra. Se il leader cade, fugge all'istante.
GOBLIN.VALORE=L'antitesi del Valore. Vigliacco e traditore; se un compagno è in difficoltà, non esita a usarlo come scudo per salvarsi.
GOBLIN.CONTRATTAZIONE=Avido e insistente fino allo sfinimento: tira sul prezzo di qualunque cosa, anche quando non vuole comprarla.
GOBLIN.NUMERO_BERSAGLI=Armi corte e fisicità ridotta. Tende a concentrarsi in gruppo contro un solo bersaglio piuttosto che fare il contrario.
GOBLIN.STANCHEZZA=Fisiologia debole e movimenti nevrotici che lo portano a esaurire il fiato velocemente se lo scontro si allunga.
GOBLIN.DANNI_MAGICI=La sua magia è grezza, instabile e spesso basata su trucchi dozzinali; i suoi incantesimi puri non hanno grande impatto.
GOBLIN.DANNI_FISICI=Piccolo e debole rispetto a un umano. Deve compensare la mancanza di danno fisico con imboscate o veleni.
GOBLIN.RIGENERAZIONE_SALUTE=Fisiologia debole e metabolismo accelerato dalla paranoia; il suo riposo fisico è meno efficiente della media.
GOBLIN.RIGENERAZIONE_MAGIA=Mente costantemente paranoica e superstiziosa, che fatica a trovare la calma necessaria per un riposo magico ottimale.

HOBGOBLIN.CARICO_MASSIMO=Variante più robusta, militare e massiccia del goblin comune.
HOBGOBLIN.CRITICO=Più disciplinato e addestrato militarmente del goblin comune, sa riconoscere le debolezze strutturali delle formazioni.
HOBGOBLIN.PRECISIONE=Superiore al guerriero comune per via di un addestramento militare rigido e una coordinazione di falange spietata.
HOBGOBLIN.VELOCITA=Più pesante, corazzato e metodico del goblin comune; preferisce la stabilità della linea alla velocità.
HOBGOBLIN.FURTIVITA=Più massiccio del goblin e solitamente equipaggiato con armature marziali che tintennano, riducendo l'elusività.
HOBGOBLIN.PARATA=Addestramento militare d'élite e uso costante di scudi pesanti in formazione di falange.
HOBGOBLIN.RESISTENZA_MAGICA=Disciplinato e paranoico; addestrato a scansionare costantemente i perimetri per evitare imboscate alle truppe.
HOBGOBLIN.PERCEZIONE=Disciplinato e paranoico; addestrato militarmente a scansionare costantemente i perimetri per evitare imboscate alle truppe.
HOBGOBLIN.SOGGEZIONE=A differenza del goblin, ha un portamento marziale, fiero e spietato che incute timore sul campo.
HOBGOBLIN.FURIA=Possiede un rigido codice d'onore militare e un senso del dovere verso la legione che lo spinge a proteggere la falange.
HOBGOBLIN.CORAGGIO=Militarmente disciplinato come il guerriero umano; il senso del dovere e della falange annulla completamente la viltà goblin.
HOBGOBLIN.VALORE=Possiede un rigido codice d'onore militare e un senso del dovere verso la legione che lo spinge a proteggere la falange.
HOBGOBLIN.CONTRATTAZIONE=Pratico dei bottini di guerra e delle loro spartizioni, sa quanto vale ciò che ha in mano.
HOBGOBLIN.NUMERO_BERSAGLI=Addestrato alla falange; sa coordinare i colpi per coprire lo spazio davanti alla sua postazione.
HOBGOBLIN.STANCHEZZA=Disciplinato e resistente quanto un guerriero umano grazie all'addestramento militare.
HOBGOBLIN.DANNI_MAGICI=Leggermente meglio del goblin per via della disciplina militare, ma preferisce di gran lunga la tattica di falange alla magia.
HOBGOBLIN.DANNI_FISICI=Più grosso e muscoloso del goblin comune, addestrato militarmente a colpire con precisione e forza marziale.
HOBGOBLIN.RIGENERAZIONE_SALUTE=Disciplina militare rigida applicata alla respirazione e alla gestione dello sforzo fisico in battaglia.
HOBGOBLIN.RIGENERAZIONE_MAGIA=Leggermente più disciplinato del goblin, ma preferisce di gran lunga la logica di falange alla comprensione magica.

MINOTAURO.CARICO_MASSIMO=Un bipede taurino massiccio, alto più di due metri e mezzo, con una densità muscolare spaventosa.
MINOTAURO.CRITICO=Carica a testa bassa spinto dalla bramosia di sangue. Schiaccia l'avversario con la forza bruta anziché con la precisione.
MINOTAURO.PRECISIONE=La bramosia di sangue e la furia lo portano ad attaccare alla cieca, spalancando la guardia e mancando spesso i bersagli agili.
MINOTAURO.VELOCITA=Sebbene sia un predatore, la sua stazza imponente e lo stile basato sulla forza bruta lo rendono lento nei turni.
MINOTAURO.FURTIVITA=Il respiro pesante, gli zoccoli e la mole taurina lo rendono un predatore da carica frontale, non da imboscata silenziosa.
MINOTAURO.PARATA=Usa le sue massicce corna o i grandi sguardi d'ascia per intercettare i colpi, opponendo una resistenza brutale.
MINOTAURO.RESISTENZA_MAGICA=La bramosia di sangue e il labirinto ne limitano la visione strategica; si affida quasi solo all'olfatto.
MINOTAURO.PERCEZIONE=La bramosia di sangue e la vita nel labirinto ne limitano la visione strategica; si affida quasi esclusivamente all'olfatto.
MINOTAURO.SOGGEZIONE=Il classico mostro brutale del labirinto. Il suo ruggito taurino e la stazza spezzano la concentrazione nemica.
MINOTAURO.FURIA=Accecato dalla bramosia di sangue; in battaglia vede solo bersagli da distruggere, ignorando lo stato dei suoi alleati.
MINOTAURO.CORAGGIO=Più che coraggioso è ostinato e accecato dalla bramosia di sangue, il che lo spinge ad avanzare ignorando i rischi per la vita.
MINOTAURO.VALORE=Accecato dalla bramosia di sangue; in battaglia vede solo bersagli da distruggere, ignorando lo stato dei suoi alleati.
MINOTAURO.CONTRATTAZIONE=Bestia del labirinto: non conosce il valore del denaro.
MINOTAURO.NUMERO_BERSAGLI=Brandisce enormi asce bipenni con spazzate selvagge e brutali che colpiscono tutto ciò che lo circonda.
MINOTAURO.STANCHEZZA=La foga selvaggia e incontrollata lo porta a dare il massimo all'inizio, ma a corto di fiato se lo scontro dura.
MINOTAURO.DANNI_MAGICI=La sua mente è costantemente offuscata dalla rabbia bestiale; è biologicamente incapace di concentrarsi per fare danni magici.
MINOTAURO.DANNI_FISICI=Bipede taurino massiccio dotato di una densità muscolare spaventosa. Ogni colpo d'ascia è brutale.
MINOTAURO.RIGENERAZIONE_SALUTE=Fisionomia taurina robusta ed eccellente stabilità biologica per il ripristino delle forze muscolari.
MINOTAURO.RIGENERAZIONE_MAGIA=Mente offuscata dalla bramosia di sangue e dall'istinto bestiale del labirinto; incapace di canalizzare energia mentale.

OMBRA_NERA.CARICO_MASSIMO=Trattandosi di uno spettro, non ha un inventario fisico per gli oggetti del mondo materiale.
OMBRA_NERA.CRITICO=Non-morto irascibile ma letale; si materializza alle spalle della vittima colpendo direttamente l'essenza vitale con precisione maligna.
OMBRA_NERA.PRECISIONE=Si muove guidata da un istinto predatore soprannaturale; aggancia il bersaglio nell'oscurità e lo colpisce senza esitazione.
OMBRA_NERA.VELOCITA=Si propaga e si sposta tra le ombre alla velocità del pensiero, cogliendo le vittime di sorpresa.
OMBRA_NERA.FURTIVITA=L'eccellenza spettrale. Essendo letteralmente un'ombra senziente, si fonde al 100% con l'oscurità ambientale, eguagliando il Ladro.
OMBRA_NERA.PARATA=Pur essendo aggressiva, la sua natura semiliquida e spettrale rende i blocchi fisici inefficienti.
OMBRA_NERA.RESISTENZA_MAGICA=Vede perfettamente nel buio assoluto e percepisce il battito cardiaco e la paura delle sue prede.
OMBRA_NERA.PERCEZIONE=Vede perfettamente nel buio assoluto e percepisce l'energia vitale, il calore e la paura delle sue prede.
OMBRA_NERA.SOGGEZIONE=Una sagoma d'oscurità pura, irascibile e maligna, che sembra inghiottire la luce circostante.
OMBRA_NERA.FURIA=Non-morto irascibile guidato da un rancore maligno e puro egoismo distruttivo.
OMBRA_NERA.CORAGGIO=Il suo temperamento irascibile, maligno e vendicativo si traduce in una determinazione feroce a distruggere il bersaglio senza esitazioni.
OMBRA_NERA.VALORE=Non-morto irascibile guidato da un rancore maligno e da un puro egoismo distruttivo.
OMBRA_NERA.NUMERO_BERSAGLI=Può allungare i suoi lembi d'ombra per graffiare o ghermire più nemici vicini nella sua foga irascibile.
OMBRA_NERA.STANCHEZZA=Immune. Composta di oscurità e rancore non-morto; esente da affaticamento fisico.
OMBRA_NERA.DANNI_MAGICI=Composta di pura energia del Vuoto e delle Ombre; i suoi incantesimi oscuri corrodono i bersagli con spietata efficacia.
OMBRA_NERA.DANNI_FISICI=Sebbene sia un non-morto spettrale, la sua foga irascibile le permette di condensare la propria forma per graffiare con violenza.
OMBRA_NERA.RIGENERAZIONE_SALUTE=Non-Morto. Composta di oscurità e rancore immateriale; esente da affaticamento o riposo corporeo.
OMBRA_NERA.RIGENERAZIONE_MAGIA=Non-morto irascibile composto di pura oscurità; assorbe e rigenera l'energia del Vuoto con spietata efficacia nell'ombra.

SCHELETRO.CARICO_MASSIMO=Può sembrare strano (non ha muscoli), ma non avendo organi interni, pelle o grasso, la sua intera struttura ossea è "carico utile vuoto". Inoltre, essendo un non-morto, non risente del dolore da sforzo (può caricarsi finché le ossa non si spezzano fisicamente).
SCHELETRO.CRITICO=Non ha muscoli o emozioni che tremano: sferra colpi geometricamente perfetti e freddi, senza esitazione.
SCHELETRO.PRECISIONE=Precisione matematica e fissa. Non ha muscoli che si affaticano, ma manca dell'intuito per anticipare le finte nemiche.
SCHELETRO.VELOCITA=Movimenti scattanti e privi del peso di organi o grasso, ma rigidamente legati all'assenza di intuito o adrenalina.
SCHELETRO.FURTIVITA=Non respira e non ha battito cardiaco, ma lo sfregamento delle ossa e lo sferragliare delle giunture consumate producono un leggero rumore.
SCHELETRO.PARATA=Se equipaggiato come soldato, esegue le parate in modo rigido, preciso e privo della paura di rompersi un osso.
SCHELETRO.RESISTENZA_MAGICA=Privo di occhi e orecchie fisiche; è mosso solo da un flebile istinto magico che lo rende facilissimo da aggirare.
SCHELETRO.PERCEZIONE=Privo di occhi e orecchie fisiche; è mosso solo da un flebile istinto magico che lo rende facilissimo da aggirare e ingannare.
SCHELETRO.SOGGEZIONE=Sebbene sia un non-morto, è troppo comune e fragile per incutere un vero blocco psicologico nei veterani.
SCHELETRO.FURIA=Privo di Scelta. Un automa senza mente, morale o anima. Non può scegliere il valore o il sacrificio; esegue solo ordini.
SCHELETRO.CORAGGIO=Immunità Emotiva. Un automa privo di cervello, ormoni o paura. Avanza verso il pericolo eseguendo gli ordini fino alla distruzione.
SCHELETRO.VALORE=Privo di Scelta. Un automa senza mente o anima. Non può scegliere il valore o il sacrificio; esegue solo ordini meccanici.
SCHELETRO.NUMERO_BERSAGLI=Esegue attacchi rigidi e lineari; manca dell'elasticità mentale per alternare i colpi su bersagli multipli fluidamente.
SCHELETRO.STANCHEZZA=Immune. Pura struttura ossea mossa da un impulso magico base. Non accumula fatica.
SCHELETRO.DANNI_MAGICI=Privo di cervello, anima o intelletto; può lanciare magie solo se animato temporaneamente da un padrone, ma con danni minimi.
SCHELETRO.DANNI_FISICI=Privo di muscoli, si muove solo per impulsi magici; sferra colpi discreti ma privi del peso della massa muscolare viva.
SCHELETRO.RIGENERAZIONE_SALUTE=Non-Morto. Pura struttura ossea animata da un impulso magico base. Non possiede muscoli da far riposare.
SCHELETRO.RIGENERAZIONE_MAGIA=Un ammasso di ossa mosso da magia di basso livello. Non ha un'anima o un intelletto per rigenerare autonomamente grandi quantità di mana.

SPETTRO.CARICO_MASSIMO=Trattandosi di uno spettro, non ha un inventario fisico per gli oggetti del mondo materiale.
SPETTRO.CRITICO=Creature eteree che fluttuano. La loro parziale intangibilità rende difficile sferrare un colpo fisico concentrato sui punti vitali corporei.
SPETTRO.PRECISIONE=Come il fantasma, soffre della transizione tra il piano etereo e quello fisico durante l'affondo.
SPETTRO.VELOCITA=Più aggressivo del fantasma comune; scivola sul campo di battaglia con una rapidità spaventosa.
SPETTRO.FURTIVITA=Variante aggressiva del fantasma; si muove come un soffio di vento gelido tra le ombre, quasi impossibile da percepire.
SPETTRO.PARATA=Come il fantasma, la sua natura eterea predilige l'elusione rispetto al blocco della materia solida.
SPETTRO.RESISTENZA_MAGICA=Più vigile del fantasma comune; caccia attivamente i vivi seguendo il calore della loro energia vitale.
SPETTRO.PERCEZIONE=Più vigile del fantasma comune; caccia attivamente i vivi seguendo la scia calorica e spirituale della loro essenza vitale.
SPETTRO.SOGGEZIONE=Una manifestazione d'ira e rancore spettrale che gela il sangue nelle vene di chi la guarda.
SPETTRO.FURIA=Una manifestazione di puro odio ultraterreno focalizzata solo sul tormentare i vivi.
SPETTRO.CORAGGIO=Mosso da un rancore eterno, freddo e implacabile che annulla qualsiasi forma di esitazione o timore biologico.
SPETTRO.VALORE=Una manifestazione di puro odio ultraterreno focalizzata solo sul tormentare e consumare i vivi.
SPETTRO.NUMERO_BERSAGLI=Il suo passaggio lascia una scia gelida che può infliggere danni a chiunque si trovi sul suo percorso.
SPETTRO.STANCHEZZA=Immune. Entità ultraterrene prive di un corpo biologico da affaticare.
SPETTRO.DANNI_MAGICI=Variante aggressiva del fantasma; canalizza il suo eterno rancore in incantesimi necrotici e mentali estremamente dolorosi.
SPETTRO.DANNI_FISICI=Leggermente più aggressivo del fantasma, ma comunque limitato dalla sua natura eterea nel generare danni da impatto solidi.
SPETTRO.RIGENERAZIONE_SALUTE=Incorporeo. Manifestazione di odio ultraterreno priva di parametri fisici o biologici.
SPETTRO.RIGENERAZIONE_MAGIA=Variante aggressiva del fantasma; canalizza il suo eterno e gelido rancore per strappare energia dall'ambiente circostante.

SPIRITO.CARICO_MASSIMO=Trattandosi di uno spettro, non ha un inventario fisico per gli oggetti del mondo materiale.
SPIRITO.CRITICO=Creature eteree che fluttuano. La loro parziale intangibilità rende difficile sferrare un colpo fisico concentrato sui punti vitali corporei.
SPIRITO.PRECISIONE=Creatura astratta, più incline a fluttuare e confondere che a colpire con accuratezza millimetrica.
SPIRITO.VELOCITA=Fluttua costantemente cambiandosi di posto in modo etereo ed elusivo.
SPIRITO.FURTIVITA=Fluttua in modo silenzioso, ma la sua natura energetica può emettere un leggero bagliore mistico che ne tradisce la posizione.
SPIRITO.PARATA=Fluttua e si dissolve parzialmente all'impatto; non ha una struttura idonea a generare una parata solida.
SPIRITO.RESISTENZA_MAGICA=Sente le vibrazioni emotive e spirituali dell'area circostante in modo estremamente acuto.
SPIRITO.PERCEZIONE=Sente le vibrazioni emotive e le perturbazioni spirituali dell'area circostante in modo estremamente acuto.
SPIRITO.SOGGEZIONE=Più misterioso ed elusivo che terrificante; evoca cautela o curiosità mistica.
SPIRITO.FURIA=Entità astratta che può agire da custode o protettore a seconda della sua natura originaria.
SPIRITO.CORAGGIO=Entità astratta e refrattaria ai condizionamenti psicologici e biologici standard legati alla sopravvivenza dei vivi.
SPIRITO.VALORE=Entità astratta che può agire da custode o protettore a seconda della sua natura originaria o del patto stipulato; si posiziona appena sotto la media umana perché la sua ascesi lo rende leggermente distaccato dalle necessità puramente fisiche del party.
SPIRITO.NUMERO_BERSAGLI=Può manifestare impulsi energetici che si irradiano in cerchio attorno alla sua forma fluttuante.
SPIRITO.STANCHEZZA=Immune. Entità ultraterrene prive di un corpo biologico da affaticare.
SPIRITO.DANNI_MAGICI=Manifestazione energetica pura. Essendo composto di essenza mistica, i suoi attacchi energetici feriscono direttamente l'anima dei nemici.
SPIRITO.DANNI_FISICI=Manifestazione energetica pura. Non ha un corpo per colpire fisicamente; il suo moltiplicatore è quasi nullo.
SPIRITO.RIGENERAZIONE_SALUTE=Incorporeo. Essenza energetica pura priva di un corpo di carne e ossa soggetto a fatica muscolare.
SPIRITO.RIGENERAZIONE_MAGIA=Manifestazione energetica pura. Essendo privo di un corpo di carne, il suo riposo coincide interamente con il riallineamento energetico.

TITANO.CARICO_MASSIMO=Forze semidivine o creature mitologiche capaci di spostare l'ambiente circostante. Per lui sollevare un masso o un'armatura pesante è indifferente.
TITANO.CRITICO=Forze primordiali della natura. Un loro attacco è come un terremoto o una frana; il concetto stesso di "colpo critico millimetrico" per loro non esiste.
TITANO.PRECISIONE=I suoi attacchi muovono le montagne. Non mira al singolo soldato, mira al codice postale in cui si trova il soldato.
TITANO.VELOCITA=Muoversi alla velocità di una montagna significa agire per ultimo. Ogni sua azione richiede un'intera fase del turno.
TITANO.FURTIVITA=Impossibile. Una forza divina colossale che altera la gravità e l'ambiente circostante solo camminando. Il suo moltiplicatore azzera la statistica.
TITANO.PARATA=Il Blocco Assoluto. Può fermare una catapulta o un fendente leggendario semplicemente interponendo il palmo della mano.
TITANO.RESISTENZA_MAGICA=Vede il mondo su scala macroscopica; nota i grandi movimenti tellurici ma ignora i piccoli dettagli individuali.
TITANO.PERCEZIONE=Vede il mondo su scala macroscopica; nota i grandi movimenti tellurici e le armate, ma ignora i piccoli dettagli individuali.
TITANO.SOGGEZIONE=Presenza Divina. Una forza primordiale del mito. Davanti a lui i mortali cadono in ginocchio per l'insignificanza.
TITANO.FURIA=Figura mitologica monumentale. Custode dell'ordine primordiale, affronta minacce colossali con dignità epica.
TITANO.CORAGGIO=L'Incrollabile. Una forza mitologica primordiale. Il concetto stesso di paura, panico o esitazione gli è totalmente estraneo.
TITANO.VALORE=Figura mitologica monumentale. Custode dell'ordine primordiale, affronta minacce colossali con dignità epica.
TITANO.CONTRATTAZIONE=Non si abbassa a discutere di monete: prende o lascia.
TITANO.NUMERO_BERSAGLI=Il Cataclisma. Un suo pugno o calpestamento modifica la topografia del terreno. Non colpisce individui, colpisce reggimenti.
TITANO.STANCHEZZA=Forza monumentale. Le attività dei mortali richiedono così poca percentuale del suo potere da non stancarlo quasi.
TITANO.DANNI_MAGICI=Forza mitologica semidivina. Quando usa la magia, evoca le forze della creazione (terremoti, tempeste divine) con potenza immane.
TITANO.DANNI_FISICI=Il Cataclisma Fisico. Forza semidivina. Un suo pugno ha la forza di un terremoto; ignora le difese fisiche dei mortali.
TITANO.RIGENERAZIONE_SALUTE=Forza mitologica semidivina. Un suo singolo respiro profondo purifica i tessuti e resetta la stanchezza corporea.
TITANO.RIGENERAZIONE_MAGIA=Creatura mitologica semidivina. Un suo singolo respiro ricalibra e purifica l'intera riserva magica del suo essere spirituale.

TROLL.CARICO_MASSIMO=Corpo da leone (quadrupede grande), con tre teste e code. Ha una base d'appoggio formidabile per caricare prede o fardelli sulla schiena.
TROLL.CRITICO=Combatte in preda a una foga rigenerativa selvaggia, agitando le braccia o clave nodose in modo caotico.
TROLL.PRECISIONE=Agita clave e artigli in preda a un'adrenalina caotica. Facile da schivare se il difensore è minimamente agile.
TROLL.VELOCITA=Sgraziato, gobbo e pesante. Si muove in modo goffo, bilanciando la lentezza con la pura resistenza biologica.
TROLL.FURTIVITA=Grosso, gobbo e sgraziato. Lascia tracce evidenti e si muove in modo pesante e rumoroso.
TROLL.PARATA=Para i colpi incassandoli deliberatamente sui grossi avambracci coriacei, sapendo che la sua rigenerazione curerà le ferite.
TROLL.RESISTENZA_MAGICA=Intelletto primitivo e sensi ottusi dal parassitismo o dalla scarsa igiene; compensa solo con un buon olfatto.
TROLL.PERCEZIONE=Intelletto primitivo e sensi ottusi dal parassitismo o dalla scarsa igiene; compensa solo con un buon olfatto da predatore.
TROLL.SOGGEZIONE=Grosso, deforme e spaventoso, ma la sua evidente stupidità attenua parzialmente la soggezione psicologica.
TROLL.FURIA=Intelletto primitivo e selvaggio; protegge i suoi simili solo se spinto da un basilare istinto di branco.
TROLL.CORAGGIO=Abbastanza ottuso da non comprendere appieno i pericoli complessi (come le maledizioni), ma teme visibilmente il fuoco.
TROLL.VALORE=Intelletto primitivo e selvaggio; protegge i suoi simili solo se spinto da un basilare istinto di branco.
TROLL.NUMERO_BERSAGLI=Le braccia lunghe e scimmiesche gli permettono ampie zampate capaci di colpire due o tre avversari vicini.
TROLL.STANCHEZZA=La rigenerazione mostruosa dei tessuti elimina l'acido lattico quasi all'istante, rendendolo instancabile.
TROLL.DANNI_MAGICI=Intelletto primitivo e rigenerazione fisica; la sua biologia è completamente disconnessa dallo studio o dall'intuito arcano.
TROLL.DANNI_FISICI=Braccia lunghissime e muscolatura massiccia. Colpisce con zampate selvagge e clave rudimentali di potenza devastante.
TROLL.RIGENERAZIONE_SALUTE=Condivide con l'Idra una rigenerazione cellulare spaventosa che elimina l'acido lattico dai muscoli in pochi secondi.
TROLL.RIGENERAZIONE_MAGIA=La sua biologia è completamente focalizzata al sulla rigenerazione della carne e dei muscoli; totalmente disconnesso dal mana.

VIVERNA.CARICO_MASSIMO=Un rettile alato predatore di taglia grande. Può ghermire e trasportare in volo intero bestiame.
VIVERNA.CRITICO=Predatore aereo efficiente. Il colpo di coda col pungiglione o la picchiata sono letali e mirati.
VIVERNA.PRECISIONE=Ottimo predatore aereo. Deve essere precisa quando scatta per afferrare una preda in corsa sul terreno.
VIVERNA.VELOCITA=Predatore aereo scattante. Sfrutta le correnti d'aria per piombare sui bersagli a velocità sostenuta.
VIVERNA.FURTIVITA=Sebbene sia un predatore, le sue dimensioni e il battito delle ali membranose la rendono percepibile prima dell'attacco.
VIVERNA.PARATA=Usa le giunture artigliate delle ali per deviare gli attacchi a terra, ma la sua struttura resta esposta.
VIVERNA.RESISTENZA_MAGICA=Predatore volante con una vista eccezionale, specializzata nell'agganciare bersagli in movimento dall'alto.
VIVERNA.PERCEZIONE=Predatore volante con una vista eccezionale, specializzata nell'agganciare e rincorrere bersagli in corsa sul terreno.
VIVERNA.SOGGEZIONE=Un grande rettile predatore che stride nei cieli evoca il terrore di essere ghermiti da un momento all'altro.
VIVERNA.FURIA=Bestia territoriale; difende ferocemente solo la sua prole o il suo nido, non i membri di un gruppo eterogeneo.
VIVERNA.CORAGGIO=Predatore fiero ma guidato dal puro istinto animale; se ferito gravemente, l'istinto di conservazione vince sul coraggio e vola via.
VIVERNA.VALORE=Bestia territoriale; difende ferocemente solo la sua prole o il suo nido, non i membri di un gruppo eterogeneo.
VIVERNA.NUMERO_BERSAGLI=Sfrutta il raggio d'azione del lungo pungiglione caudale e le ali per tenere a bada più avversari.
VIVERNA.STANCHEZZA=Predatore robusto, ma lo sforzo del volo e dei morsi si attesta sulla media di combattimento.
VIVERNA.DANNI_MAGICI=Bestia predatrice alata; si affida al veleno fisico del suo pungiglione piuttosto che a incantesimi sovrannaturali.
VIVERNA.DANNI_FISICI=Grande rettile predatore; possiede mascelle possenti e un pungiglione caudale in grado di perforare le corazze.
VIVERNA.RIGENERAZIONE_SALUTE=Grande rettile predatore; una volta a terra, riposa e si ossigena con la stabilità di un animale robusto.
VIVERNA.RIGENERAZIONE_MAGIA=Bestia predatrice alata; si affida al veleno del suo pungiglione biologico piuttosto che a riserve di energia magica.

IDRA.CARICO_MASSIMO=Scarica tutta la sua potenza muscolare rettiliana sul terreno, muovendosi come un cingolato biologico capace di trascinare pesi spaventosi.
IDRA.CRITICO=Le molteplici teste mordono in modo caotico e frenetico per sbranare la preda, senza una vera strategia chirurgica.
IDRA.PRECISIONE=Le teste si ostacolano a vicenda nella foga di mordere lo stesso bersaglio, riducendo l'accuratezza del singolo colpo.
IDRA.VELOCITA=Corpo massiccio e baricentro basso. Si muove lentamente e le teste spesso competono sui riflessi d'attacco.
IDRA.FURTIVITA=Un enorme rettile a più teste che striscia sul terreno smuovendo terra e rocce, oltre a emettere costanti sibili da più bocche.
IDRA.PARATA=Può sacrificare o usare una delle sue molteplici teste per intercettare o deviare un colpo diretto al corpo.
IDRA.RESISTENZA_MAGICA=Come la chimera, le sue numerose teste coprono ogni angolo visivo. Se una testa dorme, le altre vigilano.
IDRA.PERCEZIONE=Come la chimera, le sue numerose teste coprono ogni angolo visivo. Se una testa dorme, le altre vigilano sul territorio.
IDRA.SOGGEZIONE=Vedere cinque o più teste giganti pronte a sbranarti genera un terrore biologico immediato.
IDRA.FURIA=Creatura primordiale mossa da un appetito caotico; non concepisce il concetto di alleanza o sacrificio.
IDRA.CORAGGIO=La sua natura primordiale e la mostruosa capacità rigenerativa la rendono estremamente ostinata: continua ad avanzare e a combattere finché ha almeno una testa attiva, ignorando gran parte dei debuff mentali da paura.
IDRA.VALORE=Creatura primordiale mossa esclusivamente da un appetito caotico e selvaggio; non concepisce minimamente il concetto di alleanza, branco o sacrificio per gli altri.
IDRA.NUMERO_BERSAGLI=Il Massimo Potenziale Fisico. Con cinque o più teste indipendenti che scattano, è una macchina da multi-target naturale.
IDRA.STANCHEZZA=La rigenerazione cellulare continua aiuta a combattere i micro-traumi muscolari, riducendo la fatica.
IDRA.DANNI_MAGICI=Abominio antico con un'ottima resistenza, ma i suoi attacchi magici si limitano a sputi acidi o velenosi di natura biologica.
IDRA.DANNI_FISICI=La spinta coordinata di molteplici colli serpentini che mordono contemporaneamente lacera facilmente le carni dei nemici.
IDRA.RIGENERAZIONE_SALUTE=Il vertice della rigenerazione. La sua biologia mostruosa azzera i micro-traumi del tessuto muscolare quasi istantaneamente.
IDRA.RIGENERAZIONE_MAGIA=Abominio antico e rettiliano; le sue riserve mistiche sono ridotte rispetto alla sua strabiliante possanza fisica.

LICH.CARICO_MASSIMO=Il suo corpo è mosso da pura energia magica e non soffre la fatica biologica o i dolori muscolari legati al trasporto di fardelli pesanti. Non arriva a 1.1 come lo Scheletro comune poiché la sua figura è votata esclusivamente all'intelletto e all'arcano, non alla manovalanza.
LICH.CRITICO=Superiore al mago comune perché padroneggia la magia mortale (Necromanzia), incanalando anatemi che mirano all'anima.
LICH.PRECISIONE=La sua mente immortale calcola le traiettorie con freddezza geometrica e ignora qualsiasi distrazione fisica o emotiva.
LICH.VELOCITA=Non ha fretta fisica. Si muove con flemma cerimoniale, affidandosi alla magia per compensare la lentezza del corpo.
LICH.FURTIVITA=Emana un'aura gelida di morte e i suoi paramenti cerimoniali lo rendono visibile; si affida alle illusioni più che al nascondersi fisicamente.
LICH.PARATA=Non usa scudi o armi fisiche; preferisce che siano le barriere magiche o il suo Mana Shield ad assorbire i danni.
LICH.RESISTENZA_MAGICA=La sua vista è guidata da una percezione magica e spirituale che ignora le illusioni visive dei mortali.
LICH.PERCEZIONE=La sua vista è guidata da una percezione magica e spirituale che ignora completamente le illusioni visive dei mortali.
LICH.SOGGEZIONE=Maestosità della Morte. Un sovrano non-morto immortale che emana un'aura gelida di sottomissione assoluta.
LICH.FURIA=Ha sacrificato ogni briciolo di umanità, etica ed empatia per ottenere l'immortalità; cinico e spietato al massimo grado.
LICH.CORAGGIO=Volontà Immortale. Ha sconfitto la morte stessa tramite la necromanzia; la sua mente fredda è una fortezza inespugnabile.
LICH.VALORE=Ha sacrificato ogni briciolo di umanità ed empatia per ottenere l'immortalità; cinico e spietato al massimo grado.
LICH.NUMERO_BERSAGLI=Unisce un'Intelligenza immensa a magie ad area necrotiche capaci di ghermire le anime di interi plotoni.
LICH.STANCHEZZA=Immune. Sovrano non-morto mosso da pura necromanzia; ignora totalmente la stanchezza.
LICH.DANNI_MAGICI=L'eccellenza non-morta. Ha sacrificato la sua vita mortale per padroneggiare la necromanzia e l'arcano; i suoi incantesimi di morte sono letali.
LICH.DANNI_FISICI=Corpo mummificato o scheletrico privo di muscoli vivi. Rigetta il combattimento fisico a favore di quello magico.
LICH.RIGENERAZIONE_SALUTE=Non-Morto. Mosso da pura necromanzia e privo di organi o muscoli vivi. La fatica fisica per lui non esiste.
LICH.RIGENERAZIONE_MAGIA=Il Re del Mana. Ha sconfitto la morte stessa. La sua mente immortale e non-morta è un portale aperto sul Vuoto e sul Necrotico.

MINOTAURO_GIGANTE.CARICO_MASSIMO=Un bipede taurino massiccio, alto più di quattro metri, con una densità muscolare spaventosa.
MINOTAURO_GIGANTE.CRITICO=Unisce la furia del Minotauro alla mole del gigante: i suoi attacchi sono cataclismi ad area, la precisione è zero.
MINOTAURO_GIGANTE.PRECISIONE=Unisce la cecità della rabbia taurina a una mole mastodontica: i suoi colpi sono lenti e facilmente prevedibili.
MINOTAURO_GIGANTE.VELOCITA=Un ammasso colossale di muscoli e corna. I suoi tempi di reazione sono minimi, agisce quasi sempre per ultimo.
MINOTAURO_GIGANTE.FURTIVITA=Un colosso infuriato. Impossibile da non notare, sia visivamente che acusticamente.
MINOTAURO_GIGANTE.PARATA=La sua mole colossale gli permette di bloccare gli attacchi nemici quasi senza accorgersene, grazie a muscoli duri come il ferro.
MINOTAURO_GIGANTE.RESISTENZA_MAGICA=Troppo colossale e costantemente infuriato per badare ai dettagli. Facile da ingannare con le finte.
MINOTAURO_GIGANTE.PERCEZIONE=Troppo colossale e costantemente infuriato per badare ai dettagli. È facilissimo da ingannare o aggirare con le finte.
MINOTAURO_GIGANTE.SOGGEZIONE=Unisce il terrore del minotauro alla mole del gigante. Una furia inarrestabile che costringe i nemici alla fuga.
MINOTAURO_GIGANTE.FURIA=Una furia devastante del tutto incapace di discernere il concetto di protezione o coordinazione difensiva.
MINOTAURO_GIGANTE.CORAGGIO=La furia selvaggia combinata alla mole colossale lo rendono del tutto noncurante e indifferente a ciò che gli si para davanti.
MINOTAURO_GIGANTE.VALORE=Una furia devastante del tutto incapace di discernere il concetto di protezione o coordinazione difensiva.
MINOTAURO_GIGANTE.NUMERO_BERSAGLI=Unisce le spazzate d'ascia del minotauro alla portata geometrica del gigante.
MINOTAURO_GIGANTE.STANCHEZZA=Unisce l'instabilità del minotauro alla mole del gigante. Si sfinisce rapidamente se non chiude il match.
MINOTAURO_GIGANTE.DANNI_MAGICI=Una massa colossale di pura foga fisica. Il suo moltiplicatore magico è infimo: la sua unica "magia" sono i suoi pugni.
MINOTAURO_GIGANTE.DANNI_FISICI=La Devastazione Fisica. Unisce la stazza del gigante alla ferocia muscolare del minotauro. Danno d'impatto ai vertici.
MINOTAURO_GIGANTE.RIGENERAZIONE_SALUTE=Abbina la robustezza del minotauro alla cubatura biologica del gigante, massimizzando il rientro energetico.
MINOTAURO_GIGANTE.RIGENERAZIONE_MAGIA=La foga distruttiva esasperata dalla mole colossale lo rende quasi del tutto impermeabile al recupero di energia mistica.

STREGA.CARICO_MASSIMO=Umano standard
STREGA.CRITICO=Focalizzati su incantesimi ad area (es. palle di fuoco) o manipolazioni. Non cercano il punto debole anatomico.
STREGA.PRECISIONE=Preferisce lanciare malocchi ad area o calderoni di debuff; la sua mira fisica diretta è trascurata.
STREGA.VELOCITA=Come il mago, le sue movenze sono legate ai tempi di canalizzazione dei sortilegi, non alla rapidità fisica.
STREGA.FURTIVITA=Abituata ad agire nell'ombra e a nascondersi dalle cacce alle streghe, possiede una buona propensione a non farsi notare.
STREGA.PARATA=Come il mago, manca di addestramento e forza fisica per i blocchi marziali.
STREGA.RESISTENZA_MAGICA=Maestra dei Sortilegi. Al pari del mago, manipola le maledizioni e i flussi occulti, possedendo una schermatura altissima.
STREGA.PERCEZIONE=Dotata di un forte intuito naturale e di un "terzo occhio" magico, eccelle nello scovare segreti, veleni e intenzioni nascoste.
STREGA.SOGGEZIONE=Emana una presenza maligna e inquietante, supportata da sguardi penetranti e sussurri occulti.
STREGA.FURIA=Opportunista e legata a patti oscuri; raramente rischia la propria pelle per proteggere un alleato in fin di vita.
STREGA.CORAGGIO=Abituata a trattare con forze oscure, patti occulti e spiriti, possiede una mente temprata contro i terrori mistici.
STREGA.VALORE=Opportunista e legata a patti oscuri; raramente rischia la propria pelle per proteggere un alleato in fin di vita.
STREGA.NUMERO_BERSAGLI=I Maestri dell'AoE. La loro intera dottrina si basa sul canalizzare incantesimi (es. Palle di fuoco o Catene di fulmini) su più nemici.
STREGA.STANCHEZZA=Tra i più fragile. Fisico sedentario non abituato agli sforzi; lo stress di canalizzare l'arcano li sfinisce subito.
STREGA.DANNI_MAGICI=Maestra dei Malocchi. Poco sotto il Mago solo perché predilige la magia debilitante (debuff e DoT), ma i suoi anatemi sono devastanti.
STREGA.DANNI_FISICI=Simile al mago; preferisce i malefici a distanza. La sua forza fisica diretta è minima.
STREGA.RIGENERAZIONE_SALUTE=Simile al mago; preferisce non sforzarsi fisicamente e il suo corpo risente della mancanza di condizionamento atletico.
STREGA.RIGENERAZIONE_MAGIA=Maestra dei Sortilegi. Al pari del mago, manipola i patti occulti e le correnti mistiche, possedendo una rigenerazione altissima.

DRAGO.CARICO_MASSIMO=Unisce i vantaggi di una struttura quadrupede immensa alla potenza innata della stirpe draconica.
DRAGO.CRITICO=Leggendario e millenario, compensa la mole imponente con un'intelligenza sopraffina che gli fa riconoscere i punti deboli dei nemici.
DRAGO.PRECISIONE=Creatura millenaria dotata di sensi divini e di un'intelligenza che gli permette di calcolare i flussi d'aria e i movimenti nemici.
DRAGO.VELOCITA=Nonostante la mole colossale, la sua natura magica e le ali imponenti gli permettono movimenti sorprendentemente rapidi.
DRAGO.FURTIVITA=Sebbene possa usare la magia per celarsi, le sue dimensioni naturali lo rendono una presenza impossibile da nascondere a occhio nudo.
DRAGO.PARATA=Le sue ali membranose corazzate e le zampe titaniche possono intercettare e deviare quasi ogni attacco convenzionale.
DRAGO.RESISTENZA_MAGICA=Il Sensorio Assoluto. Sensi millenari divini. Percepisce le vibrazioni del terreno, il calore corporeo e i flussi magici.
DRAGO.PERCEZIONE=Il Sensorio Assoluto. Sensi millenari divini. Percepisce le vibrazioni del terreno, il calore corporeo e i flussi magici invisibili.
DRAGO.SOGGEZIONE=Il Re del Terrore. Possiede la Presenza Terrificante innata. Il suo solo sguardo può paralizzare interi eserciti.
DRAGO.FURIA=Superbo e solitario, ma possiede un'immensa dignità e un orgoglio antico che gli impediscono di fuggire vigliaccamente.
DRAGO.CORAGGIO=Orgoglio Millenario. Consapevole della propria superiorità assoluta sul mondo. È praticamente immune alla paura dei mortali.
DRAGO.VALORE=Superbo e solitario, ma possiede un'immensa dignità e un orgoglio antico che gli impediscono di fuggire vigliaccamente.
DRAGO.NUMERO_BERSAGLI=Il Signore delle Spazzate. Oltre all'intelligenza nel gestire il campo, un singolo colpo di coda o artiglio falcia interi gruppi.
DRAGO.STANCHEZZA=Creatura leggendaria supportata da un'immensa energia magica interna che previene la fatica fisica.
DRAGO.DANNI_MAGICI=Il vertice della magia naturale. Le sue parole e i suoi soffi elementali sono cataclismi magici devastanti.
DRAGO.DANNI_FISICI=Il vertice della distruzione fisica naturale. I suoi artigli penetrano l'acciaio e i colpi di coda spezzano le mura.
DRAGO.RIGENERAZIONE_SALUTE=Creatura leggendaria dotata di un metabolismo mitologico. Un solo turno di riposo riossigena masse muscolari enormi.
DRAGO.RIGENERAZIONE_MAGIA=Regale. Unione perfetta di carne e magia pura. Il suo corpo millenario assorbe i flussi del mondo a ritmi catastrofici.

# Il gruppo dei non combattenti (vedi PersonaggioNonCombattente)
NON_COMBATTENTE.CARICO_MASSIMO=Struttura slanciata ed elegante. Predilige la mobilità e l'armatura leggera rispetto alla pura massa da trasporto.
NON_COMBATTENTE.CRITICO=Opportunista sul campo di battaglia; sa leggere il ritmo del duello e colpire quando il nemico si scopre per un errore.
NON_COMBATTENTE.PRECISIONE=Precisione umana standard; si affida al tempismo e alla coordinazione base.
NON_COMBATTENTE.VELOCITA=Più scattante della media umana; si affida alla mobilità per muoversi tra le retrovie del campo di battaglia.
NON_COMBATTENTE.FURTIVITA=Abile nell'arte del camuffamento e del depistaggio; sa come passare inosservato tra la folla o muoversi con passo leggero.
NON_COMBATTENTE.PARATA=Linea di Base Umana. Addestrato all'uso di armi da scherma leggere o piccoli buckler.
NON_COMBATTENTE.RESISTENZA_MAGICA=Ottimo osservatore del comportamento umano; nota subito i dettagli fuori posto, i sussurri e i movimenti sospetti.
NON_COMBATTENTE.PERCEZIONE=Ottimo osservatore del comportamento; nota subito i dettagli fuori posto, i sussurri e i movimenti sospetti nel party o tra i nemici.
NON_COMBATTENTE.SOGGEZIONE=Fascino e magnetismo eccezionali. Emana una maestosità teatrale che ammalia gli alleati e soggioga i nemici.
NON_COMBATTENTE.FURIA=Affascinato dalle ballate eroiche e dalle gesta epiche; è propenso a compiere azioni plateali e coraggiose per salvare i compagni.
NON_COMBATTENTE.CORAGGIO=Ha una forte personalità; abituato a stare al centro dell'attenzione e a sfidare il pubblico, non si lascia intimidire dalle minacce fisiche.
NON_COMBATTENTE.VALORE=Affascinato dalle ballate eroiche e dall'epica; è incline a compiere azioni plateali e coraggiose per proteggere il party.
NON_COMBATTENTE.CONTRATTAZIONE=Parlantina da palcoscenico: tra una rima e un complimento, il mercante si ritrova a fare lo sconto senza sapere perché.
NON_COMBATTENTE.NUMERO_BERSAGLI=La sua musica o le sue parole si propagano nell'aria, permettendogli di influenzare più bersagli contemporaneamente.
NON_COMBATTENTE.STANCHEZZA=Standard umano; muoversi e cantare contemporaneamente lo mantiene nella media.
NON_COMBATTENTE.DANNI_MAGICI=Canalizza la magia attraverso l'arte e la musica; i suoi incantesimi d'attacco sono discreti, ma eccelle nei buff.
NON_COMBATTENTE.DANNI_FISICI=Si allena nel movimento e nella coordinazione, ma non focalizza il suo stile sullo sviluppo della forza bruta.
NON_COMBATTENTE.RIGENERAZIONE_SALUTE=La sua stessa musica e il controllo del ritmo respiratorio ne accelerano leggermente il relax muscolare.
NON_COMBATTENTE.RIGENERAZIONE_MAGIA=La sua stessa musica funge da catalizzatore meditativo, accelerando il recupero energetico del party e di se stesso.

