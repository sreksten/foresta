LADRA.CARICO_MASSIMO=Rappresenta il perfetto equilibrio umano per la reattività. Porta solo lo stretto necessario per non farsi sentire.
LADRA.CRITICO=Il Re dei Critici. Studia l'anatomia, attacca dall'ombra e usa armi perforanti nei punti scoperti.
LADRA.PRECISIONE=L'eccellenza della mira. Addestrato a far valere ogni singolo pugnale o dardo d'infamia. Non può permettersi di mancare.
LADRA.VELOCITA=L'eccellenza nei riflessi. Vive di iniziativa e attacchi a sorpresa. Deve agire prima che il nemico estragga l'arma.
LADRA.FURTIVITA=Il Re dell'Ombra. Progettato attorno a questa statistica. Sa sfruttare ogni angolo cieco, cono d'ombra e tecnica di occultamento.
LADRA.PARATA=Linea di Base Umana. Si affida alla parata di reazione con doppi pugnali o armi corte, prediligendo comunque la schivata.
LADRA.RESISTENZA_MAGICA=L'occhio del professionista. Deve avere una percezione altissima per scovare le trappole nemiche e i segreti prima che sia tardi.
LADRA.PERCEZIONE=L'occhio del professionista. Deve avere una percezione altissima per scovare le trappole nemiche, i passaggi segreti e i tesori nascosti.
LADRA.SOGGEZIONE=Preferisce non farsi notare affatto. Se lo vedi, la sua figura non punta a intimidire ma a colpire di sorpresa.
LADRA.FURIA=La Linea di Base. Individualista e pragmatico; aiuta il gruppo solo se questo rientra nei suoi piani di sopravvivenza o profitto.
LADRA.CORAGGIO=La Linea di Base. Pragmatico: non si fa paralizzare dal terrore, ma preferisce ritirarsi tatticamente se la situazione scotta.
LADRA.VALORE=La Linea di Base. Individualista e pragmatico; aiuta il gruppo solo se questo rientra nei suoi piani di sopravvivenza o profitto.
LADRA.CONTRATTAZIONE=La Regina dell'Affare. Sa sempre dove il mercante nasconde il margine e come farglielo mollare senza che se ne accorga.
LADRA.NUMERO_BERSAGLI=Specialista del Bersaglio Singolo. Punta tutto sull'assassinio mirato di un'unica vittima dall'ombra.
LADRA.STANCHEZZA=Abituato a dosare le forze, colpire di precisione e muoversi con fluidità economica senza sprecare fiato.
LADRA.DANNI_MAGICI=La Linea di Base Umana. Rappresenta il potenziale magico di un umano comune che usa la magia solo come utility o trucco di supporto.
LADRA.DANNI_FISICI=La Linea di Base Umana. Forza fisica nella media; compensa il moltiplicatore standard cercando il punto debole (Critico).
LADRA.RIGENERAZIONE_SALUTE=Professionista del movimento economico; sa come rilassare istantaneamente i muscoli e dosare il fiato.
LADRA.RIGENERAZIONE_MAGIA=Individualista e pragmatico; usa piccoli trucchi di utilità ma non ha un canale spirituale aperto per grandi ricariche.

