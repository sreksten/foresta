VIANDANTE.CARICO_MASSIMO=Struttura slanciata ed elegante. Predilige la mobilità e l'armatura leggera rispetto alla pura massa da trasporto.
VIANDANTE.CRITICO=Opportunista sul campo di battaglia; sa leggere il ritmo del duello e colpire quando il nemico si scopre per un errore.
VIANDANTE.PRECISIONE=Precisione umana standard; si affida al tempismo e alla coordinazione base.
VIANDANTE.VELOCITA=Più scattante della media umana; si affida alla mobilità per muoversi tra le retrovie del campo di battaglia.
VIANDANTE.FURTIVITA=Abile nell'arte del camuffamento e del depistaggio; sa come passare inosservato tra la folla o muoversi con passo leggero.
VIANDANTE.PARATA=Linea di Base Umana. Addestrato all'uso di armi da scherma leggere o piccoli buckler.
VIANDANTE.RESISTENZA_MAGICA=Ottimo osservatore del comportamento umano; nota subito i dettagli fuori posto, i sussurri e i movimenti sospetti.
VIANDANTE.PERCEZIONE=Ottimo osservatore del comportamento; nota subito i dettagli fuori posto, i sussurri e i movimenti sospetti nel party o tra i nemici.
VIANDANTE.SOGGEZIONE=Fascino e magnetismo eccezionali. Emana una maestosità teatrale che ammalia gli alleati e soggioga i nemici.
VIANDANTE.FURIA=Affascinato dalle ballate eroiche e dalle gesta epiche; è propenso a compiere azioni plateali e coraggiose per salvare i compagni.
VIANDANTE.CORAGGIO=Ha una forte personalità; abituato a stare al centro dell'attenzione e a sfidare il pubblico, non si lascia intimidire dalle minacce fisiche.
VIANDANTE.VALORE=Affascinato dalle ballate eroiche e dall'epica; è incline a compiere azioni plateali e coraggiose per proteggere il party.
VIANDANTE.CONTRATTAZIONE=Parlantina da palcoscenico: tra una rima e un complimento, il mercante si ritrova a fare lo sconto senza sapere perché.
VIANDANTE.NUMERO_BERSAGLI=La sua musica o le sue parole si propagano nell'aria, permettendogli di influenzare più bersagli contemporaneamente.
VIANDANTE.STANCHEZZA=Standard umano; muoversi e cantare contemporaneamente lo mantiene nella media.
VIANDANTE.DANNI_MAGICI=Canalizza la magia attraverso l'arte e la musica; i suoi incantesimi d'attacco sono discreti, ma eccelle nei buff.
VIANDANTE.DANNI_FISICI=Si allena nel movimento e nella coordinazione, ma non focalizza il suo stile sullo sviluppo della forza bruta.
VIANDANTE.RIGENERAZIONE_SALUTE=La sua stessa musica e il controllo del ritmo respiratorio ne accelerano leggermente il relax muscolare.
VIANDANTE.RIGENERAZIONE_MAGIA=La sua stessa musica funge da catalizzatore meditativo, accelerando il recupero energetico del party e di se stesso.

