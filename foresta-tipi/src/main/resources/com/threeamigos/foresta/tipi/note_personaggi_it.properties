MAGA.CARICO_MASSIMO=Fisico non avvezzo agli sforzi prolungati; preferisce borse leggere per ingredienti alchemici e pergamene.
MAGA.CRITICO=Focalizzati su incantesimi ad area (es. palle di fuoco) o manipolazioni. Non cercano il punto debole anatomico.
MAGA.PRECISIONE=Standard. La coordinazione fisica non è eccelsa, ma compensata dalla precisione nel canalizzare i flussi magici.
MAGA.VELOCITA=Preferisce calcolare la situazione prima di agire; i suoi tempi di reazione fisici sono leggermente sotto la media.
MAGA.FURTIVITA=Concentrato sui suoi studi, non ha un addestramento specifico nel muoversi in silenzio, ma non è nemmeno sgraziato.
MAGA.PARATA=Scarsa forza fisica e nessuna competenza marziale nel frapporre armi o scudi d'acciaio.
MAGA.RESISTENZA_MAGICA=Abituato a percepire le alterazioni della trama magica e l'energia arcana, compensando la vista fisica comune.
MAGA.PERCEZIONE=Abituato a percepire le alterazioni della trama magica e l'energia arcana circostante, compensando la vista fisica comune.
MAGA.SOGGEZIONE=Standard. La sua figura può incutere rispetto per via della conoscenza, ma non è intrinsecamente spaventosa.
MAGA.FURIA=Standard. Si affida alla logica e al dovere tattico per supportare la squadra, senza lo slancio marziale del guerriero.
MAGA.CORAGGIO=Standard. Si affida alla logica e allo studio per analizzare freddamente il pericolo, controllando le emozioni con l'intelletto.
MAGA.VALORE=Standard. Si affida alla logica e al dovere tattico per supportare la squadra, senza lo slancio marziale del guerriero.
MAGA.CONTRATTAZIONE=La Linea di Base. Conosce il valore delle cose, ma ha la testa tra le stelle e raramente discute sul prezzo.
MAGA.NUMERO_BERSAGLI=I maestri dell'AoE. La loro intera dottrina si basa sul canalizzare incantesimi (es. Palle di fuoco o Catene di fulmini) su più nemici.
MAGA.STANCHEZZA=Tra i più fragili. Fisico sedentario non abituato agli sforzi; lo stress di canalizzare l'arcano li sfinisce subito.
MAGA.DANNI_MAGICI=Il Re della Magia Mortale. Ha studiato tutta la vita la struttura matematica dell'arcano; massimizza il danno di ogni singola runa.
MAGA.DANNI_FISICI=Fisico sedentario e debole; non ha alcun addestramento nell'imprimere forza tramite armi da mischia.
MAGA.RIGENERAZIONE_SALUTE=Fisico sedentario, debole e non abituato agli sforzi atletici; richiede molto tempo per riprendere fiato.
MAGA.RIGENERAZIONE_MAGIA=Il Re della Magia Viva. Ha studiato tutta la vita la struttura matematica delle rune; sa esattamente come riallineare i flussi.

MAGO.CARICO_MASSIMO=Fisico non avvezzo agli sforzi prolungati; preferisce borse leggere per ingredienti alchemici e pergamene.
MAGO.CRITICO=Focalizzati su incantesimi ad area (es. palle di fuoco) o manipolazioni. Non cercano il punto debole anatomico.
MAGO.PRECISIONE=Standard. La coordinazione fisica non è eccelsa, ma compensata dalla precisione nel canalizzare i flussi magici.
MAGO.VELOCITA=Preferisce calcolare la situazione prima di agire; i suoi tempi di reazione fisici sono leggermente sotto la media.
MAGO.FURTIVITA=Concentrato sui suoi studi, non ha un addestramento specifico nel muoversi in silenzio, ma non è nemmeno sgraziato.
MAGO.PARATA=Scarsa forza fisica e nessuna competenza marziale nel frapporre armi o scudi d'acciaio.
MAGO.RESISTENZA_MAGICA=Abituato a percepire le alterazioni della trama magica e l'energia arcana, compensando la vista fisica comune.
MAGO.PERCEZIONE=Abituato a percepire le alterazioni della trama magica e l'energia arcana circostante, compensando la vista fisica comune.
