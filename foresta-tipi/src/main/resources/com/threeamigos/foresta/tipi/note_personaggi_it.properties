SACERDOTE.CARICO_MASSIMO=Viaggia leggero: libri di preghiere, simboli sacri e pergamene, niente armature pesanti.
SACERDOTE.CRITICO=Standard. Non cerca il punto debole del nemico: preferisce proteggere i compagni che colpire.
SACERDOTE.PRECISIONE=Buona: la disciplina della preghiera allena la mano ferma, anche se non è un addestramento marziale.
SACERDOTE.VELOCITA=Nella media: la meditazione non rende rapidi, ma nemmeno impacciati.
SACERDOTE.FURTIVITA=Veste e simboli sacri non aiutano a passare inosservati.
SACERDOTE.PARATA=Qualche nozione nel difendersi col bastone, ma nessuna formazione con scudi o armi.
SACERDOTE.RESISTENZA_MAGICA=Il suo credo lo protegge dalle forze oscure e dalle alterazioni magiche.
SACERDOTE.PERCEZIONE=Abituato a vigilare nelle lunghe veglie e a cogliere i segni del male.
SACERDOTE.SOGGEZIONE=Un po' di autorevolezza: il suo ruolo lo rende rispettato, anche se non incute timore.
SACERDOTE.FURIA=Standard. Affronta lo scontro con calma, senza slancio marziale.
SACERDOTE.CORAGGIO=Buon coraggio: la fede lo sostiene davanti al pericolo.
SACERDOTE.VALORE=Un po' sopra la media: si sente responsabile della salvezza del gruppo.
SACERDOTE.CONTRATTAZIONE=La Linea di Base. Non dà molto peso al denaro.
SACERDOTE.NUMERO_BERSAGLI=Standard. Le sue benedizioni toccano tutto il gruppo, ma i suoi attacchi no.
SACERDOTE.STANCHEZZA=Standard. Digiuni e veglie lo hanno temprato più di un mago, meno di un guerriero.
SACERDOTE.DANNI_MAGICI=Buoni: attinge al potere sacro, ma è meno devastante di chi studia solo l'arcano.
SACERDOTE.DANNI_FISICI=Se la cava col bastone e con la mazza, senza essere un combattente.
SACERDOTE.RIGENERAZIONE_SALUTE=Riprende fiato con la preghiera e il riposo, un poco meno di un guerriero.
SACERDOTE.RIGENERAZIONE_MAGIA=La preghiera ricarica i suoi flussi sacri più in fretta di molti incantatori.

