# Le note sui moltiplicatori di classe dei personaggi: perché ciascuna classe ha il valore che ha per un certo attributo.
#
# Lingua: italiano. File in UTF-8. Chiave: TIPO_PERSONAGGIO.ATTRIBUTO, con ATTRIBUTO il nome di un TipoAttributo, più
# DANNI_MAGICI e DANNI_FISICI, che non sono attributi. Per leggerle vedi NoteDeiPersonaggi (foresta-tipi); per una
# lingua nuova si copia questo file in note_personaggi_<lingua>.properties e si traduce.
#
# TIPO.COME=ALTRO dice che il tipo usa le note di ALTRO (un gruppo o un altro tipo). Per una chiave senza nota propria
# vale la voce PREDEFINITA.ATTRIBUTO.

# Le note dei tipi con le caratteristiche proprie
BARDO.CARICO_MASSIMO=Struttura slanciata ed elegante. Predilige la mobilità e l'armatura leggera rispetto alla pura massa da trasporto.
BARDO.CRITICO=Opportunista sul campo di battaglia; sa leggere il ritmo del duello e colpire quando il nemico si scopre per un errore.
BARDO.PRECISIONE=Precisione umana standard; si affida al tempismo e alla coordinazione base.
BARDO.VELOCITA=Più scattante della media umana; si affida alla mobilità per muoversi tra le retrovie del campo di battaglia.
BARDO.FURTIVITA=Abile nell'arte del camuffamento e del depistaggio; sa come passare inosservato tra la folla o muoversi con passo leggero.
BARDO.PARATA=Linea di Base Umana. Addestrato all'uso di armi da scherma leggere o piccoli buckler.
BARDO.RESISTENZA_MAGICA=Ottimo osservatore del comportamento umano; nota subito i dettagli fuori posto, i sussurri e i movimenti sospetti.
BARDO.PERCEZIONE=Ottimo osservatore del comportamento; nota subito i dettagli fuori posto, i sussurri e i movimenti sospetti nel party o tra i nemici.
BARDO.SOGGEZIONE=Fascino e magnetismo eccezionali. Emana una maestosità teatrale che ammalia gli alleati e soggioga i nemici.
BARDO.FURIA=Affascinato dalle ballate eroiche e dalle gesta epiche; è propenso a compiere azioni plateali e coraggiose per salvare i compagni.
BARDO.CORAGGIO=Ha una forte personalità; abituato a stare al centro dell'attenzione e a sfidare il pubblico, non si lascia intimidire dalle minacce fisiche.
BARDO.VALORE=Affascinato dalle ballate eroiche e dall'epica; è incline a compiere azioni plateali e coraggiose per proteggere il party.
BARDO.CONTRATTAZIONE=Parlantina da palcoscenico: tra una rima e un complimento, il mercante si ritrova a fare lo sconto senza sapere perché.
BARDO.NUMERO_BERSAGLI=La sua musica o le sue parole si propagano nell'aria, permettendogli di influenzare più bersagli contemporaneamente.
BARDO.STANCHEZZA=Standard umano; muoversi e cantare contemporaneamente lo mantiene nella media.
BARDO.DANNI_MAGICI=Canalizza la magia attraverso l'arte e la musica; i suoi incantesimi d'attacco sono discreti, ma eccelle nei buff.
BARDO.DANNI_FISICI=Si allena nel movimento e nella coordinazione, ma non focalizza il suo stile sullo sviluppo della forza bruta.
BARDO.RIGENERAZIONE_SALUTE=La sua stessa musica e il controllo del ritmo respiratorio ne accelerano leggermente il relax muscolare.
BARDO.RIGENERAZIONE_MAGIA=La sua stessa musica funge da catalizzatore meditativo, accelerando il recupero energetico del party e di se stesso.

