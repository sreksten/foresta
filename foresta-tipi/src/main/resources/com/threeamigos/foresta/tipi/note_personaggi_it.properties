GUERRIERA.CARICO_MASSIMO=L'archetipo del combattente addestrato a marciare per giorni con piastre d'acciaio addosso.
GUERRIERA.CRITICO=La Linea di Base. Combattimento frontale bilanciato, basato sull'efficacia marziale standard.
GUERRIERA.PRECISIONE=Riceve un bonus grazie all'addestramento marziale costante, alla disciplina e all'uso metodico delle armi.
GUERRIERA.VELOCITA=La Linea di Base. Rapidità e iniziativa umane standard in assetto da combattimento.
GUERRIERA.FURTIVITA=La Linea di Base. Rappresenta l'efficacia umana standard quando non è appesantito da armature metalliche.
GUERRIERA.PARATA=Il Re della Parata Marziale. Addestrato all'uso di scudi a torre, tecniche di deflessione e contrattacchi difensivi.
GUERRIERA.RESISTENZA_MAGICA=La Linea di Base. L'attenzione e l'occhio vigile di un soldato umano addestrato alla guardia.
GUERRIERA.PERCEZIONE=La Linea di Base. L'attenzione, l'occhio vigile e la concentrazione di un soldato umano addestrato alla guardia.
GUERRIERA.SOGGEZIONE=La Linea di Base. La presenza ferma e determinata di un soldato umano corazzato.
GUERRIERA.FURIA=Il Re del Valore. L'archetipo del cavaliere o del protettore addestrato a intercettare i colpi e a fare da baluardo per il gruppo.
GUERRIERA.CORAGGIO=L'essenza del Coraggio Marziale. Addestrato a mantenere salda la linea di sangue, a seguire gli ordini e a guardare la morte in faccia.
GUERRIERA.VALORE=Il Re del Valore. L'archetipo del cavaliere o del protettore addestrato a intercettare i colpi e a fare da baluardo per il gruppo.
GUERRIERA.CONTRATTAZIONE=Paga quello che le chiedono e si fida della stretta di mano: un bersaglio facile per ogni bottegaio.
GUERRIERA.NUMERO_BERSAGLI=L'addestramento marziale gli insegna a eseguire fendenti circolari e a gestire più nemici ingaggiati intorno a lui.
GUERRIERA.STANCHEZZA=La Linea di Base. Un soldato umano atletico e addestrato a gestire la fatica in armatura.
GUERRIERA.DANNI_MAGICI=Il minimo per i viventi. Il suo addestramento è focalizzato al 100% sulla materia fisica e sull'acciaio; rigetta la canalizzazione arcana.
GUERRIERA.DANNI_FISICI=L'eccellenza dell'addestramento umano. Muscolatura d'élite, addestrato a spaccare le armature con spade e mazze.
GUERRIERA.RIGENERAZIONE_SALUTE=Il vertice del condizionamento umano. Addestrato specificamente a ottimizzare i tempi di recupero e a rifatare sotto l'armatura.
GUERRIERA.RIGENERAZIONE_MAGIA=Il minimo per i viventi. Il suo addestramento rigetta l'arcano; la sua mente è focalizzata solo sull'acciaio e sulla tattica fisica.

