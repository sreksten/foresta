ELFA.CARICO_MASSIMO=Struttura slanciata ed elegante. Predilige la mobilità e l'armatura leggera rispetto alla pura massa da trasporto.
ELFA.CRITICO=Grazia, millenni di addestramento e vista acuta garantiscono una precisione nativa superiore alla media umana.
ELFA.PRECISIONE=Tra i migliori. Vista leggendaria, addestramento secolare con l'arco e totale assenza di tremore muscolare.
ELFA.VELOCITA=Leggero, agile e dotato di riflessi biologicamente superiori a quelli umani. Agisce quasi sempre prima dei nemici.
ELFA.FURTIVITA=Passo leggerissimo. Gli elfi camminano sul terreno senza lasciare quasi impronte e sanno fondersi perfettamente con la natura.
ELFA.PARATA=Compensa la minor forza fisica con riflessi fulminei, deviando i colpi nemici con la punta della spada (deflect).
ELFA.RESISTENZA_MAGICA=Cacciatore Leggendario. Vista e udito finissimi; percepisce il respiro di un nemico nascosto a grande distanza.
ELFA.PERCEZIONE=Cacciatore Leggendario. Vista e udito finissimi; percepisce il respiro o il battito cardiaco di un nemico nascosto a grande distanza.
ELFA.SOGGEZIONE=Emana un'eleganza distaccata, eterea e quasi divina che intimidisce i mortali comuni.
ELFA.FURIA=Profondo senso di responsabilità verso la propria stirpe e la natura; combatte con nobiltà e spirito di squadra.
ELFA.CORAGGIO=Distaccato e fiero; guarda i pericoli del mondo con la fredda fermezza di chi ha vissuto per secoli e ha visto regni cadere.
ELFA.VALORE=Profondo senso di responsabilità verso la propria stirpe e la natura; combatte con nobiltà e spirito di squadra.
ELFA.CONTRATTAZIONE=La Linea di Base. Cortese e paziente, tratta con garbo ma considera il mercanteggiare un'usanza un po' volgare.
ELFA.NUMERO_BERSAGLI=Bilanciato: predilige l'accuratezza del colpo singolo, ma la sua grazia gli permette di gestire la linea di fronte.
ELFA.STANCHEZZA=Passo leggero e atletico. La sua fisiologia superiore spreca pochissima energia nei movimenti.
ELFA.DANNI_MAGICI=Superiore alla media umana. Nelle sue vene scorre magia innata; un elfo farà sempre più danni magici di un guerriero o di un ladro.
ELFA.DANNI_FISICI=Slanciato e agile. Nello scontro fisico predilige la destrezza e la precisione (Critico) rispetto alla potenza d'impatto.
ELFA.RIGENERAZIONE_SALUTE=Struttura atletica, leggera e coordinata che spreca pochissima energia e si rigenera con grande efficienza.
ELFA.RIGENERAZIONE_MAGIA=La "trance" elfica permette un riposo mentale e spirituale profondo, attingendo alla magia nativa delle sue vene.

