# Per chi non ha una nota propria
PREDEFINITA.CONTRATTAZIONE=Non entra mai nel gruppo: non tratta con i mercanti.

# Chierico e druido (le forme femminili usano le stesse note)
CHIERICO.CARICO_MASSIMO=Porta armatura, scudo e mazza come un soldato, ma senza il fisico del guerriero.
CHIERICO.CRITICO=Standard. Preferisce reggere il colpo del nemico che cercarne il punto debole.
CHIERICO.PRECISIONE=Nella media: la mazza si maneggia con la forza più che con la mira.
CHIERICO.VELOCITA=Un poco lento: armatura e scudo pesano, e la fede non li alleggerisce.
CHIERICO.FURTIVITA=Armatura e simboli sacri tintinnano: passare inosservato non è il suo mestiere.
CHIERICO.PARATA=Addestrato a difendersi con scudo e armatura: seconda solo al guerriero.
CHIERICO.RESISTENZA_MAGICA=Il suo credo lo protegge dalle forze oscure e dalle alterazioni magiche.
CHIERICO.PERCEZIONE=Nella media: vigila, ma senza le lunghe veglie del sacerdote.
CHIERICO.SOGGEZIONE=Un po' di autorevolezza: il suo ruolo lo rende rispettato.
CHIERICO.FURIA=Standard. Combatte con disciplina, non con slancio.
CHIERICO.CORAGGIO=Buon coraggio: la fede lo sostiene in prima linea.
CHIERICO.VALORE=Sopra la media: si mette davanti per proteggere i compagni.
CHIERICO.CONTRATTAZIONE=La Linea di Base. Non dà molto peso al denaro.
CHIERICO.NUMERO_BERSAGLI=Standard. Le sue preghiere toccano il gruppo, i suoi colpi un nemico alla volta.
CHIERICO.STANCHEZZA=Standard. Digiuni e marce in armatura lo hanno temprato.
CHIERICO.DANNI_MAGICI=Nella media: il suo potere sacro è sincero ma meno profondo di quello del sacerdote.
CHIERICO.DANNI_FISICI=Buoni: mazza e scudo in mano a chi è addestrato a usarli.
CHIERICO.RIGENERAZIONE_SALUTE=Riprende fiato più in fretta del sacerdote: è abituato a tenere la linea.
CHIERICO.RIGENERAZIONE_MAGIA=La preghiera ricarica i suoi flussi sacri, ma meno di chi non combatte.
DRUIDO.CARICO_MASSIMO=Viaggia leggero, con erbe, un bastone e poco metallo.
DRUIDO.CRITICO=Standard. Aspetta che il bosco gli mostri dove il nemico è debole.
DRUIDO.PRECISIONE=Buona: il bastone e la lancia si maneggiano con occhio fermo.
DRUIDO.VELOCITA=Più svelto della media: abituato a muoversi nel sottobosco.
DRUIDO.FURTIVITA=Sa camminare fra gli alberi senza far rumore.
DRUIDO.PARATA=Poco addestrato: niente scudo né armatura di metallo, solo il bastone.
DRUIDO.RESISTENZA_MAGICA=Il legame con la natura lo protegge dalle alterazioni magiche.
DRUIDO.PERCEZIONE=Eccellente: coglie ogni rumore, odore e traccia del bosco.
DRUIDO.SOGGEZIONE=Un po' di autorevolezza: gli animali lo ascoltano, gli uomini meno.
DRUIDO.FURIA=Standard. Affronta lo scontro con calma, come il bosco in autunno.
DRUIDO.CORAGGIO=Buon coraggio: la natura non gli ha mai fatto paura.
DRUIDO.VALORE=Nella media: protegge il gruppo più con gli incantesimi che col corpo.
DRUIDO.CONTRATTAZIONE=La Linea di Base. Baratta volentieri erbe e favori più che monete.
DRUIDO.NUMERO_BERSAGLI=Standard. Le sue radici e il suo sciame afferrano chi capita.
DRUIDO.STANCHEZZA=Poco stancabile: ha le gambe di chi vive all'aperto.
DRUIDO.DANNI_MAGICI=Ottimi: canalizza la terra, l'acqua e i veleni del bosco.
DRUIDO.DANNI_FISICI=Modesti: combatte con il bastone più per difendersi che per colpire.
DRUIDO.RIGENERAZIONE_SALUTE=Riprende fiato con il riposo all'aperto e con le erbe giuste.
DRUIDO.RIGENERAZIONE_MAGIA=Attinge alle forze del bosco e recupera la magia più in fretta di molti incantatori.
CHIERICA.COME=CHIERICO
DRUIDA.COME=DRUIDO
