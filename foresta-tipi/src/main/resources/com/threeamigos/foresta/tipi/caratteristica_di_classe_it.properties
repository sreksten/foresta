# I testi di CaratteristicaDiClasse (vedi Testi): una voce per tipo di caratteristica.
#
# Lingua: italiano. File in UTF-8. {0} è il nome del tipo di danno, dell'incantesimo o dell'effetto di stato, {1} il moltiplicatore del
# danno. Per una lingua nuova si copia questo file in caratteristica_di_classe_<lingua>.properties e si traduce: quel che manca in una
# traduzione si legge in italiano.

DANNO.IMMUNE=Immune ai danni di tipo {0}
DANNO.RESISTE=Resiste ai danni di tipo {0} (x{1})
DANNO.DEBOLE=Debole ai danni di tipo {0} (x{1})
INCANTESIMO.IMMUNE=Immune all'{0}
INCANTESIMO.TUTTI=Immune a ogni incantesimo
EFFETTO.IMMUNE=Immune all'effetto "{0}"

# I nomi dei due moltiplicatori che non sono attributi (vedi MoltiplicatoreDiClasse)
NOME.DANNI_MAGICI=Danni magici
NOME.DANNI_FISICI=Danni fisici

# Le capacità innate che non hanno un testo loro altrove (vedi AbilitaInnataDiClasse): il dardo arcano di Mago ed Elfo
ABILITA.DARDO_ARCANO.NOME=Dardo arcano
ABILITA.DARDO_ARCANO.DESCRIZIONE=Un dardo di energia arcana su un solo bersaglio, che costa magia ma non consuma pergamene.
