# testo_tattica: English (British). UTF-8 file. Only the entries that differ from the American English file.

spiega.filtro.IMMUNE_A=Takes no damage at all of a certain type, because of their class or equipment (for example wearing armour that gives fire resistance). On oneself, it checks whether the character is protected from that damage.
spiega.azione.GRIDO_DI_BATTAGLIA=A cry that gives courage and valour to the whole party for a few turns. It is not cast if everyone is already under the battle cry.
spiega.azione.RADICI=The druid's ability that deals earth damage to several opponents, and may immobilise or blind them. It costs no scrolls.
