# I testi con cui la schermata delle tattiche descrive una tattica mentre il giocatore la modifica (vedi TestoTattica e
# BozzaTattica, in tattiche.modifica): le etichette dei menu e la frase che spiega una riga (il riquadro destro).
#
# Lingua: italiano. File in UTF-8. {0}, {1}... sono i valori che il codice inserisce nella frase. Per una lingua nuova si copia
# questo file in testo_tattica_<lingua>.properties e si traduce: quel che manca in una traduzione si legge in italiano.
#
# Gruppi di chiavi:
#   confronto.*, criterio.*       il confronto e il criterio di scelta dell'incantesimo, a parole
#   relazione.NON, filtro.*, ...  i pezzi con cui si compone una frase (un filtro, un selettore, una condizione, un'azione)
#   riga.*, spiegazione.*         la riga corta di una voce e la spiegazione per esteso
#   spiega.<enumerato>.COSTANTE   il testo del riquadro destro per ogni valore degli enumerati: se il motore cambia il
#                                 comportamento di uno di loro va cambiato anche il suo testo
#   voce.*, problema.*            il nome di una voce senza nome e i motivi per cui una bozza non si conferma

# ---- i pezzi con cui si compongono le frasi
relazione.NON=non {0}
filtro.SENZA=senza {0}
filtri.CON_FILTRI={0} ({1})
selettore.CON_ORDINAMENTO={0}: {1}
predicato.PROBABILITA=nel {0}% dei casi
predicato.PROBABILITA_NEGATA=non nel {0}% dei casi
predicato.QUANTI=quanti: {0}
azione.CON_CRITERIO={0}: {1}
azione.ARMA_DI={0} di {1}
azione.SOLO_SE_PIU_FORTE={0}, solo se più forte dell'attacco
riga.OPPURE=oppure
riga.SU={0} su {1}

# ---- la spiegazione per esteso di una voce
spiegazione.DISATTIVATA=Voce disattivata: viene saltata.
spiegazione.SEMPRE=Sempre, se si può fare.
spiegazione.SE=Se {0};
spiegazione.SU=su: {0}.
spiegazione.FA=fa: {0}.
spiegazione.REGOLA=La prima azione che si può fare vince; se nessuna si può fare, passa alla voce dopo.

# ---- il confronto rovesciato, nel riquadro destro
spiega.confronto.NEGATO=Il contrario: vale quando il valore NON è {0} il numero.

# ---- le voci della bozza
voce.NOME_PREDEFINITO=Tattica {0}
problema.VOCE_SENZA_AZIONI=la voce {0} non ha azioni

# ---- il criterio di scelta dell'incantesimo
criterio.A_CASO=a caso
criterio.PIU_POTENTE=il più potente
criterio.PIU_ADATTO=il più adatto al bersaglio
criterio.PIU_ADATTO_ESPERTO=il più adatto, conoscendo l'equipaggiamento
criterio.PIU_ECONOMICO_CHE_BASTA=il minimo sufficiente a ucciderlo

# ---- il confronto a parole
confronto.MINORE=minore di
confronto.UGUALE=uguale a
confronto.MAGGIORE=maggiore di

# ---- riquadro destro: le rose
spiega.rosa.SE_STESSO=Solo il personaggio che sta decidendo.
spiega.rosa.ALLEATI=I compagni vivi e in campo, lui compreso.
spiega.rosa.ALLEATI_CADUTI=I compagni caduti (non in panchina): servono per la Resurrezione.
spiega.rosa.AVVERSARI=I nemici vivi e in campo.
spiega.rosa.OSPITI=Gli ospiti vulnerabili vivi, cioè chi viaggia con il gruppo e va protetto (un ostaggio, un ferito da soccorrere).
spiega.rosa.ALLEATI_E_OSPITI=I compagni e poi gli ospiti vulnerabili: per le cure.
spiega.rosa.AVVERSARI_E_OSPITI=Gli avversari e poi gli ospiti vulnerabili (solo i mostri).

# ---- riquadro destro: i filtri
spiega.filtro.SALUTE=La salute attuale, in punti, confrontata con un numero.
spiega.filtro.SALUTE_PERCENTUALE=La salute attuale rispetto alla massima, in percentuale (50 vuol dire a metà).
spiega.filtro.MAGIA=La magia attuale, in punti, confrontata con un numero.
spiega.filtro.LIVELLO=Il livello, confrontato con un numero.
spiega.filtro.LIVELLO_RISPETTO_AL_MIO=Il livello del bersaglio confrontato con quello del personaggio corrente.
spiega.filtro.CLASSE=La classe del personaggio (indipendentemente dal sesso).
spiega.filtro.CATEGORIA=La categoria di creatura: umanoide, bestia, non morto, volante, draconico, gigantesco, ibrido, costrutto (ne basta una).
spiega.filtro.STATO=Ha un certo effetto di stato attivo (silenziato, bagnato, avvelenato...).
spiega.filtro.STATO_NEGATIVO=Ha almeno un effetto di stato che è un male da togliere (avvelenato, stordito, silenziato...): non conta l'ispirazione del Bardo né il berserk del Guerriero.
spiega.filtro.MAGICO=Può lanciare magie: non è silenziato e ha abbastanza magia per formularle (abilità innate o un incantesimo a disposizione). Chi non ha poteri innati conta solo dopo aver lanciato il suo primo incantesimo nello scontro.
spiega.filtro.DEBOLE_A=Subisce più danno di un certo tipo, per la sua classe o per i suoi stati. Su se stessi controlla se il personaggio è esposto a quel tipo di danno.
spiega.filtro.DEBOLE_ALL_AZIONE=È debole al tipo di danno dell'azione che la voce sta per fare (per esempio per una interazione elementale).
spiega.filtro.IMMUNE_A=Non subisce alcun danno di un certo tipo, per la sua classe o per l'equipaggiamento (per esempio ha un'armatura che dà resistenza al fuoco). Su se stessi controlla se il personaggio è protetto da quel danno.
spiega.filtro.IL_CAPO=È il capo del suo gruppo (se cade, la partita è persa). Serve a scegliere un bersaglio, non a contare.
spiega.filtro.ME_STESSO=È il personaggio che sta decidendo. Serve a scegliere un bersaglio, non a contare.
spiega.filtro.SCELTO_L_ULTIMA_VOLTA=È l'ultimo avversario o alleato che il personaggio ha scelto con una sua azione: per non cambiare obiettivo a metà. Serve a scegliere un bersaglio, non a contare.
spiega.filtro.MI_HA_ATTACCATO_PER_ULTIMO=È il nemico che ha colpito per ultimo il personaggio: per vendicarsi. Ha senso solo fra gli avversari, e serve a scegliere un bersaglio, non a contare.
spiega.filtro.ARMA_CHE_DA=Ha in mano un'arma (principale o secondaria) che dà un certo tipo di danno. Su se stessi serve al cambio d'arma, per non cambiare se ce l'ha già.

# ---- riquadro destro: le condizioni
spiega.predicato.QUANTI=Quanti candidati ci sono in una rosa dopo i filtri. Serve a controllare che esista qualcuno (maggiore di 0) o a contare.
spiega.predicato.ROUND=Il numero del round dello scontro (il primo è 1).
spiega.predicato.ASTUZIA=L'astuzia del personaggio: l'intelligenza massima della sua classe, che sale col livello. Divide i mostri in fasce.
spiega.predicato.INTELLIGENZA=L'intelligenza attuale del personaggio.
spiega.predicato.PROBABILITA=Vera solo in una certa percentuale dei casi: serve a non fare sempre la stessa cosa.
spiega.predicato.VOCE_USATA=Quante volte il personaggio ha già usato questa voce nello scontro.
spiega.predicato.ROUND_DALL_ULTIMO_USO=Quanti round sono passati dall'ultima volta che il personaggio ha usato questa voce.

# ---- riquadro destro: gli ordinamenti
spiega.ordinamento.PRIMO=Il primo dei candidati rimasti, nell'ordine del gruppo.
spiega.ordinamento.A_CASO=Uno a caso, tutti con la stessa probabilità.
spiega.ordinamento.MENO_SALUTE=Quello con meno salute.
spiega.ordinamento.PIU_SALUTE=Quello con più salute.
spiega.ordinamento.LIVELLO_PIU_BASSO=Quello di livello più basso.
spiega.ordinamento.LIVELLO_PIU_ALTO=Quello di livello più alto.
spiega.ordinamento.PIU_DEBOLE_A=Quello che subisce più danno da un certo tipo di danno.
spiega.ordinamento.PIU_RESISTENTE_A=Quello che subisce meno danno da un certo tipo di danno (un immune è il più resistente).
spiega.ordinamento.ULTIMO_ATTACCANTE=Il nemico che ha colpito per ultimo il personaggio: per vendicarsi. Se non c'è fra i candidati la voce non si esegue e si passa alla successiva.
spiega.ordinamento.ULTIMO_SCELTO=L'ultimo avversario o alleato che il personaggio ha scelto con una sua azione: per non cambiare obiettivo a metà. Se non c'è fra i candidati la voce non si esegue e si passa alla successiva.
spiega.ordinamento.PIU_MAGIA=Quello con più magia.
spiega.ordinamento.MENO_MAGIA=Quello con meno magia.

# ---- riquadro destro: il criterio di scelta
spiega.criterio.A_CASO=Uno a caso fra gli incantesimi che può lanciare.
spiega.criterio.PIU_POTENTE=Quello con più danno base, senza guardare le debolezze del bersaglio.
spiega.criterio.PIU_ADATTO=Quello che fa più danno atteso su quel bersaglio, con le sue debolezze e resistenze di classe e di stato.
spiega.criterio.PIU_ADATTO_ESPERTO=Come il più adatto, ma tiene conto anche dell'equipaggiamento già osservato del bersaglio.
spiega.criterio.PIU_ECONOMICO_CHE_BASTA=Fra quelli che bastano a uccidere il bersaglio, il meno caro; se nessuno basta, il più adatto conoscendo l'equipaggiamento.

# ---- riquadro destro: le azioni
spiega.azione.ATTACCO_FISICO=Attacca con le armi. Si può sempre fare.
spiega.azione.ARIA=Lancia l'incantesimo se la pergamena è disponibile e ha la Magia sufficiente per formularlo. Non viene lanciato se il bersaglio è immune.
spiega.azione.ACQUA=Lancia l'incantesimo se la pergamena è disponibile e ha la Magia sufficiente per formularlo. Non viene lanciato se il bersaglio è immune.
spiega.azione.TERRA=Lancia l'incantesimo se la pergamena è disponibile e ha la Magia sufficiente per formularlo. Non viene lanciato se il bersaglio è immune.
spiega.azione.FUOCO=Lancia l'incantesimo se la pergamena è disponibile e ha la Magia sufficiente per formularlo. Non viene lanciato se il bersaglio è immune.
spiega.azione.FULMINE=Lancia l'incantesimo se la pergamena è disponibile e ha la Magia sufficiente per formularlo. Non viene lanciato se il bersaglio è immune.
spiega.azione.GELO=Lancia l'incantesimo se la pergamena è disponibile e ha la Magia sufficiente per formularlo. Non viene lanciato se il bersaglio è immune.
spiega.azione.VELENO=Lancia l'incantesimo se la pergamena è disponibile e ha la Magia sufficiente per formularlo. Non viene lanciato se il bersaglio è immune.
spiega.azione.MORTE=Il colpo di grazia: se va a segno su chi ha meno di un quarto della salute lo uccide, altrimenti si ritorce contro chi lo lancia. Usalo solo su bersagli quasi caduti.
spiega.azione.SILENZIO=Impedisce al bersaglio di fare magie per un po'. Non si lancia su chi è già silenziato o è immune.
spiega.azione.LUCE_DIVINA=L'abilità del sacerdote che fa danno sacro a più avversari (il doppio ai non morti) e investe anche i non morti del gruppo. Non costa pergamene.
spiega.azione.INCANTESIMO_DI_DANNO=Uno dei sette incantesimi elementali che può lanciare, scelto con un criterio. Con "solo se più forte" si lancia solo se rende più dell'attacco con le armi.
spiega.azione.INCANTESIMO_DEL_REPERTORIO=Uno degli incantesimi del repertorio di un mostro, scelto con un criterio.
spiega.azione.DARDO_ARCANO=Il dardo arcano di maghi ed elfi: non costa pergamene, solo magia.
spiega.azione.RESURREZIONE=Riporta in vita un compagno caduto. Serve la pergamena nella scorta e la magia. Funziona solo se ci sono compagni caduti.
spiega.azione.ALBA_SACRA=L'Alba sacra dei sacerdoti toglie gli stati negativi a tutto il gruppo. Viene lanciato solo se qualcuno ne ha uno.
spiega.azione.CANTO_CURATIVO=Il canto del bardo che cura un compagno ferito.
spiega.azione.CANTO_IPNOTICO=Il canto del bardo che spaventa o confonde gli avversari.
spiega.azione.URLO_DELLA_BANSHEE=L'urlo che spaventa e confonde gli avversari, con più probabilità del canto ipnotico. Il bardo lo impara durante il gioco.
spiega.azione.CANTO_DI_VALORE=Il canto del bardo che rafforza coraggio e precisione di tutto il gruppo. Si canta solo se qualcuno non è già ispirato.
spiega.azione.SCACCIARE_I_NON_MORTI=L'abilità del chierico che spaventa i non morti, a seconda del loro coraggio. Si usa solo se c'è un non morto non già spaventato.
spiega.azione.IMPOSIZIONE_DELLE_MANI=L'abilità del chierico che cura un compagno ferito, poco ma senza pergamene.
spiega.azione.RADICI=L'abilità del druido che fa danno di terra a più avversari, e può immobilizzarli o accecarli. Non costa pergamene.
spiega.azione.SCIAME=L'abilità del druido che fa danno di veleno a più avversari, e può avvelenarli. Non costa pergamene.
spiega.azione.PELLE_DI_CORTECCIA=L'abilità del druido che rafforza parata e resistenza magica di tutto il gruppo per qualche turno. Si usa solo se qualcuno non l'ha già.
spiega.azione.RIGENERAZIONE=L'abilità del druido che fa guarire un compagno ferito un poco a ogni turno. Non si usa su chi si rigenera già.
spiega.azione.POZIONE_SALUTE=Beve una pozione della Salute dalla scorta del gruppo. Funziona solo se il bersaglio è ferito.
spiega.azione.POZIONE_MAGIA=Beve una pozione della Magia dalla scorta del gruppo. Funziona solo se la magia non è piena.
spiega.azione.POZIONE_SALUTE_GRANDE=Beve una pozione della Salute grande, che ridà molta più salute e ne aumenta il livello massimo. Funziona solo se il bersaglio è ferito.
spiega.azione.POZIONE_MAGIA_GRANDE=Beve una pozione della Magia grande, che ridà molta più magia e ne aumenta il livello massimo. Funziona solo se la magia non è piena.
spiega.azione.CAMBIA_ARMA=Prende un'arma del gruppo che dia un certo tipo di danno. Conta come l'azione del turno.

# ---- riquadro destro: il confronto
spiega.confronto.MINORE=Il valore è minore del numero.
spiega.confronto.UGUALE=Il valore è uguale al numero.
spiega.confronto.MAGGIORE=Il valore è maggiore del numero.
