# testo_tattica: English (American). UTF-8 file. Same keys as the Italian file;
# an entry missing here is read from the parent language and then from Italian.

relazione.NON=not {0}
filtro.SENZA=without {0}
filtri.CON_FILTRI={0} ({1})
selettore.CON_ORDINAMENTO={0}: {1}
predicato.PROBABILITA=in {0}% of cases
predicato.PROBABILITA_NEGATA=not in {0}% of cases
predicato.QUANTI=how many: {0}
azione.CON_CRITERIO={0}: {1}
azione.ARMA_DI={0} ({1} damage)
azione.SOLO_SE_PIU_FORTE={0}, only if stronger than the attack
riga.OPPURE=or
riga.SU={0} on {1}

spiegazione.DISATTIVATA=Entry disabled: it is skipped.
spiegazione.SEMPRE=Always, if it can be done.
spiegazione.SE=If {0};
spiegazione.SU=on: {0}.
spiegazione.FA=does: {0}.
spiegazione.REGOLA=The first action that can be done wins; if none can be done, it moves on to the next entry.

spiega.confronto.NEGATO=The opposite: it holds when the value is NOT {0} the number.

voce.NOME_PREDEFINITO=Tactic {0}
problema.VOCE_SENZA_AZIONI=entry {0} has no actions

criterio.A_CASO=at random
criterio.PIU_POTENTE=the most powerful
criterio.PIU_ADATTO=the best suited to the target
criterio.PIU_ADATTO_ESPERTO=the best suited, knowing the equipment
criterio.PIU_ECONOMICO_CHE_BASTA=the minimum sufficient to kill it

confronto.MINORE=less than
confronto.UGUALE=equal to
confronto.MAGGIORE=greater than

spiega.rosa.SE_STESSO=Only the character who is deciding.
spiega.rosa.ALLEATI=The living companions on the field, including themselves.
spiega.rosa.ALLEATI_CADUTI=The fallen companions (not on the bench): needed for Resurrection.
spiega.rosa.AVVERSARI=The living enemies on the field.
spiega.rosa.OSPITI=The living vulnerable guests, that is, those who travel with the party and must be protected (a hostage, a wounded person to rescue).
spiega.rosa.ALLEATI_E_OSPITI=The companions and then the vulnerable guests: for healing.
spiega.rosa.AVVERSARI_E_OSPITI=The opponents and then the vulnerable guests (monsters only).

spiega.filtro.SALUTE=Current health, in points, compared with a number.
spiega.filtro.SALUTE_PERCENTUALE=Current health relative to the maximum, as a percentage (50 means half).
spiega.filtro.MAGIA=Current magic, in points, compared with a number.
spiega.filtro.LIVELLO=The level, compared with a number.
spiega.filtro.LIVELLO_RISPETTO_AL_MIO=The target's level compared with that of the current character.
spiega.filtro.CLASSE=The character's class (regardless of sex).
spiega.filtro.CATEGORIA=The creature category: humanoid, beast, undead, flying, draconic, gigantic, hybrid, construct (any one will do).
spiega.filtro.STATO=Has a certain status effect active (silenced, soaked, poisoned...).
spiega.filtro.STATO_NEGATIVO=Has at least one status effect that is an ill to be removed (poisoned, stunned, silenced...): the Bard's inspiration and the Warrior's berserk do not count.
spiega.filtro.MAGICO=Can cast spells: is not silenced and has enough magic to cast them (innate abilities or a spell available). Whoever has no innate powers counts only after casting their first spell in the fight.
spiega.filtro.DEBOLE_A=Takes more damage of a certain type, because of their class or their statuses. On oneself, it checks whether the character is exposed to that type of damage.
spiega.filtro.DEBOLE_ALL_AZIONE=Is weak to the damage type of the action the entry is about to perform (for example for an elemental interaction).
spiega.filtro.IMMUNE_A=Takes no damage at all of a certain type, because of their class or equipment (for example wearing armor that gives fire resistance). On oneself, it checks whether the character is protected from that damage.
spiega.filtro.IL_CAPO=Is the leader of their party (if they fall, the game is lost). Used to choose a target, not to count.
spiega.filtro.ME_STESSO=Is the character who is deciding. Used to choose a target, not to count.
spiega.filtro.SCELTO_L_ULTIMA_VOLTA=Is the last opponent or ally the character chose with one of their actions: so as not to switch targets midway. Used to choose a target, not to count.
spiega.filtro.MI_HA_ATTACCATO_PER_ULTIMO=Is the enemy who last hit the character: for revenge. Makes sense only among the opponents, and is used to choose a target, not to count.
spiega.filtro.ARMA_CHE_DA=Holds a weapon (main or off hand) that deals a certain type of damage. On oneself it serves the weapon switch, so as not to switch if they already have it.

spiega.predicato.QUANTI=How many candidates there are in a set after the filters. Used to check that someone exists (greater than 0) or to count.
spiega.predicato.ROUND=The round number of the fight (the first is 1).
spiega.predicato.ASTUZIA=The character's cunning: the maximum intelligence of their class, which rises with level. It divides the monsters into tiers.
spiega.predicato.INTELLIGENZA=The character's current intelligence.
spiega.predicato.PROBABILITA=True only in a certain percentage of cases: used to avoid always doing the same thing.
spiega.predicato.VOCE_USATA=How many times the character has already used this entry in the fight.
spiega.predicato.ROUND_DALL_ULTIMO_USO=How many rounds have passed since the character last used this entry.

spiega.ordinamento.PRIMO=The first of the remaining candidates, in party order.
spiega.ordinamento.A_CASO=One at random, all with the same probability.
spiega.ordinamento.MENO_SALUTE=The one with less health.
spiega.ordinamento.PIU_SALUTE=The one with more health.
spiega.ordinamento.LIVELLO_PIU_BASSO=The one of lowest level.
spiega.ordinamento.LIVELLO_PIU_ALTO=The one of highest level.
spiega.ordinamento.PIU_DEBOLE_A=The one that takes the most damage from a certain damage type.
spiega.ordinamento.PIU_RESISTENTE_A=The one that takes the least damage from a certain damage type (an immune one is the most resistant).
spiega.ordinamento.ULTIMO_ATTACCANTE=The enemy who last hit the character: for revenge. If it is not among the candidates the entry is not executed and the next one is tried.
spiega.ordinamento.ULTIMO_SCELTO=The last opponent or ally the character chose with one of their actions: so as not to switch targets midway. If it is not among the candidates the entry is not executed and the next one is tried.
spiega.ordinamento.PIU_MAGIA=The one with more magic.
spiega.ordinamento.MENO_MAGIA=The one with less magic.

spiega.criterio.A_CASO=One at random among the spells that can be cast.
spiega.criterio.PIU_POTENTE=The one with the most base damage, ignoring the target's weaknesses.
spiega.criterio.PIU_ADATTO=The one that deals the most expected damage on that target, with its class and status weaknesses and resistances.
spiega.criterio.PIU_ADATTO_ESPERTO=Like the best suited, but also takes into account the target's already observed equipment.
spiega.criterio.PIU_ECONOMICO_CHE_BASTA=Among those sufficient to kill the target, the cheapest; if none suffices, the best suited knowing the equipment.

spiega.azione.ATTACCO_FISICO=Attacks with weapons. It can always be done.
spiega.azione.ARIA=Casts the spell if the scroll is available and there is enough Magic to cast it. It is not cast if the target is immune.
spiega.azione.ACQUA=Casts the spell if the scroll is available and there is enough Magic to cast it. It is not cast if the target is immune.
spiega.azione.TERRA=Casts the spell if the scroll is available and there is enough Magic to cast it. It is not cast if the target is immune.
spiega.azione.FUOCO=Casts the spell if the scroll is available and there is enough Magic to cast it. It is not cast if the target is immune.
spiega.azione.FULMINE=Casts the spell if the scroll is available and there is enough Magic to cast it. It is not cast if the target is immune.
spiega.azione.GELO=Casts the spell if the scroll is available and there is enough Magic to cast it. It is not cast if the target is immune.
spiega.azione.VELENO=Casts the spell if the scroll is available and there is enough Magic to cast it. It is not cast if the target is immune.
spiega.azione.MORTE=The coup de grace: if it hits someone with less than a quarter of their health it kills them, otherwise it backfires on the caster. Use it only on nearly fallen targets.
spiega.azione.SILENZIO=Prevents the target from casting for a while. It is not cast on someone already silenced or immune.
spiega.azione.NEBBIA=Wraps the battlefield in a fog: for a few turns all the opponents hit with less accuracy. It is not cast if they are already in the fog or are immune.
spiega.azione.NEGA_MAGIA=Removes magic power from all the opponents for a few turns: their spells deal less damage. It is not cast if no opponent is a caster who is not already affected or immune.
spiega.azione.GRIDO_DI_BATTAGLIA=A cry that gives courage and valor to the whole party for a few turns. It is not cast if everyone is already under the battle cry.
spiega.azione.TERREMOTO=A light Earth damage to all the opponents, which sometimes makes them fall. It is not cast if no one is on the field, or if they are all immune.
spiega.azione.TEMPESTA=A lightning storm that hits all the opponents but also the companions of whoever casts it. It is not cast if the companions to be hit would outnumber the opponents.
spiega.azione.TERRORE=A fear check on all the opponents: whoever fails stays frightened for a few turns. It is not cast if they are all already frightened or immune.
spiega.azione.LUCE_DIVINA=The priest's ability that deals holy damage to several opponents (double to the undead) and also strikes the undead in the party. It costs no scrolls.
spiega.azione.INCANTESIMO_DI_DANNO=One of the seven elemental spells that can be cast, chosen by a criterion. With “only if stronger” it is cast only if it yields more than the attack with weapons.
spiega.azione.INCANTESIMO_DEL_REPERTORIO=One of the spells in a monster's repertoire, chosen by a criterion.
spiega.azione.DARDO_ARCANO=The arcane bolt of mages and elves: it costs no scrolls, only magic.
spiega.azione.MARTELLO_SACRO=The cleric's ability: a hammer blow of holy damage on a single opponent, double against the undead. It costs magic and can be repeated only after a few turns.
spiega.azione.ATTACCO_ALLE_SPALLE=The thief's ability: a weapon strike that always hits and is always a critical. It costs no magic, but can be repeated only after a few turns and at least three characters are needed in the party: two distract the opponents and the thief strikes.
spiega.azione.RESURREZIONE=Brings a fallen companion back to life. It needs the scroll in the supplies and the magic. It works only if there are fallen companions.
spiega.azione.ALBA_SACRA=The priests' Holy Dawn removes the negative statuses from the whole party. It is cast only if someone has one.
spiega.azione.CANTO_CURATIVO=The bard's song that heals a wounded companion.
spiega.azione.CANTO_IPNOTICO=The bard's song that frightens or confuses the opponents.
spiega.azione.URLO_DELLA_BANSHEE=The wail that frightens and confuses the opponents, with a better chance than the hypnotic song. The bard learns it during the game.
spiega.azione.CANTO_DI_VALORE=The bard's song that strengthens courage and accuracy of the whole party. It is sung only if someone is not already inspired.
spiega.azione.SCACCIARE_I_NON_MORTI=The cleric's ability that frightens the undead, according to their courage. It is used only if there is an undead that is not already frightened.
spiega.azione.IMPOSIZIONE_DELLE_MANI=The cleric's ability that heals a wounded companion, a little but without scrolls.
spiega.azione.RADICI=The druid's ability that deals earth damage to several opponents, and may immobilize or blind them. It costs no scrolls.
spiega.azione.SCIAME=The druid's ability that deals poison damage to several opponents, and may poison them. It costs no scrolls.
spiega.azione.PELLE_DI_CORTECCIA=The druid's ability that strengthens the parry and magic resistance of the whole party for a few turns. It is used only if someone does not already have it.
spiega.azione.RIGENERAZIONE=The druid's ability that makes a wounded companion heal a little every turn. It is not used on someone who is already regenerating.
spiega.azione.POZIONE_SALUTE=Drinks a Health potion from the party's supplies. It works only if the target is wounded.
spiega.azione.POZIONE_MAGIA=Drinks a Magic potion from the party's supplies. It works only if magic is not full.
spiega.azione.POZIONE_SALUTE_GRANDE=Drinks a large Health potion, which restores much more health and raises its maximum level. It works only if the target is wounded.
spiega.azione.POZIONE_PANACEA=Drinks a panacea from the party's supplies, which removes all negative status effects from the target. It works only if the target has at least one.
spiega.azione.POZIONE_MAGIA_GRANDE=Drinks a large Magic potion, which restores much more magic and raises its maximum level. It works only if magic is not full.
spiega.azione.CAMBIA_ARMA=Takes a weapon from the party that deals a certain type of damage. It counts as the turn's action.

spiega.confronto.MINORE=The value is less than the number.
spiega.confronto.UGUALE=The value is equal to the number.
spiega.confronto.MAGGIORE=The value is greater than the number.
problema.PORTATE_DIVERSE=the actions of an entry must have the same scope: {0} is not {1}
problema.ROSA_NON_VALE=the pool {0} does not apply to {1}
problema.ROSA_NON_ACCETTATA={0} does not accept the pool {1}
problema.CHI_PERSONAGGI=the player's characters
problema.CHI_MOSTRI=the monsters
